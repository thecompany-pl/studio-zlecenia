<script>
// ================= ZLECENIA STUDYJNE (realizacje) =================
// Nagrania w studiu, avatary, webinary, transmisje live, obsługa wyjazdowa. Każde zlecenie czeka na akceptację.
// Uwaga: jak w app_js — bez ukośnika z gwiazdką i bez podwójnego ukośnika w tekstach (Apps Script tnie stronę).

const RS = () => B.rea.statuses, TS = () => B.rea.termStatuses;
const DAYCACHE = {};            // zajętość dni: { 'YYYY-MM-DD': { workday, busy } }
let RW = null;                  // kreator realizacji
const RSTEPS = 5;

function hmMin(hm) { return sr_min(hm); }
function nTerms(n) { return n + ' ' + (n === 1 ? 'termin' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'terminy' : 'terminów'); }
function minHm(n) { return sr_hm(n); }
function fmtDay(ymd, long) { const [y, m, d] = ymd.split('-'); return (long ? DAYS_LONG : DAYS)[dl_weekday(ymd)] + ' ' + d + '.' + m + (long ? '.' + y : ''); }
function termLine(t) { return fmtDay(t.date, true) + ', ' + t.start + '–' + t.end + (t.ready && t.ready !== t.start ? ' · gotowość ' + t.ready : ''); }
function reaPill(s) {
  const c = s === RS().ok || s === TS().ok ? 'ok' : s === RS().pending || s === TS().pending ? 'wait' : s === RS().proposal || s === TS().proposal ? 'prop' : s === RS().done ? 'done' : 'off';
  return `<span class="bk-pill ${c}">${esc(s)}</span>`;
}
function isAwayD(d) { return d.kind === 'wyjazd' || (d.kind === 'live' && d.liveAway); }
function kindOf(k) { return B.rea.kinds.find(x => x.key === k) || { label: k }; }
function hs() { return dl_holidaySet(HOL); }

function studioNavItems() {
  const it = [['/studio/nowa', 'Nowa realizacja'], ['/studio/moje', 'Moje realizacje']];
  if (isStudio() || B.canApproveRea) it.push(['/studio/kalendarz', 'Kalendarz studia']);
  if (B.canApproveRea) it.push(['/studio/akceptacja', 'Do akceptacji']);
  return it;
}

function refreshReaCount() {
  if (!B.canApproveRea) return;
  api('listRealizations', 'pending').then(l => { B.reaPending = l.length; renderTop(); }).catch(() => {});
}

function renderStudio(r) {
  if (r === '/studio') return nav.replace(B.canApproveRea && B.reaPending ? '/studio/akceptacja' : (isStudio() || B.canApproveRea) ? '/studio/kalendarz' : '/studio/nowa');
  if (r === '/studio/nowa') return viewReaWizard();
  if (r === '/studio/gotowe') return;
  if (r === '/studio/moje') return viewReaList('mine');
  if (r === '/studio/akceptacja' && B.canApproveRea) return viewReaList('pending');
  if (r === '/studio/kalendarz' && (isStudio() || B.canApproveRea)) return viewStudioCal();
  const m = r.match(/^\/(realizacja|rezerwacja)\/(.+)$/);
  if (m) return viewRea(decodeURIComponent(m[2]));
  nav.replace('/studio/nowa');
}

// ---------- ekran wyboru przy pierwszym wejściu ----------

function viewStart() {
  setProg(0);
  $('#app').innerHTML = `<section class="view start"><div class="eyebrow">Studio TC</div><h1 class="h1">Czego potrzebujesz?</h1>
    <p class="lead">Wybierz rodzaj zlecenia. Między sekcjami przełączysz się w każdej chwili na górze strony.</p>
    <div class="start-grid">
      <button class="start-card" data-go="${isStudio() ? '/tablica' : '/nowe'}"><span class="st-ic">${ICON.rolka}</span><span class="st-t">Potrzebuję montażu</span><span class="st-d">Rolka, trailer, showreel, avatar — wrzucasz brief i materiały, studio montuje.</span></button>
      <button class="start-card" data-go="/studio"><span class="st-ic">${ICON.avatar}</span><span class="st-t">Potrzebuję studia / ekipy</span><span class="st-d">Nagranie w studiu, webinar, transmisja live albo ekipa z kamerą na wyjeździe.</span></button>
    </div></section>`;
}

// ---------- zajętość dni ----------

async function ensureDays(dates) {
  const miss = [...new Set(dates)].filter(d => !DAYCACHE[d]);
  for (let i = 0; i < miss.length; i += 40) {
    const part = miss.slice(i, i + 40);
    const res = await api('studioDays', part);
    Object.assign(DAYCACHE, res);
  }
}
function dropDays() { Object.keys(DAYCACHE).forEach(k => delete DAYCACHE[k]); }

// Stan terminu: kolor + tekst. t: { date, ready, start, end, teardownMin, travelMin }
function termState(t, skipReaId) {
  const n = nowWaw(), b = sr_block(t);
  if (hmMin(t.ready) > hmMin(t.start)) return { cls: 'bad', txt: 'Gotowość musi być przed startem.' };
  if (hmMin(t.end) - hmMin(t.start) < 15) return { cls: 'bad', txt: 'Koniec musi być co najmniej 15 min po starcie.' };
  if (b.from < B.rea.day[0] * 60 || b.to > B.rea.day[1] * 60) return { cls: 'bad', txt: `Realizacja z dojazdem i zwijaniem musi zmieścić się w ${B.rea.day[0]}:00–${B.rea.day[1]}:00.` };
  if (t.date < n.date || (t.date === n.date && b.from <= n.hour * 60)) return { cls: 'bad', txt: 'Ten termin już minął.' };
  const day = DAYCACHE[t.date];
  if (!day) return { cls: '', txt: 'Sprawdzam kalendarz studia…' };
  const c = sr_conflict(t, skipReaId ? day.busy.filter(b => b.reaId !== skipReaId) : day.busy);
  if (c) return { cls: 'conf', txt: `Nachodzi na ${c.start}–${c.end}${c.label && !/^(Zajęte|Wstępnie zajęte)$/.test(c.label) ? ' · ' + c.label : ''}`, conflict: true };
  if (sr_outOfHours(t, hs())) return { cls: 'wait', txt: day.workday ? `Poza godzinami pracy ${B.rea.work[0]}:00–${B.rea.work[1]}:00 — wymaga zgody na pracę poza godzinami.` : 'Dzień wolny — wymaga zgody na pracę poza godzinami.', out: true };
  return { cls: 'ok', txt: 'Wolne, w godzinach pracy.' };
}

// Oś dnia: godziny pracy, zajętość, blok ekipy (jasny) i samo wydarzenie (ciemniejsze).
function dayAxis(date, t, opts = {}) {
  const [F, T] = [B.rea.day[0], 23], span = (T - F) * 60;
  const pct = m => ((Math.min(Math.max(m, F * 60), T * 60) - F * 60) / span * 100).toFixed(3) + '%';
  const w = (a, b) => `left:${pct(a)};width:calc(${pct(b)} - ${pct(a)})`;
  const day = DAYCACHE[date];
  const work = day && day.workday ? `<i class="tl-work" style="${w(B.rea.work[0] * 60, B.rea.work[1] * 60)}"></i>` : '';
  const busy = day ? day.busy.filter(b => !opts.skip || b.reaId !== opts.skip).map(b => `<i class="tl-busy ${b.tentative ? 'tent' : ''}" style="${w(hmMin(b.start), hmMin(b.end))}" title="${esc(b.start + '–' + b.end + ' · ' + b.label)}"></i>`).join('') : '';
  let sel = '';
  if (t) {
    const st = termState(t, opts.skip), b = sr_block(t);
    sel = `<i class="tl-blk ${st.cls}" style="${w(b.from, b.to)}"></i><i class="tl-sel ${st.cls}" style="${w(hmMin(t.start), hmMin(t.end))}"></i>`;
  }
  let ticks = '';
  for (let h = F + 1; h < T; h += 2) ticks += `<span style="left:${pct(h * 60)}">${h}</span>`;
  return `<div class="tl-bar ${opts.mini ? 'mini' : ''}" ${opts.id ? `id="${opts.id}"` : ''}>${work}${busy}${sel}</div>${opts.mini ? '' : `<div class="tl-ticks">${ticks}</div>`}`;
}

// ---------- kreator ----------

const REA_EMPTY = () => {
  const d = nextWorkdayFrom(nowWaw().date, nowWaw().hour >= 15);
  return {
    title: '', kind: '', description: '', requesterName: store.get('stz_name', '') || B.user.name, brand: '', format: '', scope: [], guests: '',
    platform: '', platformOther: '', meetingLink: '', liveAway: false, location: '', parking: '', boardConsent: '', tech: [], delivery: '', notes: '', agenda: null,
    date: d, ready: '09:00', start: '10:00', end: '11:00', teardownMin: 0, travelMin: 0, readyAuto: true,
    repeat: false, rule: { type: 'weekly', weekdays: [dl_weekday(d)], day: Number(d.slice(8)), nth: 1, weekday: dl_weekday(d), endMode: 'count', count: 4, until: dl_addDays(d, 56), dates: [], shiftHolidays: true },
    excluded: {}, moved: {}, conflictReason: ''
  };
};
function nextWorkdayFrom(d, skipToday) { if (skipToday) d = dl_addDays(d, 1); while (!dl_isWorkday(d, dl_holidaySet(HOL))) d = dl_addDays(d, 1); return d; }

function loadRea() {
  const s = store.get('stz_rea', null);
  RW = { step: Math.min(store.get('stz_rea_step', 0), RSTEPS - 1), d: Object.assign(REA_EMPTY(), s || {}), tried: {}, sending: false, dir: 1 };
  RW.d.rule = Object.assign(REA_EMPTY().rule, (s && s.rule) || {});
  if (RW.d.date < nowWaw().date) { const f = REA_EMPTY(); RW.d.date = f.date; RW.d.excluded = {}; RW.d.moved = {}; }
  if (RW.d.agenda && Date.now() - (RW.d.agenda.at || 0) > 5 * 3600e3) RW.d.agenda = null;
}
let reaT = null;
function saveRea() { clearTimeout(reaT); reaT = setTimeout(() => { store.set('stz_rea', RW.d); store.set('stz_rea_step', RW.step); }, 250); }

// Lista terminów do wysłania (jednorazowo albo seria po wykluczeniach i przesunięciach).
function reaTerms() {
  const d = RW.d, base = { ready: d.ready, start: d.start, end: d.end, teardownMin: Number(d.teardownMin) || 0, travelMin: isAwayD(d) ? Number(d.travelMin) || 0 : 0 };
  if (!d.repeat) return [Object.assign({ date: d.date, original: d.date, shifted: false }, base)];
  const seen = {};
  return allRuleDates().filter(x => !d.excluded[x.original]).map(x => {
    const date = d.moved[x.original] || x.date;
    return Object.assign({ date, original: x.original, shifted: x.shifted || !!d.moved[x.original] }, base);
  }).filter(x => !seen[x.date] && (seen[x.date] = true)).sort((a, b) => a.date.localeCompare(b.date));
}
// Daty z reguły; w serii ręcznej pierwszy termin (data z góry) też należy do serii.
function allRuleDates() {
  const d = RW.d, rule = Object.assign({}, d.rule, { start: d.date });
  if (rule.endMode === 'count') delete rule.until; else delete rule.count;
  if (rule.type === 'manual') rule.dates = [d.date].concat(rule.dates || []);
  return sr_dates(rule, HOL);
}

function reaErrors(step) {
  const d = RW.d, e = {};
  if (step === 0 && (!d.title.trim() || d.title.length > 255)) e.title = 'Podaj tytuł (maks. 255 znaków).';
  if (step === 1 && !d.kind) e.kind = 'Wybierz rodzaj realizacji.';
  if (step === 2) {
    if (d.description.trim().length < 40) e.description = 'Opisz realizację (min. 40 znaków): co, kto występuje, agenda.';
    if (!d.requesterName.trim()) e.requesterName = 'Podaj imię i nazwisko.';
    if (!d.boardConsent) e.boardConsent = 'Wybierz odpowiedź.';
    const away = isAwayD(d), where = kindOf(d.kind).where;
    if (d.kind === 'studio' && !d.format) e.format = 'Wybierz format.';
    if (where !== 'location' && !away && !d.guests) e.guests = 'Wybierz liczbę osób.';
    if ((d.kind === 'webinar' || d.kind === 'live') && !d.platform) e.platform = 'Wybierz platformę.';
    if ((d.kind === 'webinar' || d.kind === 'live') && d.platform === 'inna' && !d.platformOther.trim()) e.platform = 'Wpisz nazwę platformy.';
    if (away && !d.location.trim()) e.location = 'Podaj adres.';
    if (away && !d.parking) e.parking = 'Wybierz odpowiedź.';
    if (away && !d.scope.length) e.scope = 'Wybierz zakres obsługi.';
    if (needsDelivery(d) && !d.delivery) e.delivery = 'Wybierz formę oddania.';
    if (d.agenda && d.agenda.status === 'up') e.agenda = 'Poczekaj, aż plik się wgra.';
  }
  if (step === 3) {
    const terms = reaTerms();
    if (!terms.length) e.terms = 'Seria nie ma żadnego terminu — zmień wzorzec albo przywróć wykluczone daty.';
    else {
      const states = terms.map(termState);
      const bad = states.find(s => s.cls === 'bad');
      if (bad) e.terms = bad.txt;
      else if (states.some(s => !s.cls)) e.terms = 'Sprawdzam kalendarz studia…';
      else if (states.some(s => s.conflict) && d.conflictReason.trim().length < 10) e.conflictReason = 'Napisz, dlaczego potrzebujesz tych godzin (min. 10 znaków), albo zmień termin.';
    }
  }
  return e;
}
function needsDelivery(d) { return d.kind === 'studio' || d.kind === 'avatar' || d.kind === 'wyjazd' || d.tech.includes('Zapis całości'); }

function viewReaWizard() {
  if (!RW) loadRea();
  const s = RW.step;
  setProg((s + 1) / RSTEPS);
  const heads = [
    ['Jak nazywa się realizacja?', 'Tak zobaczy ją studio w kalendarzu.'],
    ['Co realizujemy?', 'Od rodzaju zależy, o co zapytamy w briefie.'],
    ['Brief', 'Im więcej konkretów teraz, tym mniej telefonów przed nagraniem.'],
    ['Kiedy?', 'Godziny potwierdzamy indywidualnie — to propozycja, którą studio zaakceptuje albo skoryguje.'],
    ['Sprawdź i wyślij', 'Zlecenie trafi do akceptacji. Dostaniesz maila z decyzją.']
  ];
  $('#app').innerHTML = `<section class="wiz view ${s === 3 ? 'wiz-wide' : ''}">
    <div class="wiz-head"><div class="stepno"><b>${s + 1}</b> / ${RSTEPS}</div>${RW.d.title || RW.d.description ? '<button class="btn-t btn" id="rReset">Wyczyść szkic</button>' : ''}</div>
    <div class="${RW.dir > 0 ? 'slide-in' : 'slide-back'}">
      <div class="eyebrow">${['Tytuł', 'Rodzaj', 'Brief', 'Termin', 'Podsumowanie'][s]}</div>
      <h1 class="q">${heads[s][0]}</h1><p class="q-sub">${heads[s][1]}</p>
      <div id="rBody">${[rStepTitle, rStepKind, rStepBrief, rStepWhen, rStepSummary][s]()}</div>
    </div>
    <div class="wiz-foot">
      <div>${s > 0 ? `<button class="btn btn-g" id="rBack">${ICON.back} Wstecz</button>` : '<span class="keys"><span class="kbd">Enter</span> dalej</span>'}</div>
      <div style="display:flex;align-items:center;gap:16px">
        ${s > 0 ? '<span class="keys"><span class="kbd">Esc</span> wstecz · <span class="kbd">Enter</span> dalej</span>' : ''}
        ${s < RSTEPS - 1 ? '<button class="btn btn-p btn-lg" id="rNext">Dalej</button>' : `<button class="btn btn-p btn-lg" id="rSend">${RW.sending ? '<span class="spin"></span> Wysyłam…' : 'Wyślij do akceptacji'}</button>`}
      </div></div></section>`;
  bindRea();
  if (s === 3) loadWhenDays();
  const f = $('#rBody [data-k]'); if (f && s === 0) f.focus();
}

function rField(k, label, inner, opts = {}) {
  const err = RW.tried[RW.step] && reaErrors(RW.step)[k];
  return `<div class="field ${err ? 'bad' : ''}" data-f="${k}"><label class="lbl">${label} ${opts.opt ? '<span class="opt">opcjonalnie</span>' : '<span class="req">*</span>'}</label>${inner}${opts.hint ? `<div class="hint">${opts.hint}</div>` : ''}<div class="err" style="${err ? 'display:block' : ''}">${esc(err || '')}</div></div>`;
}
function rChips(k, list, multi) {
  const v = RW.d[k];
  return `<div class="chips" data-rc="${k}" data-multi="${multi ? 1 : 0}">${list.map(x => `<button type="button" class="chip ${(multi ? v.includes(x) : v === x) ? 'on' : ''}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
}

function rStepTitle() {
  return `<input class="in in-xl" data-k="title" autocomplete="off" maxlength="255" value="${esc(RW.d.title)}" placeholder="np. Webinar dla Gości BNI — grudzień">
    <div class="hint">Przykład: „TC Talks z gościem z BNI”, „Szkolenie MSP”, „Nagranie zaproszenia na Kick Off”.</div>${RW.tried[0] && reaErrors(0).title ? `<div class="err" style="display:block">${reaErrors(0).title}</div>` : ''}`;
}

function rStepKind() {
  return `<div class="kinds">${B.rea.kinds.map(k => `<button type="button" class="kind ${RW.d.kind === k.key ? 'on' : ''}" data-kind="${k.key}"><span class="kn">${esc(k.label)}</span><span class="kh">${esc(k.hint)}</span><span class="kw">${k.where === 'studio' ? 'w studiu' : k.where === 'location' ? 'w terenie' : 'studio lub teren'}</span></button>`).join('')}</div>
    ${RW.tried[1] && reaErrors(1).kind ? `<div class="err" style="display:block">${reaErrors(1).kind}</div>` : ''}`;
}

function rStepBrief() {
  const d = RW.d, k = d.kind, away = isAwayD(d), where = kindOf(k).where;
  const tech = where === 'location' ? [] : B.rea.tech;
  return `<div class="card">
    ${rField('description', 'Opis zadania', `<textarea class="in" data-k="description" placeholder="Co realizujemy, kto występuje, agenda (godzina po godzinie), czego potrzebujesz od studia…">${esc(d.description)}</textarea>`)}
    <div class="grid3">
      ${rField('requesterName', 'Osoba zgłaszająca', `<input class="in" data-k="requesterName" value="${esc(d.requesterName)}">`)}
      ${rField('email', 'E-mail', `<input class="in" value="${esc(B.user.email)}" disabled>`)}
    </div>
    ${rField('brand', 'Brand', rChips('brand', B.brands, false), { opt: true })}
    ${k === 'live' ? rField('liveAway', 'Gdzie odbywa się transmisja?', `<div class="chips" data-rbool="liveAway"><button type="button" class="chip ${!d.liveAway ? 'on' : ''}" data-v="0">W studiu</button><button type="button" class="chip ${d.liveAway ? 'on' : ''}" data-v="1">W terenie</button></div>`) : ''}
    ${k === 'studio' ? rField('format', 'Format wydarzenia', rChips('format', B.rea.formats, false)) : ''}
    ${away ? rField('scope', 'Zakres obsługi video', rChips('scope', B.rea.scope, true), { hint: 'Możesz wybrać kilka.' }) : ''}
    ${where !== 'location' && !away ? rField('guests', 'Liczba osób przed kamerą', rChips('guests', B.rea.guests, false)) : ''}
    ${k === 'webinar' || k === 'live' ? rField('platform', 'Platforma', rChips('platform', B.rea.platforms, false) + (d.platform === 'inna' ? `<input class="in" data-k="platformOther" value="${esc(d.platformOther)}" placeholder="Jaka platforma?" style="margin-top:10px">` : '')) : ''}
    ${k === 'webinar' || k === 'live' ? rField('meetingLink', 'Link do spotkania / klucz streamu', `<input class="in" data-k="meetingLink" value="${esc(d.meetingLink)}" placeholder="możesz dosłać później w komentarzu">`, { opt: true }) : ''}
    ${away ? `<div class="grid3">${rField('location', 'Lokalizacja', `<input class="in" data-k="location" value="${esc(d.location)}" placeholder="ulica, numer, miasto">`)}
      ${rField('parking', 'Miejsce parkingowe dla operatora', rChips('parking', ['Tak', 'Nie'], false))}</div>` : ''}
    ${rField('boardConsent', 'Zgoda Zarządu TC na nagrywanie', rChips('boardConsent', B.rea.consent, false) + (d.boardConsent === 'Nie' ? '<div class="warn-inline">Bez zgody Zarządu studio nie zaakceptuje realizacji — zdobądź ją przed terminem i daj znać w komentarzu.</div>' : ''))}
    ${tech.length ? rField('tech', 'Wymagania techniczne', `<div class="checks" data-rcheck="tech">${tech.map(x => `<label class="chk"><input type="checkbox" value="${esc(x)}" ${d.tech.includes(x) ? 'checked' : ''}> ${esc(x)}</label>`).join('')}</div>`, { opt: true }) : ''}
    ${needsDelivery(d) ? rField('delivery', 'Forma oddania nagrania', rChips('delivery', B.rea.delivery, false), { hint: d.delivery === 'Zmontowany materiał' ? 'Po realizacji założysz jednym kliknięciem powiązane zlecenie montażowe.' : '' }) : ''}
    ${rField('agenda', 'Agenda / scenariusz', agendaHtml(), { opt: true })}
    ${rField('notes', 'Dodatkowe uwagi', `<textarea class="in" data-k="notes" maxlength="2000" style="min-height:90px" placeholder="np. goście z zewnątrz, potrzebny dodatkowy mikrofon">${esc(d.notes)}</textarea>`, { opt: true })}
  </div>`;
}

function agendaHtml() {
  const a = RW.d.agenda;
  if (a) return `<div class="file"><span class="muted">${ICON.doc}</span><div style="flex:1;min-width:0"><div class="nm">${esc(a.name)}</div>${a.status === 'up' ? `<div class="bar"><i style="width:${Math.round((a.p || 0) * 100)}%"></i></div>` : `<div class="sz">${fmtSize(a.size)}${a.status === 'err' ? ' · <span class="st-err">' + esc(a.err) + '</span>' : ''}</div>`}</div><button class="x" id="agDel" type="button">${ICON.x}</button></div>`;
  return `<label class="dz" id="agDz"><input type="file" accept=".pdf,.docx,.doc,.pptx,.txt,.md,.odt,.rtf"><div class="ic">${ICON.up}</div><div class="t1">Wrzuć agendę lub scenariusz</div><div class="t2">.pdf .docx .pptx .txt · do 10 MB</div></label>`;
}

async function uploadAgenda(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['pdf', 'docx', 'doc', 'pptx', 'txt', 'md', 'odt', 'rtf'].includes(ext)) return toast('Niedozwolony typ pliku: .' + ext, 'bad');
  if (file.size > 10 * 1024 * 1024) return toast('Plik ma ponad 10 MB.', 'bad');
  const a = RW.d.agenda = { name: file.name, size: file.size, status: 'up', p: 0.02 };
  const redraw = () => { if (route === '/studio/nowa' && RW.step === 2 && $('[data-f="agenda"]')) { $('[data-f="agenda"]').outerHTML = rField('agenda', 'Agenda / scenariusz', agendaHtml(), { opt: true }); bindAgenda(); } };
  redraw();
  try {
    let meta = null;
    if (DIRECT_OK) {
      try {
        const s = await api('startDirectUpload', 'script', file.name, file.type || 'application/octet-stream', file.size, location.origin);

    $('#app').innerHTML = `<section class="wiz view"><div class="done-ok"><span class="ok-dot">${ICON.check}</span></div><h1 class="q" style="text-align:center">Zlecenie czeka na akceptację</h1>
      <p class="q-sub" style="text-align:center">${esc(r.id)} · ${esc(r.title)}<br>Dostaniesz maila z decyzją albo propozycją terminu.</p>
      <div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-p" data-go="/realizacja/${esc(r.id)}">Zobacz zlecenie</button><button class="btn btn-g" data-go="/studio/nowa">Nowa realizacja</button></div></section>`;
    refreshReaCount();
  } catch (e) { RW.sending = false; viewReaWizard(); toast(e.message, 'bad'); dropDays(); loadWhenDays(); }
}

async function viewReaList(scope) {
  const titles = { mine: ['Twoje', 'Moje realizacje', 'Zlecenia studyjne, które zgłosiłeś(-aś).'], pending: ['Zarządzanie', 'Do akceptacji', 'Zlecenia czekające na decyzję — od najbliższego terminu.'] }[scope];
  $('#app').innerHTML = `<section class="view"><div class="board-head"><div><div class="eyebrow">${titles[0]}</div><h1 class="h1">${titles[1]}</h1><p class="lead" style="margin:0">${titles[2]}</p></div>
    <button class="btn btn-p" data-go="/studio/nowa">Nowa realizacja</button></div><div id="reaList">${skeleton(2)}</div></section>`;
  try {
    const list = await api('listRealizations', scope);
    if (scope === 'pending') { B.reaPending = list.length; renderTop(); }
    list.sort((a, b) => scope === 'pending' ? ((a.next || {}).date || '9').localeCompare((b.next || {}).date || '9') : String(b.createdAt).localeCompare(String(a.createdAt)));
    $('#reaList').innerHTML = list.length ? `<div class="card">${list.map(reaRow).join('')}</div>`
      : `<div class="empty"><div class="h">${scope === 'pending' ? 'Nic nie czeka na akceptację' : 'Nie masz jeszcze zleceń studyjnych'}</div>${scope === 'pending' ? 'Nowe zgłoszenia pojawią się tutaj.' : 'Zgłoś nagranie, webinar albo transmisję — zajmie Ci to kilka minut.'}</div>`;

function reaBadges(r) {
  return [r.count > 1 ? `<span class="badge-s">seria ×${r.count}</span>` : '', r.outOfHours ? '<span class="badge-s warn">poza godzinami</span>' : '',
    r.conflict ? '<span class="badge-s bad">kolizja</span>' : '', r.boardConsent === 'Nie' ? '<span class="badge-s bad">brak zgody Zarządu</span>' : ''].join('');
}
function reaRow(r) {
  const n = r.next;
  return `<button class="bk-row" data-go="/realizacja/${esc(r.id)}"><span class="bk-d">${n ? `<b>${esc(n.date.split('-').reverse().slice(0, 2).join('.'))}</b><span>${esc(n.start)}–${esc(n.end)}</span>` : '<b>—</b>'}</span>
    <span class="bk-m"><span class="nm">${esc(r.title)}</span><span class="muted">${esc(r.kindLabel)} · ${esc(r.requesterName)}${r.assignees.length ? ' · obsada: ' + esc(r.assignees.map(a => a.name).join(', ')) : ''}</span><span class="badges">${reaBadges(r)}</span></span>${reaPill(r.status)}</button>`;
}

// ---------- kalendarz studia ----------

let CALV = null;  // { mode: 'week'|'month', anchor: 'YYYY-MM-DD' }
function mondayOf(d) { return dl_addDays(d, -((dl_weekday(d) + 6) % 7)); }

async function viewStudioCal() {
  CALV = CALV || store.get('stz_calv', null) || { mode: 'week', anchor: nowWaw().date };
  const week = CALV.mode === 'week';
  const from = week ? mondayOf(CALV.anchor) : mondayOf(CALV.anchor.slice(0, 8) + '01');
  const n = week ? 7 : 42;
  const label = week ? `${fmtDay(from)} – ${fmtDay(dl_addDays(from, 6))}` : ['styczeń', 'luty', 'marzec', 'kwiecień', 'maj', 'czerwiec', 'lipiec', 'sierpień', 'wrzesień', 'październik', 'listopad', 'grudzień'][Number(CALV.anchor.slice(5, 7)) - 1] + ' ' + CALV.anchor.slice(0, 4);
  $('#app').innerHTML = `<section class="view"><div class="board-head"><div><div class="eyebrow">Studio</div><h1 class="h1">Kalendarz studia</h1><p class="lead" style="margin:0">Kalendarz „Rezerwacja Studio Nagrań” i zlecenia czekające na akceptację.</p></div>
    <div class="cal-ctl"><button class="btn btn-g btn-sm" id="calPrev">${ICON.back}</button><span class="cal-l">${esc(label)}</span><button class="btn btn-g btn-sm" id="calNext" style="transform:scaleX(-1)">${ICON.back}</button>
    <button class="btn btn-g btn-sm" id="calToday">Dziś</button><div class="seg sm"><button class="${week ? 'on' : ''}" data-mode="week">Tydzień</button><button class="${!week ? 'on' : ''}" data-mode="month">Miesiąc</button></div></div></div>
    <div id="cal"><div class="sk-tile" style="height:520px"></div></div></section>`;
  const move = k => { CALV.anchor = dl_addDays(CALV.anchor, week ? 7 * k : 0); if (!week) { let y = Number(CALV.anchor.slice(0, 4)), m = Number(CALV.anchor.slice(5, 7)) + k; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } CALV.anchor = y + '-' + String(m).padStart(2, '0') + '-01'; } store.set('stz_calv', CALV); viewStudioCal(); };
  $('#calPrev').onclick = () => move(-1); $('#calNext').onclick = () => move(1);
  $('#calToday').onclick = () => { CALV.anchor = nowWaw().date; store.set('stz_calv', CALV); viewStudioCal(); };
  $$('[data-mode]').forEach(b => b.onclick = () => { CALV.mode = b.dataset.mode; store.set('stz_calv', CALV); viewStudioCal(); });
  try {
    const days = await api('studioRange', from, n);
    Object.assign(DAYCACHE, days);
    $('#cal').innerHTML = week ? weekGrid(from, days) : monthGrid(from, days);
    $$('#cal [data-rea]').forEach(b => b.onclick = e => { e.stopPropagation(); nav.push('/realizacja/' + b.dataset.rea); });
    const sc = $('#cal .wk-body'); if (sc) sc.scrollTop = 8 * 44 - 10;
  } catch (e) { $('#cal').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function weekGrid(from, days) {
  const H0 = 6, H1 = 24, PX = 44, today = nowWaw().date;
  let hours = ''; for (let h = H0; h < H1; h++) hours += `<div class="wk-h" style="top:${(h - H0) * PX}px">${h}:00</div>`;
  const cols = Array.from({ length: 7 }, (_, i) => dl_addDays(from, i)).map(d => {
    const day = days[d] || { busy: [], workday: true };
    const ev = day.busy.map(b => {
      const top = Math.max(0, (hmMin(b.start) - H0 * 60) / 60 * PX), h = Math.max(18, (Math.min(H1 * 60, hmMin(b.end)) - Math.max(H0 * 60, hmMin(b.start))) / 60 * PX);
      return `<div class="wk-ev ${b.tentative ? 'tent' : ''} ${b.reaId ? 'link' : ''}" style="top:${top}px;height:${h}px" ${b.reaId ? `data-rea="${esc(b.reaId)}"` : ''} title="${esc(b.start + '–' + b.end + ' · ' + b.label)}"><b>${esc(b.start)}–${esc(b.end)}</b> ${esc(b.label)}</div>`;
    }).join('');
    const work = day.workday ? `<div class="wk-work" style="top:${(B.rea.work[0] - H0) * PX}px;height:${(B.rea.work[1] - B.rea.work[0]) * PX}px"></div>` : '';
    return `<div class="wk-col ${d === today ? 'today' : ''} ${day.workday ? '' : 'off'}">${work}${ev}</div>`;
  }).join('');
  const heads = Array.from({ length: 7 }, (_, i) => dl_addDays(from, i)).map(d => `<div class="wk-hd ${d === today ? 'today' : ''}">${esc(fmtDay(d))}</div>`).join('');
  return `<div class="card wk"><div class="wk-heads"><div></div>${heads}</div><div class="wk-body"><div class="wk-grid" style="height:${(H1 - H0) * PX}px"><div class="wk-hours">${hours}</div>${cols}</div></div>
    <div class="tl-legend" style="margin-top:10px"><span><i class="lg-work"></i>godziny pracy</span><span><i class="lg-busy"></i>w kalendarzu</span><span><i class="lg-tent"></i>czeka na akceptację</span></div></div>`;
}

function monthGrid(from, days) {
  const month = CALV.anchor.slice(0, 7), today = nowWaw().date;
  const cells = Array.from({ length: 42 }, (_, i) => dl_addDays(from, i)).map(d => {
    const day = days[d] || { busy: [] }, items = day.busy;
    return `<div class="mo-c ${d.slice(0, 7) !== month ? 'out' : ''} ${d === today ? 'today' : ''} ${day.workday === false ? 'off' : ''}"><div class="mo-d">${Number(d.slice(8))}</div>
      ${items.slice(0, 4).map(b => `<div class="mo-ev ${b.tentative ? 'tent' : ''} ${b.reaId ? 'link' : ''}" ${b.reaId ? `data-rea="${esc(b.reaId)}"` : ''} title="${esc(b.start + '–' + b.end + ' · ' + b.label)}">${esc(b.start)} ${esc(b.label)}</div>`).join('')}
      ${items.length > 4 ? `<div class="mo-more">+${items.length - 4}</div>` : ''}</div>`;
  }).join('');
  return `<div class="card"><div class="mo-hd">${['pn', 'wt', 'śr', 'cz', 'pt', 'sb', 'nd'].map(x => `<span>${x}</span>`).join('')}</div><div class="mo">${cells}</div></div>`;
}

// ---------- strona zlecenia ----------

let RCUR = null;   // otwarta realizacja + edycje akceptującego { id, edits: {termId: {...}}, sel: {termId: bool} }

  const appr = p.can.approve;

  const termsHtml = p.terms.map(t => {
    const e = editedTerm(p, t), editable = appr && t.canApprove;

    return `<div class="tm-row ${editable ? 'ed' : ''}" data-term="${esc(t.id)}">
      ${appr ? `<span class="tm-c">${editable ? `<input type="checkbox" data-sel="${esc(t.id)}" ${RCUR.sel[t.id] ? 'checked' : ''}>` : ''}</span>` : ''}
      <span class="tm-w">${editable ? `<input type="date" class="sel" data-ed="date" value="${esc(e.date)}" min="${nowWaw().date}"> <span class="tm-tt">gotowość ${timeSel('ready', e.ready, B.rea.day[0], 23).replace('data-t=', 'data-ed=')} start ${timeSel('start', e.start, B.rea.day[0], 23.75).replace('data-t=', 'data-ed=')} koniec ${timeSel('end', e.end, B.rea.day[0], 24).replace('data-t=', 'data-ed=')}</span>`
        : `<b>${esc(termLine(t))}</b>`}
        ${t.teardownMin || t.travelMin ? `<span class="dim" style="font-size:12px"> · ${t.travelMin ? 'dojazd ' + t.travelMin + ' min ' : ''}${t.teardownMin ? 'zwijanie ' + t.teardownMin + ' min' : ''}</span>` : ''}
        ${t.before ? `<div class="dim" style="font-size:12px">było: ${esc(termLine(t.before))}</div>` : ''}

      </span>
      <span class="tm-s">${reaPill(t.status)}<span class="badges">${flags}</span>${t.canCancel ? `<button class="btn-t btn tm-x" data-cancel="${esc(t.id)}">anuluj</button>` : ''}</span>
    </div>`;
  }).join('');
  const kv = [['Rodzaj', p.kindLabel], ['Zgłasza', `${esc(p.requesterName)} · <a href="mailto:${esc(p.requesterEmail)}">${esc(p.requesterEmail)}</a>`], ['Brand', esc(p.brand)], ['Format', esc(p.format)],
    ['Zakres', esc(p.scope.join(', '))], ['Liczba osób', esc(p.guests)], ['Platforma', esc(p.platform)], ['Link', p.meetingLink ? (/^https?:/.test(p.meetingLink) ? `<a href="${esc(p.meetingLink)}" target="_blank" rel="noopener">${esc(p.meetingLink)}</a>` : esc(p.meetingLink)) : ''],
    ['Lokalizacja', esc(p.location)], ['Parking', esc(p.parking)], ['Zgoda Zarządu TC', esc(p.boardConsent) + (p.boardConsent === 'Nie' ? ' <span class="badge-s bad">brak zgody</span>' : '')],

      ${p.can.staff && !appr ? `<label class="bk-t" style="margin-top:10px">Potrzebna obsada<select class="sel" id="stNeed">${[1, 2, 3, 4].map(n => `<option ${p.staffNeeded === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>` : ''}

      <div class="card sec"><div class="card-t">Opis</div><div class="brief">${esc(p.description)}</div></div>
      <div class="card sec"><dl class="kv">${kv.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${b}</dd>`).join('')}</dl>
        ${p.tech.length ? `<div class="card-t" style="margin-top:18px">Wymagania techniczne</div><ul class="tech">${p.tech.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        ${p.agendaFile ? `<div class="card-t" style="margin-top:18px">Agenda / scenariusz</div><a class="dl" href="${DRIVE_FILE}${encodeURIComponent(p.agendaFile.id)}/view" target="_blank" rel="noopener"><span class="muted">${ICON.doc}</span><span class="nm">${esc(p.agendaFile.name)}</span><span class="dim" style="font-size:12px">${fmtSize(p.agendaFile.size)}</span>${ICON.link}</a>` : ''}</div>
      <div class="card sec"><div class="card-t">Komentarze <span class="dim">· widzi studio i zgłaszający</span></div>
        ${p.comments.map(c => `<div class="cm${c.studio ? ' cm-st' : ''}"><div class="ch"><span>${esc(c.authorName)}${c.studio ? ' <span class="cm-tag">Studio</span>' : ''}</span><span>${fmtTs(c.ts)}</span></div><div class="cb">${esc(c.text)}</div></div>`).join('') || '<p class="muted" style="margin:0 0 12px;font-size:13.5px">Brak komentarzy. Tu ustalacie szczegóły realizacji.</p>'}
        <textarea class="in" id="rcIn" style="min-height:80px" placeholder="${p.can.studio || p.can.approveAny ? 'Napisz do zgłaszającego…' : 'Napisz do studia…'}"></textarea>
        <div style="text-align:right;margin-top:10px"><button class="btn btn-g btn-sm" id="rcAdd">Dodaj komentarz</button></div></div>
    </div><aside class="side">${approveCard}${staffCard}${actions}
      <div class="card"><div class="card-t">Historia</div><div class="timeline">${p.history.slice().reverse().map(h => `<div class="tl"><i></i><div><div>${esc(h.action)}${h.details ? ' — <span class="muted">' + esc(h.details) + '</span>' : ''}</div><div class="tt">${fmtTs(h.ts)} · ${esc(h.actor)}</div></div></div>`).join('')}</div></div>
    </aside></div></section>`;
  bindReaPage(p);
  if (appr) { const ds = p.terms.filter(t => t.canApprove).map(t => editedTerm(p, t).date); if (ds.some(d => !DAYCACHE[d])) ensureDays(ds).then(() => { if (route.startsWith('/realizacja/') || route.startsWith('/rezerwacja/')) drawRea(p); }).catch(() => {}); }
}

function bindReaPage(p) {
  const act = async (btn, fn, ok) => {
    const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try { const np = await fn(); if (ok) toast(ok, 'ok'); dropDays(); RCUR = { id: np.id, edits: {}, sel: {} }; drawRea(np); refreshReaCount(); }
    catch (e) { toast(e.message, 'bad'); btn.disabled = false; btn.innerHTML = old; }
  };
  const selected = () => p.terms.filter(t => t.canApprove && RCUR.sel[t.id]);
  const items = () => selected().map(t => { const e = editedTerm(p, t); return { id: t.id, date: e.date, ready: e.ready, start: e.start, end: e.end }; });
  $$('[data-sel]').forEach(c => c.onchange = () => { RCUR.sel[c.dataset.sel] = c.checked; drawRea(p); });
  $$('.tm-row.ed [data-ed]').forEach(i => i.onchange = () => {
    const id = i.closest('[data-term]').dataset.term, t = p.terms.find(x => x.id === id), e = RCUR.edits[id] = Object.assign({}, RCUR.edits[id] || {});
    const cur = editedTerm(p, t), k = i.dataset.ed;
    if (k === 'start') { const len = hmMin(cur.end) - hmMin(cur.start), lead = hmMin(cur.start) - hmMin(cur.ready); e.start = i.value; e.end = minHm(Math.min(1440, hmMin(i.value) + len)); e.ready = minHm(Math.max(0, hmMin(i.value) - lead)); }
    else e[k] = i.value;
    RCUR.sel[id] = true;
    ensureDays([editedTerm(p, t).date]).then(() => drawRea(p)).catch(() => drawRea(p));
  });
  $('#apOk') && ($('#apOk').onclick = e => {
    if (!selected().length) return toast('Zaznacz terminy do akceptacji.', 'bad');
    act(e.currentTarget, () => api('approveTerms', p.id, items(), { staffNeeded: Number($('#apStaff').value), overtime: !!($('#apOver') && $('#apOver').checked) }), 'Zaakceptowane — terminy są w kalendarzu studia.');
  });
  $('#apPropOpen') && ($('#apPropOpen').onclick = () => { $('#apPropBox').hidden = false; $('#apPropOpen').hidden = true; });
  $('#apPropCancel') && ($('#apPropCancel').onclick = () => { $('#apPropBox').hidden = true; $('#apPropOpen').hidden = false; });
  $('#apPropSend') && ($('#apPropSend').onclick = e => {
    if (!selected().length) return toast('Zaznacz terminy, których dotyczy propozycja.', 'bad');
    const changed = items().filter(x => { const t = p.terms.find(y => y.id === x.id); return ['date', 'ready', 'start', 'end'].some(k => x[k] !== t[k]); });
    if (!changed.length) return toast('Zmień godziny lub datę w zaznaczonych terminach — to będzie propozycja.', 'bad');
    act(e.currentTarget, () => api('proposeTerms', p.id, changed, $('#apPropIn').value), 'Propozycja wysłana do zgłaszającego.');
  });
  $('#apNoOpen') && ($('#apNoOpen').onclick = () => { $('#apNoBox').hidden = false; $('#apNoOpen').hidden = true; $('#apNoIn').focus(); });
  $('#apNoCancel') && ($('#apNoCancel').onclick = () => { $('#apNoBox').hidden = true; $('#apNoOpen').hidden = false; });
  $('#apNoSend') && ($('#apNoSend').onclick = e => {
    const t = $('#apNoIn').value.trim();
    if (!selected().length) return toast('Zaznacz terminy do odrzucenia.', 'bad');
    if (t.length < 10) return toast('Uzasadnij odrzucenie (min. 10 znaków).', 'bad');
    act(e.currentTarget, () => api('rejectTerms', p.id, selected().map(x => x.id), t), 'Odrzucone, zgłaszający dostał maila.');
  });
  $('#propOk') && ($('#propOk').onclick = e => act(e.currentTarget, () => api('acceptProposal', p.id), 'Termin przyjęty — jest w kalendarzu studia.'));
  $('#stClaim') && ($('#stClaim').onclick = e => act(e.currentTarget, () => api('claimRealization', p.id), 'Jesteś w obsadzie — dopisaliśmy Cię do wydarzeń.'));
  $('#stRel') && ($('#stRel').onclick = e => act(e.currentTarget, () => api('releaseRealization', p.id), 'Zrezygnowano z realizacji.'));
  $('#stNeed') && ($('#stNeed').onchange = e => act(e.currentTarget, () => api('setStaffNeeded', p.id, Number(e.currentTarget.value)), 'Zapisano obsadę.'));
  $('#rcAdd') && ($('#rcAdd').onclick = e => { const t = $('#rcIn').value.trim(); if (t) act(e.currentTarget, () => api('addComment', p.id, t, ''), 'Komentarz dodany.'); });
  const twoClick = (btn, label, hintSel, hint, fn) => {
    if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = label; btn.classList.add('btn-rej'); if (hintSel && $(hintSel)) $(hintSel).textContent = hint; return; }
    fn();
  };
  $$('[data-cancel]').forEach(b => b.onclick = e => twoClick(e.currentTarget, 'na pewno?', null, '', () => act(e.currentTarget, () => api('cancelTerms', p.id, [b.dataset.cancel]), 'Termin anulowany.')));
  $('#cAll') && ($('#cAll').onclick = e => twoClick(e.currentTarget, 'Kliknij ponownie, żeby anulować', '#cAllHint', 'Terminy znikną z kalendarza studia, a druga strona dostanie maila.', () => act(e.currentTarget, () => api('cancelTerms', p.id, 'all'), 'Anulowano.')));
  $('#mkMontage') && ($('#mkMontage').onclick = () => {
    const cur = store.get('stz_draft', null) || {};
    store.set('stz_draft', Object.assign({}, cur, { title: cur.title || p.title, description: (cur.description ? cur.description + '\n\n' : '') + 'Materiał z realizacji ' + p.id + ' („' + p.title + '”, ' + termLine(p.terms.find(t => t.status === TS().ok) || p.terms[0]) + '). Link: ' + (B.appUrl || '') + '?r=' + p.id, brand: cur.brand || p.brand || '' }));
    store.set('stz_step', 0); if (typeof W !== 'undefined') { W.d = null; W.step = 0; }
    nav.push('/nowe');
  });
}
</script>
