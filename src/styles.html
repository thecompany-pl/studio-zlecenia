<style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --card2:#fafafb;
  --line:rgba(17,17,26,.08); --line2:rgba(17,17,26,.14);
  --tx:#16161a; --mut:#6b6b76; --dim:#a3a3ad;
  --acc:#DC143C; --acc2:#c8102e; --accd:rgba(220,20,60,.08);
  --ok:#0f9d6b; --warn:#b26a00; --bad:#d92d3a; --navy:#121635;
  --r:18px; --r2:12px;
  --sh:0 1px 2px rgba(17,17,26,.04),0 10px 28px -18px rgba(17,17,26,.22);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:300 15px/1.55 Roboto,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:var(--acc2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--tx)}
::selection{background:rgba(220,20,60,.15)}
.muted{color:var(--mut)} .dim{color:var(--dim)}
b,strong,.w5{font-weight:500}

/* --- top bar --- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:14px 28px;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand img{height:16px;display:block}
.brand span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);padding-left:12px;border-left:1px solid var(--line2)}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:8px 14px;border-radius:999px;color:var(--mut);font-weight:400;white-space:nowrap;transition:.2s var(--ease)}
.nav button:hover{color:var(--tx);background:rgba(17,17,26,.04)}
.nav button.on{color:var(--tx);background:rgba(17,17,26,.07)}
.nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:500}
.me{display:flex;align-items:center;gap:10px;flex-shrink:0;color:var(--mut);font-size:13px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:500;color:#fff;background:var(--navy);flex-shrink:0;letter-spacing:.02em}
.av.lg{width:40px;height:40px;font-size:14px}

main{max-width:1240px;margin:0 auto;padding:34px 28px 90px}
.view{animation:fadeUp .45s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* --- typografia sekcji --- */
.h1{font-size:30px;font-weight:300;letter-spacing:-.01em;margin:0 0 6px}
.lead{color:var(--mut);margin:0 0 26px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:500}

/* --- przyciski --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r2);font-weight:500;font-size:14.5px;transition:.2s var(--ease);white-space:nowrap}
.btn-p{background:var(--acc);color:#fff;box-shadow:0 8px 22px -10px rgba(220,20,60,.55)}
.btn-p:hover{background:#c8102e;transform:translateY(-1px)}
.btn-p.off{background:#f1c3cd;color:#fff;box-shadow:none;transform:none}
.btn-g{border:1px solid var(--line2);color:var(--tx);background:#fff}
.btn-g:hover{border-color:rgba(17,17,26,.3)}
.btn-t{color:var(--mut);height:auto;padding:6px 4px;font-weight:400}
.btn-t:hover{color:var(--tx)}
.btn-lg{height:54px;padding:0 28px;font-size:16px;border-radius:14px}
.btn-sm{height:34px;padding:0 14px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.btn-g .spin,.boot .spin{border-color:rgba(17,17,26,.15);border-top-color:var(--acc)}
@keyframes sp{to{transform:rotate(360deg)}}

/* --- formularze --- */
.field{margin-bottom:22px}
.lbl{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;font-size:13.5px;color:var(--tx);font-weight:400}
.lbl .req{color:var(--acc)}
.lbl .opt{color:var(--dim);font-size:12px}
.hint{font-size:12.5px;color:var(--mut);margin-top:7px}
.err{font-size:12.5px;color:var(--bad);margin-top:7px;display:none}
.field.bad .err{display:block}
.field.bad .in,.field.bad .chips{border-color:rgba(217,45,58,.55)}
.in{width:100%;background:#fff;border:1px solid var(--line2);border-radius:var(--r2);padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(220,20,60,.12)}
.in::placeholder{color:var(--dim)}
.in[readonly]{color:var(--mut);background:var(--card2)}
textarea.in{min-height:150px;resize:vertical;line-height:1.55}
.in-xl{font-size:30px;font-weight:300;padding:18px 0;background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;letter-spacing:-.01em}
.in-xl:focus{box-shadow:none;border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.counter{font-size:12px;color:var(--dim);text-align:right;margin-top:6px}
input[type=date].in,input[type=datetime-local].in{color-scheme:light}

.chips{display:flex;flex-wrap:wrap;gap:8px;border:1px solid transparent;border-radius:14px}
.chip{padding:8px 15px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--tx);font-size:13.5px;font-weight:400;transition:.18s var(--ease);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:rgba(17,17,26,.3)}
.chip.on{background:var(--accd);border-color:var(--acc);color:var(--acc2);font-weight:500}
.sla{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;font-size:12px;color:var(--mut)}
.sla div{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.sla b{display:block;color:var(--tx);font-weight:500}

/* --- kreator --- */
.wiz{max-width:760px;margin:0 auto}
.wiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.prog{position:fixed;left:0;top:59px;height:2px;background:var(--acc);transition:width .5s var(--ease);z-index:19}
.stepno{font-size:12.5px;color:var(--mut);letter-spacing:.08em}
.stepno b{color:var(--tx)}
.q{font-size:34px;font-weight:300;letter-spacing:-.015em;margin:8px 0 8px;line-height:1.2}
.q-sub{color:var(--mut);margin:0 0 30px}
.wiz-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.wiz-foot .keys{font-size:12px;color:var(--dim)}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line2);border-radius:5px;font-size:11px;color:var(--mut);margin:0 2px;background:#fff}
.slide-in{animation:slideIn .4s var(--ease)}
.slide-back{animation:slideBack .4s var(--ease)}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);min-width:0}
.card-t{font-size:13px;color:var(--mut);margin:0 0 14px;font-weight:400;display:flex;align-items:center;gap:8px}
.card-t .n{color:var(--acc);font-weight:500}

/* dropzones — label musi być blokiem, inaczej ramka łamie się po liniach */
.dz{display:block;position:relative;border:1.5px dashed rgba(17,17,26,.18);border-radius:16px;padding:22px 16px;text-align:center;transition:.2s var(--ease);background:var(--card2);cursor:pointer}
.dz:hover,.dz.drag{border-color:var(--acc);background:#fff6f8}
.dz input{display:none}
.dz .ic{width:38px;height:38px;margin:0 auto 10px;border-radius:12px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--mut)}
.dz .t1{font-weight:400}
.dz .t2{font-size:12.5px;color:var(--mut);margin-top:3px}
.files{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.file{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;min-width:0}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.file .sz{font-size:12px;color:var(--mut);white-space:nowrap}
.file .bar{height:4px;border-radius:2px;background:rgba(17,17,26,.08);overflow:hidden;margin-top:6px}
.file .bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.file .st-ok{color:var(--ok);font-size:12px}
.file .st-err{color:var(--bad);font-size:12px}
.st-err{color:var(--bad);font-size:12px}
.x{width:26px;height:26px;border-radius:8px;color:var(--mut);display:grid;place-items:center;flex-shrink:0}
.x:hover{background:rgba(17,17,26,.06);color:var(--tx)}
.cover-prev{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:var(--card2) center/cover;border:1px solid var(--line)}
.cover-prev .x{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);color:var(--tx)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:#f0f0f3;margin-bottom:12px}
.seg button{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(17,17,26,.12)}
.tc-ed{display:block;font-family:'Roboto Mono',ui-monospace,Menlo,monospace;font-size:13px;min-height:140px}
.tc-tab{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.tc-tab td,.tc-tab th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.tc-tab th{color:var(--mut);font-size:12px}
.tc-tab .mono{font-family:'Roboto Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:nowrap}
.tc-tab tr.bad td{color:var(--bad)}
.tc-sum{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mut)}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.grid3 .wide{grid-column:1/-1}

/* termin */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.preset{padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:#fff;text-align:left;transition:.18s var(--ease)}
.preset:hover{border-color:rgba(17,17,26,.3)}
.preset.on{border-color:var(--acc);background:var(--accd)}
.preset .pl{font-weight:500}
.preset .ph{font-size:12.5px;color:var(--mut);margin-top:2px}
.preset.on .ph{color:var(--acc2)}
.custom-days{display:flex;align-items:center;gap:10px;margin-top:12px}
.custom-days .in{width:90px}
.due-box{margin-top:18px;padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,#fff1f4,#f4f5fb);border:1px solid rgba(220,20,60,.22)}
.due-box .k{font-size:12px;color:var(--acc2);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.due-box .v{font-size:28px;font-weight:300;margin:4px 0 6px}
.due-box .n{font-size:12.5px;color:var(--mut)}
.summary{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* sukces */
.done{text-align:center;max-width:540px;margin:40px auto}
.done .ok-ic{width:72px;height:72px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;background:rgba(15,157,107,.1);color:var(--ok);animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.done .num{display:inline-block;margin:14px 0 6px;padding:6px 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:500;letter-spacing:.04em}

/* --- tablica --- */
.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.stats{display:flex;gap:10px}
.stat{padding:10px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);min-width:96px;box-shadow:var(--sh)}
.stat .sv{font-size:22px;font-weight:300;line-height:1.1}
.stat .sk{font-size:11.5px;color:var(--mut)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:24px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.filters .sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.filters .chip{padding:6px 12px;font-size:12.5px}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.search input{flex:1;background:none;border:0;outline:none;font-size:13.5px}
.sel{height:36px;padding:0 10px;border-radius:10px;background:#fff;border:1px solid var(--line2);font-size:13px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.tile{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;animation:fadeUp .45s var(--ease) both}
.tile:hover{transform:translateY(-4px);border-color:rgba(17,17,26,.16);box-shadow:0 22px 40px -22px rgba(17,17,26,.35)}
.tile-cover{position:relative;aspect-ratio:16/9;background-size:cover;background-position:center}
.tile-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 40%,rgba(0,0,0,.45))}
.tile-cover .cat{position:absolute;left:14px;bottom:12px;z-index:1;display:flex;align-items:center;gap:7px;font-size:12px;color:#fff;font-weight:500;text-transform:capitalize}
.badge{position:absolute;top:12px;z-index:1;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:500;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.badge.st{right:12px;background:rgba(255,255,255,.92);color:var(--tx)}
.badge.pr{left:12px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);color:var(--tx);text-transform:capitalize}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block}
.p-krytyczny{background:#e11d48;box-shadow:0 0 0 3px rgba(225,29,72,.18)}
.p-wysoki{background:#f97316}
.p-średni{background:#eab308}
.p-niski{background:#10b981}
.tile-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tile-meta{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.tile-title{font-size:16px;font-weight:400;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-fmt{display:flex;gap:5px;flex-wrap:wrap}
.fmt{font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--mut);background:#fff}
.tile-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.due{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.due.soon{color:var(--warn)}
.due.late{color:var(--bad)}
.due.fin{color:var(--ok)}
.due.rej{color:var(--mut)}
[hidden]{display:none!important}
.free{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px dashed var(--acc);color:var(--acc2);font-weight:500}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.who .av{width:26px;height:26px;font-size:10.5px}
.empty{padding:70px 20px;text-align:center;color:var(--mut);border:1.5px dashed var(--line2);border-radius:var(--r);background:#fff}
.empty .h{font-size:18px;color:var(--tx);margin-bottom:6px;font-weight:300}
.sk-tile{height:290px;border-radius:var(--r);background:linear-gradient(90deg,#ececf0 0%,#f7f7f9 50%,#ececf0 100%);background-size:200% 100%;animation:shim 1.3s infinite}
@keyframes shim{to{background-position:-200% 0}}

/* --- projekt --- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13.5px;margin-bottom:18px}
.back:hover{color:var(--tx)}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:230px;display:flex;align-items:flex-end;background-size:cover;background-position:center;margin-bottom:24px;color:#fff;box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.62))}
.hero-in{position:relative;z-index:1;padding:28px 30px;width:100%}
.hero .id{font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.8)}
.hero h1{font-size:32px;font-weight:300;margin:6px 0 12px;line-height:1.2;letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12.5px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.brief{white-space:pre-wrap;line-height:1.7;font-size:15px}
.sec{margin-bottom:18px}
.claim{width:100%}
.claimed{display:flex;align-items:center;gap:12px}
.claimed .nm{font-weight:500}
.claimed .sb{font-size:12.5px;color:var(--mut)}
.st-chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st-chips .chip{justify-content:center;padding:8px 6px;font-size:12.5px}
.timeline{display:flex;flex-direction:column;font-size:13px}
.tl{display:flex;gap:12px;padding:8px 0;position:relative}
.tl::before{content:"";position:absolute;left:4px;top:20px;bottom:-8px;width:1px;background:var(--line2)}
.tl:last-child::before{display:none}
.tl i{width:9px;height:9px;border-radius:50%;background:#d6d6dc;margin-top:6px;flex-shrink:0}
.tl:first-child i{background:var(--acc)}
.tl .tt{font-size:11.5px;color:var(--dim)}
.cm{padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.cm .ch{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:4px}
.cm .cb{white-space:pre-wrap;font-size:14px}
.cm-st{background:#fff6f7;border-color:#f6d3d9}
.cm-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--acc);color:#fff;font-size:10.5px;font-weight:500;vertical-align:1px}
.dl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);width:100%;text-align:left;margin-bottom:8px;transition:.2s}
.dl:hover{border-color:rgba(17,17,26,.25);background:#fff}
.dl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.final-prev{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0d0d10}
.final-prev iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.decide{border-color:rgba(220,20,60,.35);box-shadow:0 0 0 4px rgba(220,20,60,.06),var(--sh)}
.rev-left{margin-left:auto;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accd);color:var(--acc2);font-weight:500}
.rev-left.none{background:#f0f0f3;color:var(--mut)}
.rev.off textarea{background:#f4f4f6;cursor:not-allowed}
.ok-banner{display:flex;align-items:center;gap:14px;border-color:rgba(15,157,107,.35)}
.ok-dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(15,157,107,.1);color:var(--ok);flex-shrink:0}
.ok-dot svg{width:20px;height:20px}
