<!DOCTYPE html>
<html lang="pl">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --card2:#fafafb;
  --line:rgba(17,17,26,.08); --line2:rgba(17,17,26,.14);
  --tx:#16161a; --mut:#6b6b76; --dim:#a3a3ad;
  --acc:#DC143C; --acc2:#c8102e; --accd:rgba(220,20,60,.08);
  --ok:#0f9d6b; --warn:#b26a00; --bad:#d92d3a; --navy:#121635;
  --r:18px; --r2:12px;
  --sh:0 1px 2px rgba(17,17,26,.04),0 10px 28px -18px rgba(17,17,26,.22);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:300 15px/1.55 Roboto,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:var(--acc2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--tx)}
::selection{background:rgba(220,20,60,.15)}
.muted{color:var(--mut)} .dim{color:var(--dim)}
b,strong,.w5{font-weight:500}

/* --- top bar --- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:14px 28px;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand img{height:16px;display:block}
.brand span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);padding-left:12px;border-left:1px solid var(--line2)}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:8px 14px;border-radius:999px;color:var(--mut);font-weight:400;white-space:nowrap;transition:.2s var(--ease)}
.nav button:hover{color:var(--tx);background:rgba(17,17,26,.04)}
.nav button.on{color:var(--tx);background:rgba(17,17,26,.07)}
.nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:500}
.me{display:flex;align-items:center;gap:10px;flex-shrink:0;color:var(--mut);font-size:13px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:500;color:#fff;background:var(--navy);flex-shrink:0;letter-spacing:.02em}
.av.lg{width:40px;height:40px;font-size:14px}

main{max-width:1240px;margin:0 auto;padding:34px 28px 90px}
.view{animation:fadeUp .45s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* --- typografia sekcji --- */
.h1{font-size:30px;font-weight:300;letter-spacing:-.01em;margin:0 0 6px}
.lead{color:var(--mut);margin:0 0 26px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:500}

/* --- przyciski --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r2);font-weight:500;font-size:14.5px;transition:.2s var(--ease);white-space:nowrap}
.btn-p{background:var(--acc);color:#fff;box-shadow:0 8px 22px -10px rgba(220,20,60,.55)}
.btn-p:hover{background:#c8102e;transform:translateY(-1px)}
.btn-p.off{background:#f1c3cd;color:#fff;box-shadow:none;transform:none}
.btn-g{border:1px solid var(--line2);color:var(--tx);background:#fff}
.btn-g:hover{border-color:rgba(17,17,26,.3)}
.btn-t{color:var(--mut);height:auto;padding:6px 4px;font-weight:400}
.btn-t:hover{color:var(--tx)}
.btn-lg{height:54px;padding:0 28px;font-size:16px;border-radius:14px}
.btn-sm{height:34px;padding:0 14px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.btn-g .spin,.boot .spin{border-color:rgba(17,17,26,.15);border-top-color:var(--acc)}
@keyframes sp{to{transform:rotate(360deg)}}

/* --- formularze --- */
.field{margin-bottom:22px}
.lbl{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;font-size:13.5px;color:var(--tx);font-weight:400}
.lbl .req{color:var(--acc)}
.lbl .opt{color:var(--dim);font-size:12px}
.hint{font-size:12.5px;color:var(--mut);margin-top:7px}
.err{font-size:12.5px;color:var(--bad);margin-top:7px;display:none}
.field.bad .err{display:block}
.field.bad .in,.field.bad .chips{border-color:rgba(217,45,58,.55)}
.in{width:100%;background:#fff;border:1px solid var(--line2);border-radius:var(--r2);padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(220,20,60,.12)}
.in::placeholder{color:var(--dim)}
.in[readonly]{color:var(--mut);background:var(--card2)}
textarea.in{min-height:150px;resize:vertical;line-height:1.55}
.in-xl{font-size:30px;font-weight:300;padding:18px 0;background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;letter-spacing:-.01em}
.in-xl:focus{box-shadow:none;border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.counter{font-size:12px;color:var(--dim);text-align:right;margin-top:6px}
input[type=date].in,input[type=datetime-local].in{color-scheme:light}

.chips{display:flex;flex-wrap:wrap;gap:8px;border:1px solid transparent;border-radius:14px}
.chip{padding:8px 15px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--tx);font-size:13.5px;font-weight:400;transition:.18s var(--ease);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:rgba(17,17,26,.3)}
.chip.on{background:var(--accd);border-color:var(--acc);color:var(--acc2);font-weight:500}
.sla{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;font-size:12px;color:var(--mut)}
.sla div{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.sla b{display:block;color:var(--tx);font-weight:500}

/* --- kreator --- */
.wiz{max-width:760px;margin:0 auto}
.wiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.prog{position:fixed;left:0;top:59px;height:2px;background:var(--acc);transition:width .5s var(--ease);z-index:19}
.stepno{font-size:12.5px;color:var(--mut);letter-spacing:.08em}
.stepno b{color:var(--tx)}
.q{font-size:34px;font-weight:300;letter-spacing:-.015em;margin:8px 0 8px;line-height:1.2}
.q-sub{color:var(--mut);margin:0 0 30px}
.wiz-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.wiz-foot .keys{font-size:12px;color:var(--dim)}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line2);border-radius:5px;font-size:11px;color:var(--mut);margin:0 2px;background:#fff}
.slide-in{animation:slideIn .4s var(--ease)}
.slide-back{animation:slideBack .4s var(--ease)}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);min-width:0}
.card-t{font-size:13px;color:var(--mut);margin:0 0 14px;font-weight:400;display:flex;align-items:center;gap:8px}
.card-t .n{color:var(--acc);font-weight:500}

/* dropzones — label musi być blokiem, inaczej ramka łamie się po liniach */
.dz{display:block;position:relative;border:1.5px dashed rgba(17,17,26,.18);border-radius:16px;padding:22px 16px;text-align:center;transition:.2s var(--ease);background:var(--card2);cursor:pointer}
.dz:hover,.dz.drag{border-color:var(--acc);background:#fff6f8}
.dz input{display:none}
.dz .ic{width:38px;height:38px;margin:0 auto 10px;border-radius:12px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--mut)}
.dz .t1{font-weight:400}
.dz .t2{font-size:12.5px;color:var(--mut);margin-top:3px}
.files{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.file{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;min-width:0}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.file .sz{font-size:12px;color:var(--mut);white-space:nowrap}
.file .bar{height:4px;border-radius:2px;background:rgba(17,17,26,.08);overflow:hidden;margin-top:6px}
.file .bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.file .st-ok{color:var(--ok);font-size:12px}
.file .st-err{color:var(--bad);font-size:12px}
.st-err{color:var(--bad);font-size:12px}
.x{width:26px;height:26px;border-radius:8px;color:var(--mut);display:grid;place-items:center;flex-shrink:0}
.x:hover{background:rgba(17,17,26,.06);color:var(--tx)}
.cover-prev{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:var(--card2) center/cover;border:1px solid var(--line)}
.cover-prev .x{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);color:var(--tx)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:#f0f0f3;margin-bottom:12px}
.seg button{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(17,17,26,.12)}
.tc-ed{display:block;font-family:'Roboto Mono',ui-monospace,Menlo,monospace;font-size:13px;min-height:140px}
.tc-tab{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.tc-tab td,.tc-tab th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.tc-tab th{color:var(--mut);font-size:12px}
.tc-tab .mono{font-family:'Roboto Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:nowrap}
.tc-tab tr.bad td{color:var(--bad)}
.tc-sum{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mut)}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.grid3 .wide{grid-column:1/-1}

/* termin */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.preset{padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:#fff;text-align:left;transition:.18s var(--ease)}
.preset:hover{border-color:rgba(17,17,26,.3)}
.preset.on{border-color:var(--acc);background:var(--accd)}
.preset .pl{font-weight:500}
.preset .ph{font-size:12.5px;color:var(--mut);margin-top:2px}
.preset.on .ph{color:var(--acc2)}
.custom-days{display:flex;align-items:center;gap:10px;margin-top:12px}
.custom-days .in{width:90px}
.due-box{margin-top:18px;padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,#fff1f4,#f4f5fb);border:1px solid rgba(220,20,60,.22)}
.due-box .k{font-size:12px;color:var(--acc2);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.due-box .v{font-size:28px;font-weight:300;margin:4px 0 6px}
.due-box .n{font-size:12.5px;color:var(--mut)}
.summary{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* sukces */
.done{text-align:center;max-width:540px;margin:40px auto}
.done .ok-ic{width:72px;height:72px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;background:rgba(15,157,107,.1);color:var(--ok);animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.done .num{display:inline-block;margin:14px 0 6px;padding:6px 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:500;letter-spacing:.04em}

/* --- tablica --- */
.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.stats{display:flex;gap:10px}
.stat{padding:10px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);min-width:96px;box-shadow:var(--sh)}
.stat .sv{font-size:22px;font-weight:300;line-height:1.1}
.stat .sk{font-size:11.5px;color:var(--mut)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:24px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.filters .sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.filters .chip{padding:6px 12px;font-size:12.5px}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.search input{flex:1;background:none;border:0;outline:none;font-size:13.5px}
.sel{height:36px;padding:0 10px;border-radius:10px;background:#fff;border:1px solid var(--line2);font-size:13px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.tile{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;animation:fadeUp .45s var(--ease) both}
.tile:hover{transform:translateY(-4px);border-color:rgba(17,17,26,.16);box-shadow:0 22px 40px -22px rgba(17,17,26,.35)}
.tile-cover{position:relative;aspect-ratio:16/9;background-size:cover;background-position:center}
.tile-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 40%,rgba(0,0,0,.45))}
.tile-cover .cat{position:absolute;left:14px;bottom:12px;z-index:1;display:flex;align-items:center;gap:7px;font-size:12px;color:#fff;font-weight:500;text-transform:capitalize}
.badge{position:absolute;top:12px;z-index:1;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:500;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.badge.st{right:12px;background:rgba(255,255,255,.92);color:var(--tx)}
.badge.pr{left:12px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);color:var(--tx);text-transform:capitalize}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block}
.p-krytyczny{background:#e11d48;box-shadow:0 0 0 3px rgba(225,29,72,.18)}
.p-wysoki{background:#f97316}
.p-średni{background:#eab308}
.p-niski{background:#10b981}
.tile-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tile-meta{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.tile-title{font-size:16px;font-weight:400;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-fmt{display:flex;gap:5px;flex-wrap:wrap}
.fmt{font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--mut);background:#fff}
.tile-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.due{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.due.soon{color:var(--warn)}
.due.late{color:var(--bad)}
.due.fin{color:var(--ok)}
.due.rej{color:var(--mut)}
[hidden]{display:none!important}
.free{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px dashed var(--acc);color:var(--acc2);font-weight:500}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.who .av{width:26px;height:26px;font-size:10.5px}
.empty{padding:70px 20px;text-align:center;color:var(--mut);border:1.5px dashed var(--line2);border-radius:var(--r);background:#fff}
.empty .h{font-size:18px;color:var(--tx);margin-bottom:6px;font-weight:300}
.sk-tile{height:290px;border-radius:var(--r);background:linear-gradient(90deg,#ececf0 0%,#f7f7f9 50%,#ececf0 100%);background-size:200% 100%;animation:shim 1.3s infinite}
@keyframes shim{to{background-position:-200% 0}}

/* --- projekt --- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13.5px;margin-bottom:18px}
.back:hover{color:var(--tx)}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:230px;display:flex;align-items:flex-end;background-size:cover;background-position:center;margin-bottom:24px;color:#fff;box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.62))}
.hero-in{position:relative;z-index:1;padding:28px 30px;width:100%}
.hero .id{font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.8)}
.hero h1{font-size:32px;font-weight:300;margin:6px 0 12px;line-height:1.2;letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12.5px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.brief{white-space:pre-wrap;line-height:1.7;font-size:15px}
.sec{margin-bottom:18px}
.claim{width:100%}
.claimed{display:flex;align-items:center;gap:12px}
.claimed .nm{font-weight:500}
.claimed .sb{font-size:12.5px;color:var(--mut)}
.st-chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st-chips .chip{justify-content:center;padding:8px 6px;font-size:12.5px}
.timeline{display:flex;flex-direction:column;font-size:13px}
.tl{display:flex;gap:12px;padding:8px 0;position:relative}
.tl::before{content:"";position:absolute;left:4px;top:20px;bottom:-8px;width:1px;background:var(--line2)}
.tl:last-child::before{display:none}
.tl i{width:9px;height:9px;border-radius:50%;background:#d6d6dc;margin-top:6px;flex-shrink:0}
.tl:first-child i{background:var(--acc)}
.tl .tt{font-size:11.5px;color:var(--dim)}
.cm{padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.cm .ch{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:4px}
.cm .cb{white-space:pre-wrap;font-size:14px}
.cm-st{background:#fff6f7;border-color:#f6d3d9}
.cm-tag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--acc);color:#fff;font-size:10.5px;font-weight:500;vertical-align:1px}
.dl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);width:100%;text-align:left;margin-bottom:8px;transition:.2s}
.dl:hover{border-color:rgba(17,17,26,.25);background:#fff}
.dl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.final-prev{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0d0d10}
.final-prev iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.decide{border-color:rgba(220,20,60,.35);box-shadow:0 0 0 4px rgba(220,20,60,.06),var(--sh)}
.rev-left{margin-left:auto;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accd);color:var(--acc2);font-weight:500}
.rev-left.none{background:#f0f0f3;color:var(--mut)}
.rev.off textarea{background:#f4f4f6;cursor:not-allowed}

  <script>
// WYGENEROWANE z Deadline.gs przez tools/build.mjs — nie edytuj ręcznie.
// Liczenie preferowanego terminu. Plik współdzielony: tools/build.mjs kopiuje go do deadline_js.html dla przeglądarki.
// Termin = 17:00 N-tego dnia roboczego po dniu zgłoszenia. Daty jako 'YYYY-MM-DD', bez stref czasowych.

var DL_END_HOUR = 17;

function dl_pad(n) { return (n < 10 ? '0' : '') + n; }

function dl_ymd(d) { return d.getUTCFullYear() + '-' + dl_pad(d.getUTCMonth() + 1) + '-' + dl_pad(d.getUTCDate()); }

function dl_addDays(ymd, n) {
  var p = ymd.split('-').map(Number);
  return dl_ymd(new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)));
}

function dl_weekday(ymd) {
  var p = ymd.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
}

function dl_holidaySet(holidays) {
  var s = {};
  (holidays || []).forEach(function (h) { s[typeof h === 'string' ? h : h.date] = true; });
  return s;
}

function dl_isWorkday(ymd, hs) {
  var w = dl_weekday(ymd);
  return w !== 0 && w !== 6 && !hs[ymd];
}

function dl_nextWorkday(ymd, hs) {
  do { ymd = dl_addDays(ymd, 1); } while (!dl_isWorkday(ymd, hs));
  return ymd;
}

var DL_START_HOUR = 9;

// date 'YYYY-MM-DD', hour jako liczba z ułamkiem (16:59 → 16.98), workDays ≥ 1. Zwraca 'YYYY-MM-DDT17:00'.
// Zgłoszenie po 17:00 / w weekend / w święto liczy się jak zgłoszone o 9:00 najbliższego dnia roboczego.
// cutoff (opcjonalnie, np. 12 dla avatara): zgłoszone przed tą godziną → pierwszy dzień liczy się już dziś.
function computeDeadline(date, hour, workDays, holidays, cutoff) {
  var hs = dl_holidaySet(holidays);
  var day = date, h = hour;
  if (!dl_isWorkday(day, hs) || h >= DL_END_HOUR) { day = dl_nextWorkday(day, hs); h = DL_START_HOUR; }
  var n = Math.max(1, workDays);
  if (cutoff && h < cutoff) n -= 1;
  for (var i = 0; i < n; i++) day = dl_nextWorkday(day, hs);
  return day + 'T' + dl_pad(DL_END_HOUR) + ':00';

};
const BRAND_BG = {
  'The Company': 'linear-gradient(135deg,#DC143C,#7a1030)',
  'BNI': 'linear-gradient(135deg,#b3122d,#e2566a)',
  'BNI+': 'linear-gradient(135deg,#7f1734,#c8102e)',
  'CC': 'linear-gradient(135deg,#0e6c86,#25a5b8)',
  'CC+': 'linear-gradient(135deg,#0f6e66,#2bb39a)',
  'Fundacja': 'linear-gradient(135deg,#c2530c,#f0a020)',
  'Think Tank': 'linear-gradient(135deg,#4c1d95,#7c3aed)'
};
const DAYS = ['nd', 'pn', 'wt', 'śr', 'czw', 'pt', 'sob'];
const DAYS_LONG = ['niedziela', 'poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota'];

function initials(name) { return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join(''); }
function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' kB'; }
function fmtDue(iso, long) {
  if (!iso) return '—';
  const [d, t] = iso.split('T'); const [, m, dd] = d.split('-');
  return (long ? DAYS_LONG : DAYS)[dl_weekday(d)] + ' ' + dd + '.' + m + ', ' + (t || '17:00').slice(0, 5);
}
function fmtTs(ts) { if (!ts) return ''; const [d, t] = String(ts).split('T'); const [y, m, dd] = d.split('-'); return dd + '.' + m + '.' + y + ' ' + (t || '').slice(0, 5); }
function nowWaw() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Warsaw', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, hour: Number(p.hour) + Number(p.minute) / 60 };
}
const closed = t => t.status === 'Gotowe' || t.status === 'Odrzucone';
function dueInfo(t) {
  if (t.status === 'Gotowe') return { cls: 'fin', txt: 'gotowe' };
  if (t.status === 'Odrzucone') return { cls: 'rej', txt: 'odrzucone' };
  const iso = t.confirmedDeadline || t.deadline;
  if (!iso) return { cls: '', txt: '—' };
  const ymd = iso.slice(0, 10), n = nowWaw(), hour = Number(iso.slice(11, 13)) || 17;
  if (ymd < n.date || (ymd === n.date && n.hour >= hour)) return { cls: 'late', txt: 'po terminie · ' + fmtDue(iso) };
  if (ymd === n.date) return { cls: 'soon', txt: 'dziś ' + iso.slice(11, 16) };
  const wd = workdaysBetween(n.date, ymd, HOL);
  if (ymd === dl_addDays(n.date, 1)) return { cls: 'soon', txt: 'jutro ' + iso.slice(11, 16) };
  return { cls: wd <= 1 ? 'soon' : '', txt: (wd === 1 ? 'za 1 dzień rob.' : 'za ' + wd + ' dni rob.') + ' · ' + fmtDue(iso) };
}
function toast(msg, kind = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind; el.textContent = msg;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = 0; setTimeout(() => el.remove(), 300); }, kind === 'bad' ? 6000 : 3200);
}
function setProg(p) { $('#prog').style.width = p ? (p * 100) + '%' : '0'; }
function isStudio() { return B.user.role === 'studio' || B.user.role === 'admin'; }

// --- routing ---

const nav = {
  push(h) { google.script.history.push(null, null, h.replace(/^#/, '')); render(h); },
  replace(h) { google.script.history.replace(null, null, h.replace(/^#/, '')); render(h); }
};

// Dwie sekcje portalu: zlecenia montażowe i zlecenia studyjne (realizacje). Każda ma własne podmenu.
function sectionOf(r) { return /^\/(studio|realizacja|rezerwacja)/.test(r || '') ? 'studio' : 'montaz'; }
function renderTop() {
  const sec = sectionOf(route);
  const items = sec === 'studio' ? studioNavItems() : [['/nowe', 'Nowe zlecenie'], ['/moje', 'Moje zlecenia']].concat(isStudio() ? [['/tablica', 'Tablica studia']] : []);
  if (B.user.role === 'admin') items.push(['/ustawienia', 'Ustawienia']);
  const on = h => route === h || route.startsWith(h + '/') || (h === '/tablica' && route.startsWith('/projekt') && isStudio()) ||
    (h === '/studio/moje' && /^\/(realizacja|rezerwacja)/.test(route) && !isStudio()) || (h === '/studio/kalendarz' && /^\/(realizacja|rezerwacja)/.test(route) && isStudio());
  const cnt = h => h === '/tablica' && B.freeCount ? B.freeCount : h === '/studio/akceptacja' && B.reaPending ? B.reaPending : 0;
  $('#nav').innerHTML = `<div class="seg" role="tablist"><button data-go="${esc(lastOf('montaz'))}" class="${sec === 'montaz' ? 'on' : ''}">Zlecenia montażowe</button><button data-go="${esc(lastOf('studio'))}" class="${sec === 'studio' ? 'on' : ''}">Zlecenia studyjne</button></div>` +
    items.map(([h, l]) => `<button data-go="${h}" class="${on(h) ? 'on' : ''}">${l}${cnt(h) ? `<span class="count">${cnt(h)}</span>` : ''}</button>`).join('');
  $('#me').innerHTML = `<span class="nm">${esc(B.user.name)}</span><span class="av" title="${esc(B.user.email)}">${initials(B.user.name)}</span>`;
}
// Ostatnio odwiedzona trasa w sekcji (przełącznik wraca tam, gdzie się skończyło).
function lastOf(sec) { return store.get('stz_last_' + sec, '') || (sec === 'studio' ? '/studio' : (isStudio() ? '/tablica' : '/nowe')); }

function render(h) {
  route = (h || '').replace(/^#/, '');
  if (!route) {
    const sec = store.get('stz_section', '');
    route = sec ? lastOf(sec) : '/start';
  }
  if (route !== '/start' && route !== '/gotowe' && route !== '/studio/gotowe') {
    store.set('stz_section', sectionOf(route));
    if (!/^\/(projekt|realizacja|rezerwacja)[/]/.test(route)) store.set('stz_last_' + sectionOf(route), route);
  }
  setProg(0);
  renderTop();
  window.scrollTo(0, 0);
  const m = route.match(/^\/projekt\/(.+)$/);
  if (m) return viewProject(decodeURIComponent(m[1]));
  if (route === '/tablica' && isStudio()) return viewBoard();
  if (route === '/moje') return viewMine();
  if (route === '/start') return viewStart();
  if (sectionOf(route) === 'studio') return renderStudio(route);
  if (route === '/ustawienia' && B.user.role === 'admin') return viewSettings();
  if (route === '/gotowe') return; // ekran sukcesu rysuje kreator
  route = '/nowe'; renderTop();
  return viewWizard();
}

document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); nav.push(g.dataset.go); }
});

// ================= KREATOR ZLECENIA =================

const EMPTY = () => ({
  title: '', description: '', requesterName: store.get('stz_name', '') || B.user.name, ownerEmail: B.user.email,
  brand: '', category: '', formats: [], platforms: [], priority: '', materialsLink: '', publishDate: '',
  scriptFiles: [], tcMode: 'text', tcText: '', timecodesFile: null, cover: null, coverThumb: '',
  presetKey: '', workDays: 1, linkedRea: ''
});
const W = { step: 0, d: null, touched: {}, tried: {}, dir: 1, sending: false, pending: new Map() };
const STEPS = 4;

function loadDraft() {
  const d = store.get('stz_draft', null);
  W.d = Object.assign(EMPTY(), d || {});
  // pliki tymczasowe na serwerze żyją ~6 h
  const fresh = f => f && f.meta && (Date.now() - (f.at || 0)) < 5 * 3600e3;
  W.d.scriptFiles = (W.d.scriptFiles || []).filter(fresh);
  if (!fresh(W.d.timecodesFile)) W.d.timecodesFile = null;
  if (!fresh(W.d.cover)) { W.d.cover = null; W.d.coverThumb = ''; }
  W.step = Math.min(store.get('stz_step', 0), STEPS - 1);
}
let draftT = null;
function saveDraft() {
  clearTimeout(draftT);
  draftT = setTimeout(() => {
    const clean = f => f && f.meta ? { name: f.name, size: f.size, meta: f.meta, at: f.at } : null;
    store.set('stz_draft', Object.assign({}, W.d, {
      scriptFiles: W.d.scriptFiles.map(clean).filter(Boolean), timecodesFile: clean(W.d.timecodesFile), cover: clean(W.d.cover)
    }));
    store.set('stz_step', W.step);
  }, 300);
}

// --- czasówki ---
const TC_RE = /^\s*(\d{1,2}:\d{2}:\d{2}(?::\d{2})?)\s*[-–—]+\s*(\d{1,2}:\d{2}:\d{2}(?::\d{2})?)\s*(?:\|\s*(.*))?$/;
function tcSec(s) {
  const p = s.split(':').map(Number);
  if (p[1] > 59 || p[2] > 59 || (p.length === 4 && p[3] > 29)) return NaN;
  return p[0] * 3600 + p[1] * 60 + p[2] + (p.length === 4 ? p[3] / 25 : 0);
}
function fmtDur(s) { s = Math.round(s); const m = Math.floor(s / 60), r = s % 60; return (m ? m + ' min ' : '') + r + ' s'; }
function parseTC(text) {
  return String(text || '').split('\n').map((line, i) => ({ line, i })).filter(x => x.line.trim()).map(({ line, i }) => {
    const m = line.match(TC_RE);
    if (!m) return { n: i + 1, raw: line, ok: false, msg: 'format: 00:01:12 – 00:01:45 | opis' };
    const a = tcSec(m[1]), b = tcSec(m[2]);
    if (isNaN(a) || isNaN(b)) return { n: i + 1, raw: line, ok: false, msg: 'nieprawidłowy czas' };
    if (b <= a) return { n: i + 1, raw: line, ok: false, msg: 'koniec przed początkiem' };
    return { n: i + 1, ok: true, from: m[1], to: m[2], note: (m[3] || '').trim(), dur: b - a };
  });
}

// --- walidacja ---
function briefErrors(d) {
  const e = {};
  if (!d.title.trim()) e.title = 'Wpisz tytuł zadania.';
  else if (d.title.length > 255) e.title = 'Maksymalnie 255 znaków.';
  const dl = d.description.trim().length;
  if (dl < 40) e.description = dl ? `Jeszcze ${40 - dl} znaków — opisz cel, odbiorcę i kluczowy przekaz.` : 'Opisz zadanie (min. 40 znaków).';
  if (!d.requesterName.trim()) e.requesterName = 'Podaj imię i nazwisko.';
  const oe = d.ownerEmail.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(oe)) e.ownerEmail = 'Podaj adres e-mail ownera.';
  else if (!B.domains.includes(oe.split('@')[1])) e.ownerEmail = 'Tylko adresy: ' + B.domains.map(x => '@' + x).join(', ');
  if (!d.brand) e.brand = 'Wybierz brand.';
  if (!d.category) e.category = 'Wybierz kategorię.';
  if (!d.formats.length) e.formats = 'Wybierz co najmniej jeden format.';
  if (!d.platforms.length) e.platforms = 'Wybierz co najmniej jedną platformę.';
  if (!d.priority) e.priority = 'Wybierz priorytet.';
  if (d.category !== 'avatar' && !/^https?:\/\/\S+\.\S+/.test(d.materialsLink.trim())) e.materialsLink = 'Wklej link do materiałów (Drive, TransferNow, Vimeo…).';
  return e;
}
function filesErrors(d) {
  const e = {};
  const busy = [...d.scriptFiles, d.timecodesFile, d.cover].some(f => f && f.status === 'up');
  const rows = parseTC(d.tcText);
  const tcOk = d.tcMode === 'file' ? !!(d.timecodesFile && d.timecodesFile.meta) : rows.length > 0 && rows.every(r => r.ok);
  const scriptOk = d.scriptFiles.some(f => f.meta);
  if (d.tcMode === 'text' && rows.some(r => !r.ok)) e.tc = 'Popraw zaznaczone wiersze czasówek.';
  else if (!scriptOk && !tcOk) e.need = 'Dodaj scenariusz albo czasówki — bez jednego z nich studio nie ruszy.';
  if (busy) e.busy = 'Czekam, aż pliki się wgrają…';
  return e;
}
function stepErrors(step) {
  if (step === 0) { const e = briefErrors(W.d); return e.title ? { title: e.title } : {}; }
  if (step === 1) { const e = briefErrors(W.d); delete e.title; return e; }
  if (step === 2) return filesErrors(W.d);
  return W.d.workDays >= 1 && W.d.workDays <= 60 ? {} : { days: 'Podaj od 1 do 60 dni roboczych.' };
}

      : `<label class="dz" data-dz="cover"><input type="file" accept=".jpg,.jpeg,.png,.webp"><div class="ic">${ICON.img}</div><div class="t1">Upuść obraz lub kliknij</div><div class="t2">.jpg .png .webp · do 10 MB</div></label>`}

      ${d.tcMode === 'text' ? `<textarea class="in tc-ed" data-k="tcText" spellcheck="false" placeholder="00:01:12 – 00:01:45 | wypowiedź prezesa o wynikach&#10;00:03:02:12 – 00:03:20:00 | ujęcie sali z góry">${esc(d.tcText)}</textarea>
        <div class="hint">Jeden fragment w wierszu: <b>HH:MM:SS</b> lub <b>HH:MM:SS:FF</b> (25 kl./s), myślnik, opcjonalnie „| opis".</div>
        <div id="tcPrev">${rows.length ? `<table class="tc-tab"><tr><th>#</th><th>Od</th><th>Do</th><th>Długość</th><th>Opis</th></tr>${rows.map(r => r.ok
          ? `<tr><td class="dim">${r.n}</td><td class="mono">${r.from}</td><td class="mono">${r.to}</td><td class="mono">${fmtDur(r.dur)}</td><td>${esc(r.note)}</td></tr>`
          : `<tr class="bad"><td>${r.n}</td><td colspan="4">${esc(r.raw)} — ${r.msg}</td></tr>`).join('')}</table>
          <div class="tc-sum"><span>${rows.filter(r => r.ok).length} fragmentów</span><span>Łącznie: <b style="color:var(--tx)">${fmtDur(sum)}</b></span></div>` : ''}</div>`
      : `${d.timecodesFile ? `<div class="files">${fileRow(d.timecodesFile, 'tc', 0)}</div>` : `<label class="dz" data-dz="tc"><input type="file" accept=".txt,.csv,.edl,.xml"><div class="ic">${ICON.up}</div><div class="t1">Upuść plik z czasówkami</div><div class="t2">.txt .csv .edl .xml · do 10 MB</div></label>`}`}
    </div>

  <div class="field" data-f="need" style="margin-top:16px"><div class="err"></div></div>`;

function presetFor(cat) { return B.presets.find(p => p.key === cat); }
function curCutoff() { const p = B.presets.find(x => x.key === W.d.presetKey); return p ? p.cutoff || 0 : 0; }
function presetDesc(p) {
  const d = p.days === 1 ? '1 dzień rob.' : p.days + ' dni rob.';
  return p.cutoff ? `do ${p.cutoff}:00 → ten sam dzień` : (p.hint ? esc(p.hint) + ' · ' : '') + d;
}
function stepWhen() {
  const d = W.d;
  if (!d.presetKey) { const p = presetFor(d.category) || B.presets[0]; d.presetKey = p.key; d.workDays = p.days; }
  const n = nowWaw();
  const due = computeDeadline(n.date, n.hour, d.workDays, HOL, curCutoff());
  const prio = B.priorities.find(p => p.key === d.priority);
  return `<div class="presets">${B.presets.map(p => `<button type="button" class="preset ${d.presetKey === p.key ? 'on' : ''}" data-preset="${esc(p.key)}">
      <div class="pl">${esc(p.label)}</div><div class="ph">${presetDesc(p)}</div></button>`).join('')}
    <button type="button" class="preset ${d.presetKey === 'wlasny' ? 'on' : ''}" data-preset="wlasny"><div class="pl">Własny</div><div class="ph">ustaw liczbę dni</div></button></div>
    ${d.presetKey === 'wlasny' ? `<div class="custom-days"><input class="in" type="number" min="1" max="60" data-k="workDays" value="${d.workDays}"><span class="muted">dni roboczych</span></div>` : ''}
    <div class="due-box"><div class="k">Preferowany odbiór</div><div class="v" id="dueV">${fmtDue(due, true)}</div>
      <div class="n">To termin preferowany, nie gwarantowany — zależy od obłożenia studia. Studio potwierdzi go po przyjęciu zadania. Liczymy dni robocze pn–pt 9:00–17:00, bez świąt.</div></div>
    <h3 class="card-t" style="margin:34px 0 14px">Podsumowanie</h3>
    <div class="summary">
      ${tileHtml({ id: '', title: d.title, status: 'Nowe', brand: d.brand, category: d.category, formats: d.formats, priority: d.priority, deadline: due, coverThumb: d.coverThumb }, true)}
      <div class="card"><dl class="kv">
        <dt>Zgłasza</dt><dd>${esc(d.requesterName)} · ${esc(B.user.email)}</dd>
        <dt>Owner</dt><dd>${esc(d.ownerEmail)}</dd>
        <dt>Platformy</dt><dd>${esc(d.platforms.join(', '))}</dd>
        <dt>Priorytet</dt><dd>${prio ? `<span class="pdot p-${prio.key}"></span> ${esc(prio.label)}` : ''}</dd>
        ${d.publishDate ? `<dt>Publikacja</dt><dd>${esc(d.publishDate.split('-').reverse().join('.'))}</dd>` : ''}
        <dt>Materiały</dt><dd>${d.materialsLink ? `<a href="${esc(d.materialsLink)}" target="_blank">${esc(d.materialsLink)}</a>` : '—'}</dd>
        <dt>Załączniki</dt><dd>${[...d.scriptFiles.map(f => f.name), d.tcMode === 'file' && d.timecodesFile ? d.timecodesFile.name : '', d.tcMode === 'text' && d.tcText.trim() ? parseTC(d.tcText).length + ' czasówek' : '', d.cover ? 'okładka' : ''].filter(Boolean).map(esc).join(', ') || '—'}</dd>
        <dt>Opis</dt><dd class="muted" style="white-space:pre-wrap">${esc(d.description.length > 320 ? d.description.slice(0, 320) + '…' : d.description)}</dd>
      </dl></div>
    </div>`;
}

function refreshWizard() {
  const errs = stepErrors(W.step);
  $$('#wBody [data-f]').forEach(el => {
    const k = el.dataset.f;
    let msg = errs[k];
    if (k === 'need') msg = errs.busy || errs.tc || errs.need;
    const show = msg && (W.touched[k] || W.tried[W.step] || k === 'need' && (errs.tc || W.tried[W.step]));
    el.classList.toggle('bad', !!show);
    const er = $('.err', el); if (er) er.textContent = show ? msg : '';
  });
  const btn = $('#wNext') || $('#wSend');
  if (btn) btn.classList.toggle('off', Object.keys(errs).length > 0 || W.sending);
}

function rerenderBody() {
  const y = window.scrollY;
  $('#wBody').innerHTML = [stepTitle, stepBrief, stepFiles, stepWhen][W.step]();
  bindBody(); refreshWizard();
  window.scrollTo(0, y);
}

function goStep(delta) {
  if (delta > 0) {
    const errs = stepErrors(W.step);
    if (Object.keys(errs).length) {
      W.tried[W.step] = true; refreshWizard();
      const bad = $('#wBody .field.bad'); if (bad) bad.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
  }
  W.step = Math.max(0, Math.min(STEPS - 1, W.step + delta));
  W.dir = delta; saveDraft(); viewWizard();
}

function bindWizard() {
  $('#wNext') && ($('#wNext').onclick = () => goStep(1));
  $('#wBack') && ($('#wBack').onclick = () => goStep(-1));
  $('#wSend') && ($('#wSend').onclick = submitWizard);
  $('#wReset') && ($('#wReset').onclick = () => { if (confirm('Wyczyścić cały szkic zlecenia?')) { store.del('stz_draft'); store.del('stz_step'); W.d = null; W.step = 0; W.touched = {}; W.tried = {}; viewWizard(); } });
  bindBody();
}

function bindBody() {
  $$('#wBody [data-k]').forEach(el => {
    el.addEventListener('input', () => {
      const k = el.dataset.k;
      W.d[k] = k === 'workDays' ? Math.max(0, Math.round(Number(el.value) || 0)) : el.value;
      if (k === 'requesterName') store.set('stz_name', el.value);
      if (k === 'title') $('#tCount').textContent = el.value.length;
      if (k === 'description') $('#dCount').textContent = el.value.trim().length;
      if (k === 'tcText') { const tp = $('#tcPrev'); const tmp = document.createElement('div'); tmp.innerHTML = stepFiles(); tp.innerHTML = $('#tcPrev', tmp).innerHTML; }
      if (k === 'workDays') { const n = nowWaw(); if (W.d.workDays >= 1 && W.d.workDays <= 60) { $('#dueV').textContent = fmtDue(computeDeadline(n.date, n.hour, W.d.workDays, HOL, curCutoff()), true); } }
      saveDraft(); refreshWizard();
    });
    el.addEventListener('blur', () => { W.touched[el.dataset.k] = true; refreshWizard(); });
  });
  $$('#wBody [data-chips]').forEach(box => box.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    const k = box.dataset.chips, v = c.dataset.v;
    if (box.dataset.multi === '1') {
      const arr = W.d[k]; const i = arr.indexOf(v);
      i >= 0 ? arr.splice(i, 1) : arr.push(v); c.classList.toggle('on', i < 0);
    } else {
      W.d[k] = v; $$('.chip', box).forEach(x => x.classList.toggle('on', x === c));
      if (k === 'category') { W.d.presetKey = ''; rerenderBody(); }
    }
    W.touched[k] = true; saveDraft(); refreshWizard();
  }));
  $$('#wBody [data-preset]').forEach(b => b.onclick = () => {
    const k = b.dataset.preset; W.d.presetKey = k;
    if (k !== 'wlasny') W.d.workDays = B.presets.find(p => p.key === k).days;
    saveDraft(); rerenderBody();
  });
  $$('#wBody [data-tcmode]').forEach(b => b.onclick = () => { W.d.tcMode = b.dataset.tcmode; saveDraft(); rerenderBody(); });
  $$('#wBody [data-rm]').forEach(b => b.onclick = e => {
    e.preventDefault(); const k = b.dataset.rm;
    if (k === 'script') W.d.scriptFiles.splice(Number(b.dataset.i), 1);
    if (k === 'tc') W.d.timecodesFile = null;
    if (k === 'cover') { W.d.cover = null; W.d.coverThumb = ''; }
    saveDraft(); rerenderBody();
  });
  $$('#wBody [data-dz]').forEach(dz => {
    const inp = $('input', dz);
    inp.onchange = () => { addFiles(dz.dataset.dz, [...inp.files]); inp.value = ''; };
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); addFiles(dz.dataset.dz, [...e.dataTransfer.files]); });
  });
}

document.addEventListener('keydown', e => {
  if (!route.startsWith('/nowe') || !W.d) return;
  if (e.key === 'Escape' && W.step > 0) { e.preventDefault(); goStep(-1); }
  if (e.key === 'Enter' && !e.shiftKey) {
    const ta = e.target.tagName === 'TEXTAREA';
    if (ta && !(e.metaKey || e.ctrlKey)) return;
    if (e.target.closest && e.target.closest('button')) return;
    e.preventDefault();
    W.step < STEPS - 1 ? goStep(1) : submitWizard();
  }
});

// --- upload ---
const EXT = { script: ['txt', 'md', 'docx', 'doc', 'pdf', 'rtf', 'odt'], tc: ['txt', 'csv', 'edl', 'xml'], cover: ['jpg', 'jpeg', 'png', 'webp'] };
const KIND = { script: 'script', tc: 'timecodes', cover: 'cover' };
const CHUNK = 2 * 1024 * 1024;

function rid() { return Array.from(crypto.getRandomValues(new Uint8Array(12)), b => (b % 36).toString(36)).join('') + Date.now().toString(36); }
function readB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(file); });
}
function makeThumb(file) {
  return new Promise(res => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const W0 = 480, H0 = 270, c = document.createElement('canvas'); c.width = W0; c.height = H0;
      const s = Math.max(W0 / img.width, H0 / img.height), w = img.width * s, h = img.height * s;
      c.getContext('2d').drawImage(img, (W0 - w) / 2, (H0 - h) / 2, w, h);
      let q = .74, out = c.toDataURL('image/jpeg', q);
      while (out.length > 46000 && q > .3) { q -= .1; out = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => res(''); img.src = url;
  });
}

// Upload bezpośredni do Drive: kawałki po 32 MB (wielokrotność 256 KB), postęp z XHR. 308 = kawałek przyjęty, 200/201 = koniec.
const DIRECT_CHUNK = 32 * 1024 * 1024;
let DIRECT_OK = true; // po pierwszej porażce (np. blokada CORS) przechodzimy na zapasowy upload przez serwer
function putRange(url, blob, start, total, onProgress) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('Content-Range', 'bytes ' + start + '-' + (start + blob.size - 1) + '/' + total);
    x.upload.onprogress = e => onProgress && onProgress(start + e.loaded);
    x.onload = () => {
      if (x.status === 308) return res(null);
      if (x.status === 200 || x.status === 201) { try { return res(JSON.parse(x.responseText)); } catch (e) { return rej(new Error('Drive zwrócił niezrozumiałą odpowiedź.')); } }
      rej(new Error('Błąd wysyłania do Drive (' + x.status + ').'));
    };
    x.onerror = () => rej(new Error('direct-network'));
    x.send(blob);
  });
}
async function putDirect(url, file, onProgress) {
  let done = null;
  for (let off = 0; off < file.size; off += DIRECT_CHUNK) {
    done = await putRange(url, file.slice(off, off + DIRECT_CHUNK), off, file.size, onProgress);
  }
  if (!done || !done.id) throw new Error('Drive nie potwierdził zapisu pliku.');
  return done.id;
}

async function uploadOne(f, file, kind) {
  if (DIRECT_OK) {
    try {
      const s = await api('startDirectUpload', kind, file.name, file.type || 'application/octet-stream', file.size, location.origin);
      const fileId = await putDirect(s.url, file, sent => { f.p = Math.min(.97, sent / file.size); updateBars(); });
      f.meta = await api('finishDirectUpload', s.uploadId, fileId);
      f.status = 'ok'; f.p = 1; f.at = Date.now();
      saveDraft(); updateBars(); return;
    } catch (err) {
      if (err.message !== 'direct-network') { f.status = 'err'; f.err = err.message; saveDraft(); updateBars(); return; }
      DIRECT_OK = false;
    }
  }
  try {
    const b64 = await readB64(file);
    const id = rid(), total = Math.max(1, Math.ceil(b64.length / CHUNK));
    for (let i = 0; i < total; i++) {
      await api('uploadChunk', id, i, b64.slice(i * CHUNK, (i + 1) * CHUNK));
      f.p = (i + 1) / (total + 1); updateBars();
    }
    f.meta = await api('finalizeUpload', id, total, file.name, file.type || 'application/octet-stream', kind);
    f.status = 'ok'; f.p = 1; f.at = Date.now();
  } catch (err) {
    f.status = 'err'; f.err = err.message;
  }
  saveDraft();
  updateBars();
}
// Nie przerysowuj kroku, gdy ktoś akurat pisze czasówki — straciłby fokus.
function updateBars() {
  if (!route.startsWith('/nowe') || W.step !== 2) return;
  const a = document.activeElement;
  if (a && a.closest && a.closest('#wBody') && /INPUT|TEXTAREA/.test(a.tagName)) { refreshWizard(); return; }
  rerenderBody();
}

async function addFiles(slot, files) {
  for (const file of files) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!EXT[slot].includes(ext)) { toast(`„${file.name}" — niedozwolony typ pliku.`, 'bad'); continue; }
    if (file.size > 10 * 1024 * 1024) { toast(`„${file.name}" ma ponad 10 MB.`, 'bad'); continue; }
    const f = { name: file.name, size: file.size, status: 'up', p: 0.02 };
    if (slot === 'script') { if (W.d.scriptFiles.length >= 5) { toast('Maksymalnie 5 plików scenariusza.', 'bad'); break; } W.d.scriptFiles.push(f); }
    if (slot === 'tc') W.d.timecodesFile = f;
    if (slot === 'cover') { W.d.cover = f; W.d.coverThumb = await makeThumb(file); }
    rerenderBody();
    const p = uploadOne(f, file, KIND[slot]);
    W.pending.set(f, p); p.finally(() => W.pending.delete(f));
    if (slot !== 'script') break;
  }
}

async function submitWizard() {
  if (W.sending) return;
  for (let s = 0; s < STEPS; s++) {
    const errs = stepErrors(s);
    const real = Object.keys(errs).filter(k => k !== 'busy');
    if (real.length) { W.tried[s] = true; if (s !== W.step) { W.step = s; W.dir = -1; viewWizard(); } else refreshWizard(); toast('Uzupełnij brakujące pola.', 'bad'); return; }
  }
  W.sending = true; refreshWizard();
  const btn = $('#wSend'); btn.innerHTML = '<span class="spin"></span> Wysyłam…';
  try {
    if (W.pending.size) { btn.innerHTML = '<span class="spin"></span> Czekam na pliki…'; await Promise.all(W.pending.values()); btn.innerHTML = '<span class="spin"></span> Wysyłam…'; }
    const d = W.d;
    if ([...d.scriptFiles, d.timecodesFile, d.cover].some(f => f && f.status === 'err')) throw new Error('Któryś plik się nie wgrał — usuń go albo dodaj ponownie.');
    const rows = parseTC(d.tcText).filter(r => r.ok).map(r => ({ from: r.from, to: r.to, note: r.note }));
    const res = await api('submitRequest', {
      title: d.title.trim(), description: d.description.trim(), requesterName: d.requesterName.trim(), ownerEmail: d.ownerEmail.trim(),
      brand: d.brand, category: d.category, formats: d.formats, platforms: d.platforms, priority: d.priority,
      materialsLink: d.materialsLink.trim(), publishDate: d.publishDate, linkedRea: d.linkedRea || '',
      scriptFiles: d.scriptFiles.filter(f => f.meta).map(f => f.meta),
      timecodesFile: d.tcMode === 'file' && d.timecodesFile && d.timecodesFile.meta ? d.timecodesFile.meta : null,
      timecodes: d.tcMode === 'text' ? rows : [],
      cover: d.cover && d.cover.meta ? d.cover.meta : null, coverThumb: d.cover ? d.coverThumb : '',
      presetKey: d.presetKey, workDays: d.workDays
    });
    store.del('stz_draft'); store.del('stz_step');
    W.d = null; W.step = 0; W.touched = {}; W.tried = {}; W.sending = false;
    google.script.history.replace(null, null, '/gotowe'); route = '/gotowe'; setProg(1); renderTop();
    $('#app').innerHTML = `<section class="done view"><div class="ok-ic">${ICON.check}</div>
      <h1 class="h1">Zlecenie wysłane do studia</h1><div class="num">${esc(res.id)}</div>
      <p class="muted">Preferowany odbiór: <b style="color:var(--tx)">${fmtDue(res.deadline, true)}</b><br>Potwierdzenie poszło na Twój mail${d.ownerEmail.toLowerCase() !== B.user.email ? ' i do ownera' : ''}. Dostaniesz też maila, gdy ktoś ze studia weźmie zadanie.</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap">
        <button class="btn btn-p" data-go="/nowe">Zgłoś kolejne</button><button class="btn btn-g" data-go="/projekt/${encodeURIComponent(res.id)}">Zobacz zlecenie</button></div></section>`;
  } catch (err) {
    W.sending = false; toast(err.message, 'bad');
    if ($('#wSend')) { $('#wSend').textContent = 'Zatwierdź i wyślij do studia'; refreshWizard(); }
  }
}

function drawTiles() {
  const PR = { krytyczny: 0, wysoki: 1, 'średni': 2, niski: 3 };
  const q = F.q.trim().toLowerCase();
  let list = BOARD.filter(t =>
    (F.status === 'aktywne' ? !closed(t) : !F.status || t.status === F.status) &&
    (!F.brand || t.brand === F.brand) && (!F.category || t.category === F.category) &&
    (F.who !== 'moje' || t.assigneeEmail === B.user.email) && (F.who !== 'wolne' || !t.assigneeEmail) &&
    (!q || (t.title + ' ' + t.id).toLowerCase().includes(q)));

  list.sort(F.sort === 'priorytet' ? (a, b) => (PR[a.priority] ?? 9) - (PR[b.priority] ?? 9) || dueK(a).localeCompare(dueK(b))

    : (a, b) => dueK(a).localeCompare(dueK(b)));
  $('#tiles').innerHTML = list.length ? `<div class="grid">${list.map((t, i) => tileHtml(t, false, i)).join('')}</div>`
    : `<div class="empty"><div class="h">${BOARD.length ? 'Nic nie pasuje do filtrów' : 'Tablica jest pusta'}</div>${BOARD.length ? 'Zmień filtry albo wyczyść wyszukiwanie.' : 'Nowe zlecenia pojawią się tu zaraz po wysłaniu briefu.'}</div>`;
}

          : p.deliveryLink ? `<div class="card"><div class="card-t">Gotowy materiał</div><a href="${esc(p.deliveryLink)}" target="_blank" rel="noopener">${ICON.link} ${esc(p.deliveryLink)}</a></div>` : ''}
        <div class="card"><div class="card-t">Historia</div><div class="timeline">${p.history.slice().reverse().filter(h => h.action !== 'Mail' || p.can.studio).map(h => `<div class="tl"><i></i><div><div>${esc(h.action)}${h.details ? ' — <span class="muted">' + esc(h.details) + '</span>' : ''}</div><div class="tt">${fmtTs(h.ts)} · ${esc(h.actor)}</div></div></div>`).join('')}</div></div>
      </aside>
    </div></section>`;

  const act = async (btn, fn, ok) => {
    const old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span>';
    try { const np = await fn(); if (ok) toast(ok, 'ok'); drawProject(np); }
    catch (e) { toast(e.message, 'bad'); btn.disabled = false; btn.innerHTML = old; if (/Już przyjął/.test(e.message)) viewProject(p.id); }
  };
  $('#claim') && ($('#claim').onclick = e => act(e.currentTarget, () => api('claimProject', p.id).then(np => { B.freeCount = Math.max(0, (B.freeCount || 0) - 1); renderTop(); return np; }), 'Zadanie jest Twoje. Zgłaszający dostał maila.'));
  $('#rejOpen') && ($('#rejOpen').onclick = () => { $('#rejBox').hidden = false; $('#rejOpen').hidden = true; $('#rejIn').focus(); });
  $('#rejCancel') && ($('#rejCancel').onclick = () => { $('#rejBox').hidden = true; $('#rejOpen').hidden = false; });
  $('#rejSend') && ($('#rejSend').onclick = e => {
    const t = $('#rejIn').value.trim();
    if (t.length < 10) return toast('Uzasadnij odrzucenie (min. 10 znaków).', 'bad');
    act(e.currentTarget, () => api('rejectProject', p.id, t), 'Zlecenie odrzucone, zgłaszający dostał maila.');
  });
  $('#release') && ($('#release').onclick = e => { if (confirm('Oddać to zadanie? Wróci jako wolne na tablicę.')) act(e.currentTarget, () => api('releaseProject', p.id), 'Zadanie zwolnione.'); });
  $$('[data-st]').forEach(b => b.onclick = () => act(b, () => api('updateProject', p.id, { status: b.dataset.st, deliveryLink: $('#dlIn').value.trim() }), 'Status: ' + b.dataset.st));
  $('#dlSave') && ($('#dlSave').onclick = e => act(e.currentTarget, () => api('updateProject', p.id, { deliveryLink: $('#dlIn').value.trim() }), 'Link zapisany.'));
  $('#cdSave') && ($('#cdSave').onclick = e => act(e.currentTarget, () => api('updateProject', p.id, { confirmedDeadline: $('#cdIn').value }), 'Termin potwierdzony.'));
  bindFinal(p);
  $('#accept') && ($('#accept').onclick = e => act(e.currentTarget, () => api('acceptProject', p.id, TOK[p.id] || ''), 'Zaakceptowane. Dziękujemy!'));
  $('#revSend') && ($('#revSend').onclick = e => {
    const t = $('#revIn').value.trim();
    if (t.length < 10) return toast('Opisz poprawki (min. 10 znaków).', 'bad');
    act(e.currentTarget, () => api('requestRevision', p.id, t, TOK[p.id] || ''), 'Poprawki wysłane do studia.');
  });
  $('#cmAdd') && ($('#cmAdd').onclick = e => { const t = $('#cmIn').value.trim(); if (t) act(e.currentTarget, () => api('addComment', p.id, t, TOK[p.id] || ''), 'Komentarz dodany.'); });
  $$('[data-file]').forEach(b => b.onclick = async () => {
    const old = b.innerHTML; b.style.opacity = .6;
    try {
      const f = await api('getFile', p.id, b.dataset.file, TOK[p.id] || '');
      const bytes = Uint8Array.from(atob(f.b64), c => c.charCodeAt(0));
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: f.mime })); a.download = f.name;
      document.body.appendChild(a); a.click(); a.remove();
    } catch (e) { toast(e.message, 'bad'); }
    b.style.opacity = 1; b.innerHTML = old;
  });
}

// --- plik finalny: upload kawałkami po 4 MB prosto do Drive, podgląd w odtwarzaczu Drive ---

const FINAL_CHUNK = 4 * 1024 * 1024; // wielokrotność 256 KB (wymóg uploadu wznawialnego Drive)
// Uwaga: w tym pliku nie może wystąpić ukośnik z gwiazdką — Apps Script bierze go za komentarz i ucina resztę strony.
const FINAL_EXT = ['mp4', 'mov', 'm4v', 'webm', 'mxf', 'jpg', 'jpeg', 'png', 'gif', 'pdf'];
let FUP = null; // trwający upload: { projectId, name, size, sent }

function finalCard(p) {
  const f = p.finalFile;
  const up = FUP && FUP.projectId === p.id;
  const preview = f ? `<div class="final-prev"><iframe src="${DRIVE_FILE}${encodeURIComponent(f.id)}/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>
      <div class="final-meta"><span>${esc(f.name)} · ${fmtSize(f.size)} · ${esc(f.by || '')} ${fmtTs(f.at)}</span></div>
      <div class="final-acts"><a class="btn btn-p" href="${PROTO}drive.google.com/uc?export=download&id=${encodeURIComponent(f.id)}" target="_blank" rel="noopener">${ICON.dl} Pobierz plik</a><a class="btn btn-g" href="${DRIVE_FILE}${encodeURIComponent(f.id)}/view" target="_blank" rel="noopener">${ICON.link} Otwórz na Drive</a></div>
      <div class="hint">Świeżo wrzucone wideo Drive przetwarza kilka minut — jeśli podgląd jest pusty, odśwież za chwilę.</div>` : '';
  const progress = up ? `<div class="file" style="margin-top:12px"><div style="flex:1;min-width:0"><div class="nm">${esc(FUP.name)}</div><div class="bar"><i id="fupBar" style="width:${Math.round(FUP.sent / FUP.size * 100)}%"></i></div></div><span class="sz" id="fupTxt">${fmtSize(FUP.sent)} / ${fmtSize(FUP.size)}</span></div>` : '';
  const drop = p.can.edit && !up ? `<label class="dz" data-final style="margin-top:${f ? 14 : 0}px"><input type="file" accept=".mp4,.mov,.m4v,.webm,.mxf,.jpg,.jpeg,.png,.gif,.pdf"><div class="ic">${ICON.up}</div><div class="t1">${f ? 'Podmień plik finalny' : 'Wrzuć plik finalny do wglądu'}</div><div class="t2">.mp4 .mov .webm .jpg .png .pdf · do 2 GB · zgłaszający zobaczy go na tej stronie</div></label>` : '';
  if (!f && !p.can.edit) return `<div class="card sec"><div class="card-t">Materiał finalny</div><p class="muted" style="margin:0;font-size:14px">Gotowy materiał pojawi się tutaj do obejrzenia, gdy studio skończy montaż.</p></div>`;
  return `<div class="card sec" id="finalCard"><div class="card-t">Materiał finalny ${f ? '' : '<span class="dim">· jeszcze nie ma</span>'}</div>${preview}${progress}${drop}</div>`;
}

function bindFinal(p) {
  const dz = $('[data-final]');
  if (!dz) return;
  const inp = $('input', dz);
  const go = file => file && uploadFinal(p, file);
  inp.onchange = () => go(inp.files[0]);
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); go(e.dataTransfer.files[0]); });
}

async function uploadFinal(p, file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!FINAL_EXT.includes(ext)) return toast('Niedozwolony typ pliku: .' + ext, 'bad');
  if (file.size > 2 * 1024 ** 3) return toast('Plik finalny może mieć maks. 2 GB.', 'bad');
  FUP = { projectId: p.id, name: file.name, size: file.size, sent: 0 };
  drawProject(p);
  window.addEventListener('beforeunload', warnLeave);
  const showSent = sent => { FUP.sent = sent; if ($('#fupBar')) { $('#fupBar').style.width = Math.round(sent / file.size * 100) + '%'; $('#fupTxt').textContent = fmtSize(sent) + ' / ' + fmtSize(file.size); } };
  let res = null;
  if (DIRECT_OK) {
    try {
      const s = await api('startFinalDirect', p.id, file.name, file.type || 'application/octet-stream', file.size, location.origin);
      const fileId = await putDirect(s.url, file, showSent);
      res = await api('finishFinalDirect', s.uploadId, fileId);
    } catch (e) {
      if (e.message !== 'direct-network') { FUP = null; toast(e.message, 'bad'); drawProject(p); window.removeEventListener('beforeunload', warnLeave); return; }
      DIRECT_OK = false; showSent(0);
    }
  }
  if (res) {
    FUP = null;
    toast('Plik finalny wrzucony.', 'ok');
    if (route === '/projekt/' + p.id || route === '/projekt/' + encodeURIComponent(p.id)) drawProject(res.project);
    window.removeEventListener('beforeunload', warnLeave);
    return;
  }
  try {
    const id = await api('startFinalUpload', p.id, file.name, file.type || 'application/octet-stream', file.size);
    let offset = 0;
    while (offset < file.size) {
      const b64 = await readB64(file.slice(offset, offset + FINAL_CHUNK));
      res = await api('uploadFinalChunk', id, offset, b64);
      offset = res.done ? file.size : res.next;
      FUP.sent = offset;
      if ($('#fupBar')) { $('#fupBar').style.width = Math.round(offset / file.size * 100) + '%'; $('#fupTxt').textContent = fmtSize(offset) + ' / ' + fmtSize(file.size); }
    }
    FUP = null;
    toast('Plik finalny wrzucony.', 'ok');
    if (route === '/projekt/' + p.id || route === '/projekt/' + encodeURIComponent(p.id)) drawProject(res.project);
  } catch (e) {
    FUP = null; toast(e.message, 'bad'); drawProject(p);
  }
  window.removeEventListener('beforeunload', warnLeave);
}
function warnLeave(e) { e.preventDefault(); e.returnValue = ''; }

(async function start() {
  window.__stzStarted = true;
  if (window.TC_LOGO) $('#logo').src = window.TC_LOGO;
  try {
    B = await api('getBootstrap');
  } catch (e) {
    $('#app').innerHTML = `<div class="boot"><div style="text-align:center;max-width:420px"><div class="h1" style="font-size:22px">Brak dostępu</div><p class="muted">${esc(e.message)}</p></div></div>`;
    return;
  }
  HOL = B.holidays.map(h => h.date);
  $('#top').hidden = false;
  google.script.history.setChangeHandler(e => render(e.location.hash));
  google.script.url.getLocation(loc => {
    const p = loc.parameter && loc.parameter.p;
    if (p && loc.parameter.t) { TOK[p] = loc.parameter.t; saveTok(); }
    const rz = loc.parameter && loc.parameter.r;
    render(loc.hash || (p ? '/projekt/' + p : rz ? '/realizacja/' + rz : ''));
  });
  if (isStudio()) api('listBoard').then(l => { B.freeCount = l.filter(t => !t.assigneeEmail && !closed(t)).length; renderTop(); }).catch(() => {});
  refreshReaCount();
})();

// ================= ZLECENIA STUDYJNE (realizacje) =================
// Nagrania w studiu, avatary, webinary, transmisje live, obsługa wyjazdowa. Każde zlecenie czeka na akceptację.
// Uwaga: jak w app_js — bez ukośnika z gwiazdką i bez podwójnego ukośnika w tekstach (Apps Script tnie stronę).

const RS = () => B.rea.statuses, TS = () => B.rea.termStatuses;
const DAYCACHE = {};            // zajętość dni: { 'YYYY-MM-DD': { workday, busy } }
let RW = null;                  // kreator realizacji
const RSTEPS = 5;

function hmMin(hm) { return sr_min(hm); }
function nTerms(n) { return n + ' ' + (n === 1 ? 'termin' : [2, 3, 4].includes(n % 10) && ![12, 13, 14].includes(n % 100) ? 'terminy' : 'terminów'); }
function minHm(n) { return sr_hm(n); }
function fmtDay(ymd, long) { const [y, m, d] = ymd.split('-'); return (long ? DAYS_LONG : DAYS)[dl_weekday(ymd)] + ' ' + d + '.' + m + (long ? '.' + y : ''); }
function termLine(t) { return fmtDay(t.date, true) + ', ' + t.start + '–' + t.end + (t.ready && t.ready !== t.start ? ' · gotowość ' + t.ready : ''); }
function reaPill(s) {
  const c = s === RS().ok || s === TS().ok ? 'ok' : s === RS().pending || s === TS().pending ? 'wait' : s === RS().proposal || s === TS().proposal ? 'prop' : s === RS().done ? 'done' : 'off';
  return `<span class="bk-pill ${c}">${esc(s)}</span>`;
}
function isAwayD(d) { return d.kind === 'wyjazd' || (d.kind === 'live' && d.liveAway); }
function kindOf(k) { return B.rea.kinds.find(x => x.key === k) || { label: k }; }
function hs() { return dl_holidaySet(HOL); }

function studioNavItems() {
  const it = [['/studio/kalendarz', 'Kalendarz studia'], ['/studio/nowa', 'Nowa realizacja'], ['/studio/moje', 'Moje realizacje']];
  if (B.canApproveRea) it.push(['/studio/akceptacja', 'Do akceptacji']);
  return it;
}

function refreshReaCount() {
  if (!B.canApproveRea) return;
  api('listRealizations', 'pending').then(l => { B.reaPending = l.length; renderTop(); }).catch(() => {});
}

function renderStudio(r) {
  if (r === '/studio') return nav.replace('/studio/kalendarz');
  if (r === '/studio/nowa') return viewReaWizard();
  if (r === '/studio/gotowe') return nav.replace('/studio/moje');  // ekran sukcesu rysuje submitRea; po odświeżeniu go nie ma
  if (r === '/studio/moje') return viewReaList('mine');
  if (r === '/studio/akceptacja' && B.canApproveRea) return viewReaList('pending');
  if (r === '/studio/kalendarz') return viewStudioCal();
  const m = r.match(/^\/(realizacja|rezerwacja)\/(.+)$/);
  if (m) return viewRea(decodeURIComponent(m[2]));
  nav.replace('/studio/nowa');
}

// ---------- zajętość dni ----------

async function ensureDays(dates) {
  const miss = [...new Set(dates)].filter(d => !DAYCACHE[d]);
  for (let i = 0; i < miss.length; i += 40) {
    const part = miss.slice(i, i + 40);
    const res = await api('studioDays', part);
    Object.assign(DAYCACHE, res);
  }
}
function dropDays() { Object.keys(DAYCACHE).forEach(k => delete DAYCACHE[k]); }

// Stan terminu: kolor + tekst. t: { date, ready, start, end, teardownMin, travelMin }
function termState(t, skipTermId) {
  const n = nowWaw();
  if (!sr_validDate(t.date) || !sr_validHm(t.ready) || !sr_validHm(t.start) || !sr_validHm(t.end, true)) return { cls: 'bad', txt: 'Nieprawidłowa data lub godzina.' };
  const b = sr_block(t);
  if (hmMin(t.ready) > hmMin(t.start)) return { cls: 'bad', txt: 'Gotowość musi być przed startem.' };
  if (hmMin(t.end) - hmMin(t.start) < 15) return { cls: 'bad', txt: 'Koniec musi być co najmniej 15 min po starcie.' };
  if (b.from < B.rea.day[0] * 60 || b.to > B.rea.day[1] * 60) return { cls: 'bad', txt: `Realizacja z dojazdem i zwijaniem musi zmieścić się w ${B.rea.day[0]}:00–${B.rea.day[1]}:00.` };
  if (t.date < n.date || (t.date === n.date && b.from <= n.hour * 60)) return { cls: 'bad', txt: 'Ten termin już minął.' };
  const day = DAYCACHE[t.date];
  if (!day) return { cls: '', txt: 'Sprawdzam kalendarz studia…' };
  const c = sr_conflict(t, skipTermId ? day.busy.filter(x => x.termId !== skipTermId) : day.busy);
  if (c) return { cls: 'conf', txt: `Nachodzi na ${c.start}–${c.end}${c.label && !/^(Zajęte|Wstępnie zajęte)$/.test(c.label) ? ' · ' + c.label : ''}`, conflict: true };
  if (sr_outOfHours(t, hs())) return { cls: 'wait', txt: day.workday ? `Poza godzinami pracy ${B.rea.work[0]}:00–${B.rea.work[1]}:00 — wymaga zgody na pracę poza godzinami.` : 'Dzień wolny — wymaga zgody na pracę poza godzinami.', out: true };
  return { cls: 'ok', txt: 'Wolne, w godzinach pracy.' };
}

// Oś dnia: godziny pracy, zajętość, blok ekipy (jasny) i samo wydarzenie (ciemniejsze).
function dayAxis(date, t, opts = {}) {
  const [F, T] = [7, 22], span = (T - F) * 60;
  const pct = m => ((Math.min(Math.max(m, F * 60), T * 60) - F * 60) / span * 100).toFixed(3) + '%';
  const w = (a, b) => `left:${pct(a)};width:calc(${pct(b)} - ${pct(a)})`;
  const day = DAYCACHE[date];
  const work = day && day.workday ? `<i class="tl-work" style="${w(B.rea.work[0] * 60, B.rea.work[1] * 60)}"></i>` : '';
  const busy = day ? day.busy.filter(b => !opts.skip || b.termId !== opts.skip).map(b => `<i class="tl-busy ${b.tentative ? 'tent' : ''}" style="${w(hmMin(b.start), hmMin(b.end))}" title="${esc(b.start + '–' + b.end + ' · ' + b.label)}"></i>`).join('') : '';
  let sel = '';
  if (t) {
    const st = termState(t, opts.skip), b = sr_block(t);
    sel = `<i class="tl-blk ${st.cls}" style="${w(b.from, b.to)}"></i><i class="tl-sel ${st.cls}" style="${w(hmMin(t.start), hmMin(t.end))}"></i>`;
  }
  let ticks = '';
  for (let h = F + 1; h < T; h += 2) ticks += `<span style="left:${pct(h * 60)}">${h}</span>`;
  return `<div class="tl-bar ${opts.mini ? 'mini' : ''}" ${opts.id ? `id="${opts.id}"` : ''}>${work}${busy}${sel}</div>${opts.mini ? '' : `<div class="tl-ticks">${ticks}</div>`}`;
}

// ---------- kreator ----------

const REA_EMPTY = () => {
  const d = nextWorkdayFrom(nowWaw().date, nowWaw().hour >= 15);
  return {
    title: '', kind: '', description: '', requesterName: store.get('stz_name', '') || B.user.name, brand: '', format: '', scope: [], guests: '',
    platform: '', platformOther: '', meetingLink: '', liveAway: false, location: '', parking: '', boardConsent: '', tech: [], logoBrand: '', delivery: '', notes: '', agenda: null, agendaText: '',
    date: d, ready: '10:00', start: '10:00', end: '11:00', teardownMin: 0, travelMin: 0, readyAuto: true,
    repeat: false, rule: { type: 'weekly', weekdays: [dl_weekday(d)], day: Number(d.slice(8)), nth: 1, weekday: dl_weekday(d), endMode: 'count', count: 4, until: dl_addDays(d, 56), dates: [], shiftHolidays: true },
    excluded: {}, moved: {}, conflictReason: ''
  };
};
function nextWorkdayFrom(d, skipToday) { if (skipToday) d = dl_addDays(d, 1); while (!dl_isWorkday(d, dl_holidaySet(HOL))) d = dl_addDays(d, 1); return d; }

function loadRea() {
  const s = store.get('stz_rea', null);
  RW = { step: Math.min(store.get('stz_rea_step', 0), RSTEPS - 1), d: Object.assign(REA_EMPTY(), s || {}), tried: {}, sending: false, dir: 1 };
  RW.d.rule = Object.assign(REA_EMPTY().rule, (s && s.rule) || {});
  if (RW.d.date < nowWaw().date) { const f = REA_EMPTY(); RW.d.date = f.date; RW.d.excluded = {}; RW.d.moved = {}; RW.d.fromCal = false; }  // termin z kalendarza minął — trzeba wybrać nowy
  if (RW.d.agenda && Date.now() - (RW.d.agenda.at || 0) > 5 * 3600e3) RW.d.agenda = null;
}
let reaT = null;
function saveRea() { clearTimeout(reaT); reaT = setTimeout(() => { store.set('stz_rea', RW.d); store.set('stz_rea_step', RW.step); }, 250); }

// Lista terminów do wysłania (jednorazowo albo seria po wykluczeniach i przesunięciach).
function reaTerms() {
  const d = RW.d, base = { ready: d.start, start: d.start, end: d.end, teardownMin: 0, travelMin: 0 };  // gotowość, zwijanie, dojazd ustala studio
  if (!d.repeat) return [Object.assign({ date: d.date, original: d.date, shifted: false }, base)];
  const seen = {};
  return allRuleDates().filter(x => !d.excluded[x.original]).map(x => {
    const date = d.moved[x.original] || x.date;
    return Object.assign({ date, original: x.original, shifted: x.shifted || !!d.moved[x.original] }, base);
  }).filter(x => !seen[x.date] && (seen[x.date] = true)).sort((a, b) => a.date.localeCompare(b.date));
}
// Daty z reguły; w serii ręcznej pierwszy termin (data z góry) też należy do serii.
function allRuleDates() {
  const d = RW.d, rule = Object.assign({}, d.rule, { start: d.date });
  if (rule.endMode === 'count') delete rule.until; else delete rule.count;
  if (rule.type === 'manual') { delete rule.count; delete rule.until; rule.dates = [d.date].concat(rule.dates || []); }
  return sr_dates(rule, HOL);
}

function reaErrors(step) {
  const d = RW.d, e = {};
  if (step === 0 && (!d.title.trim() || d.title.length > 255)) e.title = 'Podaj tytuł (maks. 255 znaków).';
  if (step === 1 && !d.kind) e.kind = 'Wybierz rodzaj realizacji.';
  if (step === 2) {
    if (d.description.trim().length < 40) e.description = 'Opisz realizację (min. 40 znaków): co, kto występuje, agenda.';
    if (!d.requesterName.trim()) e.requesterName = 'Podaj imię i nazwisko.';
    if (!d.boardConsent) e.boardConsent = 'Wybierz odpowiedź.';
    const away = isAwayD(d), where = kindOf(d.kind).where;
    if (d.kind === 'studio' && !d.format) e.format = 'Wybierz format.';
    if (where !== 'location' && !away && !d.guests) e.guests = 'Wybierz liczbę osób.';
    if ((d.kind === 'webinar' || d.kind === 'live') && !d.platform) e.platform = 'Wybierz platformę.';
    if ((d.kind === 'webinar' || d.kind === 'live') && d.platform === 'inna' && !d.platformOther.trim()) e.platform = 'Wpisz nazwę platformy.';
    if (away && !d.location.trim()) e.location = 'Podaj adres.';
    if (away && !d.parking) e.parking = 'Wybierz odpowiedź.';
    if (away && !d.scope.length) e.scope = 'Wybierz zakres obsługi.';
    if (needsDelivery(d) && !d.delivery) e.delivery = 'Wybierz formę oddania.';
    if (d.agenda && d.agenda.status === 'up') e.agenda = 'Poczekaj, aż plik się wgra.';
    if (d.meetingLink.length > 500) e.meetingLink = 'Maks. 500 znaków.';
    if (d.agendaText.length > 4000) e.agenda = 'Agenda: maks. 4000 znaków.';
    if (d.tech.includes('Tło z logo brandu') && !d.logoBrand) e.tech = 'Wybierz brand, którego logo ma być w tle.';
  }
  if (step === 3) {
    const terms = reaTerms();
    if (!terms.length) e.terms = 'Seria nie ma żadnego terminu — zmień wzorzec albo przywróć wykluczone daty.';
    else {
      const states = terms.map(termState);
      const bad = states.find(s => s.cls === 'bad');
      if (bad) e.terms = bad.txt;
      else if (states.some(s => !s.cls)) e.terms = 'Sprawdzam kalendarz studia…';
    }
  }
  return e;
}
function needsDelivery(d) { return d.kind === 'studio' || d.kind === 'avatar' || d.kind === 'wyjazd' || d.tech.includes('Zapis całości'); }

// Z kalendarza: kroki „Tytuł” i „Termin” są już za nami (wybrane zaznaczeniem bloku).
function reaVisible() { return [0, 1, 2, 3, 4].filter(i => !(RW.d.fromCal && (i === 0 || i === 3))); }

function viewReaWizard() {
  if (!RW) loadRea();

    ['Co realizujemy?', 'Od rodzaju zależy, o co zapytamy w briefie.'],

    ['Kiedy?', 'Godziny potwierdzamy indywidualnie — to propozycja, którą studio zaakceptuje albo skoryguje.'],
    ['Sprawdź i wyślij', 'Zlecenie trafi do akceptacji. Dostaniesz maila z decyzją.']
  ];
  $('#app').innerHTML = `<section class="wiz view ${s === 3 ? 'wiz-wide' : ''}">
    <div class="wiz-head"><div class="stepno"><b>${pos + 1}</b> / ${vis.length}${RW.d.fromCal ? ` <span class="dim">· ${esc(RW.d.title)} · ${esc(fmtDay(RW.d.date))} ${esc(RW.d.start)}–${esc(RW.d.end)}</span>` : ''}</div>${RW.d.title || RW.d.description ? '<button class="btn-t btn" id="rReset">Wyczyść szkic</button>' : ''}</div>
    <div class="${RW.dir > 0 ? 'slide-in' : 'slide-back'}">
      <div class="eyebrow">${['Tytuł', 'Rodzaj', 'Brief', 'Termin', 'Podsumowanie'][s]}</div>
      <h1 class="q">${heads[s][0]}</h1><p class="q-sub">${heads[s][1]}</p>
      <div id="rBody">${[rStepTitle, rStepKind, rStepBrief, rStepWhen, rStepSummary][s]()}</div>
    </div>
    <div class="wiz-foot">
      <div>${pos > 0 ? `<button class="btn btn-g" id="rBack">${ICON.back} Wstecz</button>` : RW.d.fromCal ? `<button class="btn btn-g" id="rToCal">${ICON.back} Kalendarz</button>` : '<span class="keys"><span class="kbd">Enter</span> dalej</span>'}</div>
      <div style="display:flex;align-items:center;gap:16px">
        ${pos > 0 ? '<span class="keys"><span class="kbd">Esc</span> wstecz · <span class="kbd">Enter</span> dalej</span>' : ''}
        ${s < RSTEPS - 1 ? `<button class="btn btn-p btn-lg ${Object.keys(reaErrors(s)).length ? 'is-off' : ''}" id="rNext" aria-disabled="${Object.keys(reaErrors(s)).length ? 'true' : 'false'}">Dalej</button>` : `<button class="btn btn-p btn-lg" id="rSend">${RW.sending ? '<span class="spin"></span> Wysyłam…' : 'Wyślij do akceptacji'}</button>`}
      </div></div></section>`;
  bindRea();
  if (s === 3) loadWhenDays();
  const f = $('#rBody [data-k]'); if (f && s === 0) f.focus();
}

function rField(k, label, inner, opts = {}) {
  const err = RW.tried[RW.step] && reaErrors(RW.step)[k];
  return `<div class="field ${err ? 'bad' : ''}" data-f="${k}"><label class="lbl">${label} ${opts.opt ? '<span class="opt">opcjonalnie</span>' : '<span class="req">*</span>'}</label>${inner}${opts.hint ? `<div class="hint">${opts.hint}</div>` : ''}<div class="err" style="${err ? 'display:block' : ''}">${esc(err || '')}</div></div>`;
}
function rChips(k, list, multi) {
  const v = RW.d[k];
  return `<div class="chips" data-rc="${k}" data-multi="${multi ? 1 : 0}">${list.map(x => `<button type="button" class="chip ${(multi ? v.includes(x) : v === x) ? 'on' : ''}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
}

function rStepTitle() {
  return `<input class="in in-xl" data-k="title" autocomplete="off" maxlength="255" value="${esc(RW.d.title)}" placeholder="np. Webinar dla Gości BNI — grudzień">
    <div class="hint">Przykład: „TC Talks z gościem z BNI”, „Szkolenie MSP”, „Nagranie zaproszenia na Kick Off”.</div>${RW.tried[0] && reaErrors(0).title ? `<div class="err" style="display:block">${reaErrors(0).title}</div>` : ''}`;
}

function rStepKind() {
  return `<div class="kinds">${B.rea.kinds.map(k => `<button type="button" class="kind ${RW.d.kind === k.key ? 'on' : ''}" data-kind="${k.key}"><span class="kn">${esc(k.label)}</span><span class="kh">${esc(k.hint)}</span><span class="kw">${k.where === 'studio' ? 'w studiu' : k.where === 'location' ? 'w terenie' : 'studio lub teren'}</span></button>`).join('')}</div>
    ${RW.tried[1] && reaErrors(1).kind ? `<div class="err" style="display:block">${reaErrors(1).kind}</div>` : ''}`;
}

function rStepBrief() {
  const d = RW.d, k = d.kind, away = isAwayD(d), where = kindOf(k).where;

  return `<div class="card">
    ${rField('description', 'Opis zadania', `<textarea class="in" data-k="description" placeholder="Co realizujemy, kto występuje, agenda (godzina po godzinie), czego potrzebujesz od studia…">${esc(d.description)}</textarea>`)}
    <div class="grid3">
      ${rField('requesterName', 'Osoba zgłaszająca', `<input class="in" data-k="requesterName" value="${esc(d.requesterName)}">`)}
      ${rField('email', 'E-mail', `<input class="in" value="${esc(B.user.email)}" disabled>`)}
    </div>
    ${rField('brand', 'Brand', rChips('brand', B.brands, false), { opt: true })}
    ${k === 'live' ? rField('liveAway', 'Gdzie odbywa się transmisja?', `<div class="chips" data-rbool="liveAway"><button type="button" class="chip ${!d.liveAway ? 'on' : ''}" data-v="0">W studiu</button><button type="button" class="chip ${d.liveAway ? 'on' : ''}" data-v="1">W terenie</button></div>`) : ''}
    ${k === 'studio' ? rField('format', 'Format wydarzenia', rChips('format', B.rea.formats, false)) : ''}
    ${away ? rField('scope', 'Zakres obsługi video', rChips('scope', B.rea.scope, true), { hint: 'Możesz wybrać kilka.' }) : ''}
    ${where !== 'location' && !away ? rField('guests', 'Liczba osób przed kamerą', rChips('guests', B.rea.guests, false)) : ''}
    ${k === 'webinar' || k === 'live' ? rField('platform', 'Platforma', rChips('platform', B.rea.platforms, false) + (d.platform === 'inna' ? `<input class="in" data-k="platformOther" value="${esc(d.platformOther)}" placeholder="Jaka platforma?" style="margin-top:10px">` : '')) : ''}
    ${k === 'webinar' || k === 'live' ? rField('meetingLink', 'Link do spotkania / klucz streamu', `<input class="in" data-k="meetingLink" maxlength="500" value="${esc(d.meetingLink)}" placeholder="możesz dosłać później w komentarzu">`, { opt: true }) : ''}
    ${away ? `<div class="grid3">${rField('location', 'Lokalizacja', `<input class="in" data-k="location" value="${esc(d.location)}" placeholder="ulica, numer, miasto">`)}
      ${rField('parking', 'Miejsce parkingowe dla operatora', rChips('parking', ['Tak', 'Nie'], false))}</div>` : ''}
    ${rField('boardConsent', 'Zgoda Zarządu TC na nagrywanie', rChips('boardConsent', B.rea.consent, false) + (d.boardConsent === 'Nie' ? '<div class="warn-inline">Bez zgody Zarządu studio nie zaakceptuje realizacji — zdobądź ją przed terminem i daj znać w komentarzu.</div>' : ''))}
    ${tech.length ? rField('tech', 'Wymagania techniczne', `<div class="checks" data-rcheck="tech">${tech.map(x => `<label class="chk"><input type="checkbox" value="${esc(x)}" ${d.tech.includes(x) ? 'checked' : ''}> ${esc(x)}</label>`).join('')}</div>` + (d.tech.includes('Tło z logo brandu') ? `<div class="lbl" style="margin:12px 0 8px">Logo którego brandu w tle?</div>${rChips('logoBrand', B.brands, false)}` : ''), { opt: true }) : ''}
    ${needsDelivery(d) ? rField('delivery', 'Forma oddania nagrania', rChips('delivery', B.rea.delivery, false), { hint: d.delivery === 'Zmontowany materiał' ? 'Po realizacji założysz jednym kliknięciem powiązane zlecenie montażowe.' : '' }) : ''}
    ${rField('agenda', 'Agenda / scenariusz', agendaHtml() + `<textarea class="in" data-k="agendaText" maxlength="4000" style="min-height:90px;margin-top:10px" placeholder="…albo wpisz agendę: 16:00 powitanie, 16:05 networking, 16:20 rozmowa…">${esc(d.agendaText)}</textarea>`, { opt: true, hint: 'Plik albo tekst — jak Ci wygodniej.' })}
    ${rField('notes', 'Dodatkowe uwagi', `<textarea class="in" data-k="notes" maxlength="2000" style="min-height:90px" placeholder="np. goście z zewnątrz, potrzebny dodatkowy mikrofon">${esc(d.notes)}</textarea>`, { opt: true })}
  </div>`;
}

function agendaHtml() {
  const a = RW.d.agenda;
