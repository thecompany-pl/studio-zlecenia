async function uploadAgenda(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['pdf', 'docx', 'doc', 'pptx', 'txt', 'md', 'odt', 'rtf'].includes(ext)) return toast('Niedozwolony typ pliku: .' + ext, 'bad');
  if (file.size > 10 * 1024 * 1024) return toast('Plik ma ponad 10 MB.', 'bad');
  const a = RW.d.agenda = { name: file.name, size: file.size, status: 'up', p: 0.02 };
  const redraw = () => { if (route === '/studio/nowa' && RW.step === 2) rerenderRea(); };
  redraw();
  try {
    let meta = null;
    if (DIRECT_OK) {
      try {
        const s = await api('startDirectUpload', 'script', file.name, file.type || 'application/octet-stream', file.size, location.origin);
        const id = await putDirect(s.url, file, sent => { a.p = Math.min(.97, sent / file.size); redraw(); });
        meta = await api('finishDirectUpload', s.uploadId, id);
      } catch (e) { if (e.message !== 'direct-network') throw e; DIRECT_OK = false; }
    }
    if (!meta) {
      const b64 = await readB64(file), id = rid(), total = Math.max(1, Math.ceil(b64.length / CHUNK));
      for (let i = 0; i < total; i++) { await api('uploadChunk', id, i, b64.slice(i * CHUNK, (i + 1) * CHUNK)); a.p = (i + 1) / (total + 1); redraw(); }
      meta = await api('finalizeUpload', id, total, file.name, file.type || 'application/octet-stream', 'script');
    }
    Object.assign(a, { status: 'ok', meta, at: Date.now() });
  } catch (e) { Object.assign(a, { status: 'err', err: e.message }); }
  saveRea(); redraw();
}
function bindAgenda() {
  const dz = $('#agDz');
  if (dz) {
    const inp = $('input', dz);
    inp.onchange = () => inp.files[0] && uploadAgenda(inp.files[0]);
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
    dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); e.dataTransfer.files[0] && uploadAgenda(e.dataTransfer.files[0]); });
  }
  $('#agDel') && ($('#agDel').onclick = () => { RW.d.agenda = null; saveRea(); rerenderRea(); });
}

function timeSel(k, v, from, to, step = 15) {
  let o = '';
  for (let m = from * 60; m <= to * 60; m += step) o += `<option ${minHm(m) === v ? 'selected' : ''}>${minHm(m)}</option>`;
  return `<select class="sel" data-t="${k}">${o}</select>`;
}
function minSel(k, v, list, label) { return `<select class="sel" data-t="${k}">${list.map(m => `<option value="${m}" ${Number(v) === m ? 'selected' : ''}>${m ? m + ' min' : 'bez'}</option>`).join('')}</select>`; }

function stripDates(center) {
  const out = [center], h = hs();
  let a = center, b = center;
  while (out.length < 5) {
    a = dl_addDays(a, -1); while (!dl_isWorkday(a, h)) a = dl_addDays(a, -1);
    if (a >= nowWaw().date) out.unshift(a);
    b = dl_addDays(b, 1); while (!dl_isWorkday(b, h)) b = dl_addDays(b, 1);
    out.push(b);
  }
  return out.slice(0, 5);
}

// Zmiana pierwszego terminu: wzorzec serii dopasowuje się tak, żeby ta data była pierwszym wystąpieniem.
function setFirstDate(v) {
  const d = RW.d, w = dl_weekday(v), day = Number(v.slice(8));
  d.date = v; d.excluded = {}; d.moved = {};
  if ((d.rule.type === 'weekly' || d.rule.type === 'biweekly') && !d.rule.weekdays.includes(w)) d.rule.weekdays = d.rule.weekdays.concat(w).sort();
  d.rule.day = day; d.rule.weekday = w;
  d.rule.nth = day + 7 > sr_daysInMonth(Number(v.slice(0, 4)), Number(v.slice(5, 7))) && day > 28 ? -1 : Math.ceil(day / 7);
  d.rule.dates = (d.rule.dates || []).filter(x => x > v);
}

  const e = reaErrors(RW.step);
  $$('#rBody [data-f]').forEach(f => { const m = e[f.dataset.f]; f.classList.toggle('bad', !!m); const el = $('.err', f); if (el) { el.textContent = m || ''; el.style.display = m ? 'block' : ''; } });
}

function reaStep(dir) {
  if (dir > 0) {
    const e = reaErrors(RW.step);
    if (Object.keys(e).length) {
      RW.tried[RW.step] = true;
      if (RW.step === 3 && Object.keys(e).length === 1 && e.terms === 'Sprawdzam kalendarz studia…') { toast('Chwila — sprawdzam kalendarz studia.', ''); loadWhenDays(); return; }
      rerenderRea(); const f = $('#rBody .field.bad'); f && f.scrollIntoView({ behavior: 'smooth', block: 'center' });
      toast(Object.values(e)[0], 'bad'); return;
    }
  }
  const vis = reaVisible(), pos = vis.indexOf(RW.step);
  if (pos + dir < 0 || pos + dir >= vis.length) return;
  RW.dir = dir; RW.step = vis[pos + dir]; saveRea(); viewReaWizard(); window.scrollTo(0, 0);
}

document.addEventListener('keydown', e => {
  if (route !== '/studio/nowa' || !RW) return;
  if (e.key === 'Escape' && reaVisible().indexOf(RW.step) > 0) { e.preventDefault(); reaStep(-1); }
  if (e.key === 'Enter' && !e.shiftKey) {
    if (e.target.tagName === 'TEXTAREA' && !(e.metaKey || e.ctrlKey)) return;
    if (e.target.closest && (e.target.closest('button') || e.target.tagName === 'SELECT')) return;
    if (e.target.matches && e.target.matches('[data-r], #srAdd, [data-move], input[type=number], input[type=date]')) { e.preventDefault(); e.target.blur(); return; }
    e.preventDefault();
    RW.step < RSTEPS - 1 ? reaStep(1) : submitRea();
  }
});

async function submitRea() {
  if (RW.sending) return;
  RW.sending = true;
  try { await ensureDays(reaTerms().map(t => t.date)); } catch (e) { RW.sending = false; toast('Nie udało się sprawdzić kalendarza studia: ' + e.message, 'bad'); return; }
  RW.sending = false;
  for (let s = 0; s < RSTEPS - 1; s++) { const e = reaErrors(s); if (Object.keys(e).length) { RW.tried[s] = true; if (s === 0 || s === 3) RW.d.fromCal = false; RW.step = s; viewReaWizard(); toast(Object.values(e)[0], 'bad'); return; } }
  const d = RW.d, terms = reaTerms();
  const payload = {
    title: d.title, kind: d.kind, description: d.description, requesterName: d.requesterName, brand: d.brand, format: d.format, scope: d.scope, guests: d.guests,
    platform: d.platform === 'inna' ? d.platformOther : d.platform, meetingLink: d.meetingLink, liveAway: d.liveAway, location: d.location, parking: d.parking,
    boardConsent: d.boardConsent, tech: kindOf(d.kind).where === 'location' ? [] : d.tech, delivery: needsDelivery(d) ? d.delivery : '', notes: d.notes,
    agendaFile: d.agenda && d.agenda.meta ? d.agenda.meta : null, agendaText: d.agendaText, logoBrand: d.logoBrand,
    seriesRule: d.repeat ? Object.assign({}, d.rule, { start: d.date }) : null, conflictReason: d.conflictReason,
    terms: terms.map(t => ({ date: t.date, ready: t.ready, start: t.start, end: t.end }))
  };
  RW.sending = true; viewReaWizard();
  try {
    const r = await api('createRealization', payload);
    const fromCal = d.fromCal;
    store.del('stz_rea'); store.del('stz_rea_step'); RW = null; dropDays();
    if (fromCal) {
      CALV = { mode: 'week', anchor: terms[0].date }; store.set('stz_calv', CALV);
      nav.push('/studio/kalendarz');
      toast('Zgłoszone: ' + r.title + ' — czeka na akceptację studia. Dostaniesz maila z decyzją.', 'ok');
      refreshReaCount();
      return;
    }
    google.script.history.push(null, null, '/studio/gotowe'); route = '/studio/gotowe'; renderTop();
    $('#app').innerHTML = `<section class="wiz view"><div class="done-ok"><span class="ok-dot">${ICON.check}</span></div><h1 class="q" style="text-align:center">Zlecenie czeka na akceptację</h1>
      <p class="q-sub" style="text-align:center">${esc(r.id)} · ${esc(r.title)}<br>Dostaniesz maila z decyzją albo propozycją terminu.</p>
      <div style="display:flex;gap:10px;justify-content:center"><button class="btn btn-p" data-go="/realizacja/${esc(r.id)}">Zobacz zlecenie</button><button class="btn btn-g" data-go="/studio/nowa">Nowa realizacja</button></div></section>`;
    refreshReaCount();
  } catch (e) { RW.sending = false; viewReaWizard(); toast(e.message, 'bad'); dropDays(); loadWhenDays(); }
}

  const move = k => { CALV.anchor = dl_addDays(CALV.anchor, week ? 7 * k : 0); if (!week) { let y = Number(CALV.anchor.slice(0, 4)), m = Number(CALV.anchor.slice(5, 7)) + k; if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; } CALV.anchor = y + '-' + String(m).padStart(2, '0') + '-01'; } store.set('stz_calv', CALV); viewStudioCal(); };

    $$('#cal [data-mday]').forEach(c => c.onclick = () => { CALV = { mode: 'week', anchor: c.dataset.mday }; store.set('stz_calv', CALV); viewStudioCal(); });
    const sc = $('#cal .wk-body'); if (sc) sc.scrollTop = 8 * 44 - 10;
    if (week) bindWeekSelect();
  } catch (e) { $('#cal').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }

function weekGrid(from, days) {
  const H0 = 6, H1 = 24, PX = 44, today = nowWaw().date;
  let hours = ''; for (let h = H0; h < H1; h++) hours += `<div class="wk-h" style="top:${(h - H0) * PX}px">${h}:00</div>`;
  const cols = Array.from({ length: 7 }, (_, i) => dl_addDays(from, i)).map(d => {
    const day = days[d] || { busy: [], workday: true };
    const ev = day.busy.map(b => {
      const top = Math.max(0, (hmMin(b.start) - H0 * 60) / 60 * PX), h = Math.max(18, (Math.min(H1 * 60, hmMin(b.end)) - Math.max(H0 * 60, hmMin(b.start))) / 60 * PX);
      return `<div class="wk-ev ${b.tentative ? 'tent' : ''} ${b.reaId ? 'link' : ''} ${b.mine ? 'mine' : ''}" style="top:${top}px;height:${h}px" ${b.reaId ? `data-rea="${esc(b.reaId)}"` : ''} title="${esc(b.start + '–' + b.end + ' · ' + b.label)}"><b>${esc(b.start)}–${esc(b.end)}</b> ${esc(b.label)}</div>`;
    }).join('');
    const work = day.workday ? `<div class="wk-work" style="top:${(B.rea.work[0] - H0) * PX}px;height:${(B.rea.work[1] - B.rea.work[0]) * PX}px"></div>` : '';
    return `<div class="wk-col ${d === today ? 'today' : ''} ${day.workday ? '' : 'off'} ${d < today ? 'past' : ''}" data-date="${d}">${work}${ev}</div>`;
  }).join('');
  const heads = Array.from({ length: 7 }, (_, i) => dl_addDays(from, i)).map(d => `<div class="wk-hd ${d === today ? 'today' : ''}">${esc(fmtDay(d))}</div>`).join('');
  return `<div class="card wk"><div class="wk-heads"><div></div>${heads}</div><div class="wk-body"><div class="wk-grid" style="height:${(H1 - H0) * PX}px"><div class="wk-hours">${hours}</div>${cols}</div></div>
    <div class="tl-legend" style="margin-top:10px"><span><i class="lg-work"></i>godziny pracy</span><span><i class="lg-busy"></i>zajęte</span><span><i class="lg-tent"></i>czeka na akceptację</span><span><i class="lg-mine"></i>Twoje</span><span><i class="lg-sel"></i>zaznacz kursorem, żeby zgłosić</span></div></div>`;
}

function monthGrid(from, days) {
  const month = CALV.anchor.slice(0, 7), today = nowWaw().date;
  const cells = Array.from({ length: 42 }, (_, i) => dl_addDays(from, i)).map(d => {
    const day = days[d] || { busy: [] }, items = day.busy;
    return `<div class="mo-c ${d.slice(0, 7) !== month ? 'out' : ''} ${d === today ? 'today' : ''} ${day.workday === false ? 'off' : ''}" data-mday="${d}"><div class="mo-d">${Number(d.slice(8))}</div>
      ${items.slice(0, 4).map(b => `<div class="mo-ev ${b.tentative ? 'tent' : ''} ${b.reaId ? 'link' : ''} ${b.mine ? 'mine' : ''}" ${b.reaId ? `data-rea="${esc(b.reaId)}"` : ''} title="${esc(b.start + '–' + b.end + ' · ' + b.label)}">${esc(b.start)} ${esc(b.label)}</div>`).join('')}
      ${items.length > 4 ? `<div class="mo-more">+${items.length - 4}</div>` : ''}</div>`;
  }).join('');
  return `<div class="card"><div class="mo-hd">${['pn', 'wt', 'śr', 'cz', 'pt', 'sb', 'nd'].map(x => `<span>${x}</span>`).join('')}</div><div class="mo">${cells}</div></div>`;
}

// ---------- rezerwacja z kalendarza: zaznacz blok → nazwa → brief ----------

const WK = { H0: 6, PX: 44 };
// Mysz: przeciągnij, żeby zaznaczyć blok (krótki klik = godzina). Dotyk: przewijanie działa normalnie, stuknięcie = godzina od tego miejsca.
function bindWeekSelect() {
  const today = nowWaw().date, body = $('#cal .wk-body');
  const minAt = (col, y) => { const r = col.getBoundingClientRect(); return Math.max(WK.H0 * 60, Math.min(24 * 60, Math.round(((y - r.top) / WK.PX * 60 + WK.H0 * 60) / 15) * 15)); };
  const tapRange = m => { const s = Math.min(Math.floor(m / 30) * 30, 23 * 60); return [s, Math.min(24 * 60, s + 60)]; };
  $$('#cal .wk-col').forEach(col => {
    col.onpointerdown = e => {
      if (e.button !== 0 || e.target.closest('.wk-ev.link') || col.dataset.date < today) return;
      const date = col.dataset.date, x0 = e.clientX, y0 = e.clientY;
      if (e.pointerType === 'touch') {
        col.onpointerup = ev => { col.onpointerup = null; if (Math.abs(ev.clientX - x0) < 8 && Math.abs(ev.clientY - y0) < 8) { const [s, en] = tapRange(minAt(col, ev.clientY)); openSlot(date, s, en, null); } };
        return;
      }
      e.preventDefault();
      const a = minAt(col, e.clientY);
      let b = a, moved = false, lastY = e.clientY, timer = null;
      const box = document.createElement('div');
      box.className = 'wk-sel';
      col.appendChild(box);
      const range = () => {
        if (!moved) return tapRange(a);
        let s = Math.min(a, b), en = Math.max(a, b);
        if (en - s < 15) en = Math.min(24 * 60, s + 15);
        return [s, en];
      };
      const draw = () => { const [s, en] = range(); box.style.top = (s - WK.H0 * 60) / 60 * WK.PX + 'px'; box.style.height = (en - s) / 60 * WK.PX + 'px'; box.textContent = minHm(s) + '–' + minHm(en); };
      // Przy krawędzi przewijanej siatki przewijamy sami — pozycję liczymy zawsze z aktualnego położenia kolumny.
      const edge = () => {
        const br = body.getBoundingClientRect(), d = lastY < br.top + 30 ? -12 : lastY > br.bottom - 30 ? 12 : 0;
        if (d) { body.scrollTop += d; b = minAt(col, lastY); draw(); }
      };
      draw();
      try { col.setPointerCapture(e.pointerId); } catch (x) {}
      timer = setInterval(edge, 40);
      col.onpointermove = ev => { lastY = ev.clientY; if (Math.abs(ev.clientY - y0) > 4) moved = true; b = minAt(col, ev.clientY); draw(); };
      col.onpointerup = col.onpointercancel = ev => {
        clearInterval(timer);
        col.onpointermove = col.onpointerup = col.onpointercancel = null;
        if (ev.type === 'pointercancel') { box.parentNode && box.parentNode.removeChild(box); return; }
        const [s, en] = range();
        openSlot(date, s, en, box);
      };
    };
  });
}

function slotTerm(date, s, e) { return { date, ready: minHm(s), start: minHm(s), end: minHm(e), teardownMin: 0, travelMin: 0 }; }

function openSlot(date, s, e, box) {
  const t = slotTerm(date, s, e), st = termState(t);
  const close = () => { box && box.remove(); const ov = $('#slotOv'); ov && ov.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = ev => { if (ev.key === 'Escape') close(); };
  if (st.cls === 'bad') { toast(st.txt, 'bad'); box && box.remove(); return; }
  const ov = document.createElement('div');
  ov.id = 'slotOv'; ov.className = 'slot-ov';
  ov.innerHTML = `<div class="slot-card" role="dialog" aria-label="Nowa realizacja">
    <div class="eyebrow">Nowa realizacja</div>
    <div class="slot-when">${esc(fmtDay(date, true))}<br><b>${minHm(s)}–${minHm(e)}</b></div>
    <div class="bk-state ${st.conflict ? 'bad' : st.cls}" style="margin:0 0 16px">${esc(st.conflict ? 'Kolizja: ' + st.txt.replace(/^Nachodzi na /, '') + '. Możesz zgłosić mimo to — studio zdecyduje.' : st.cls === 'ok' ? 'Wolne, w godzinach pracy.' : st.txt)}</div>
    <label class="lbl" for="slotName">Nazwa realizacji <span class="req">*</span></label>
    <input class="in" id="slotName" maxlength="255" autocomplete="off" placeholder="np. Webinar dla Gości BNI — grudzień">
    ${st.conflict ? `<label class="lbl" for="slotWhy" style="margin-top:14px">Dlaczego to zlecenie jest ważne? <span class="opt">opcjonalnie</span></label><textarea class="in" id="slotWhy" maxlength="1000" style="min-height:64px" placeholder="np. gość dostępny tylko wtedy"></textarea>` : ''}
    <div class="hint">Dalej wypełnisz brief. Zgłoszenie trafi do akceptacji studia — godziny mogą zostać skorygowane.</div>
    <div class="slot-act"><button class="btn btn-g" id="slotCancel">Anuluj</button><button class="btn btn-p" id="slotGo">Dalej: brief</button></div>
  </div>`;
  document.body.appendChild(ov);
  document.addEventListener('keydown', onKey);
  const inp = $('#slotName');
  inp.focus();
  const go = () => {
    const name = inp.value.trim();
    if (!name) { inp.closest('.slot-card').classList.add('shake'); inp.focus(); setTimeout(() => inp.closest('.slot-card').classList.remove('shake'), 400); return; }
    const why = $('#slotWhy') ? $('#slotWhy').value.trim() : '';
    close();
    startFromCal(date, s, e, name, why);
  };
  $('#slotGo').onclick = go;
  inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); ev.stopPropagation(); go(); } };  // ten Enter nie może dojść do kreatora
  $('#slotCancel').onclick = close;
  let downOnOv = false;
  ov.onpointerdown = ev => { downOnOv = ev.target === ov; };
  ov.onclick = ev => { if (ev.target === ov && downOnOv) close(); };
}

// Kreator startuje od rodzaju realizacji: tytuł i termin są już wybrane w kalendarzu.
// Istniejący szkic (rodzaj, brief) zostaje — podmieniamy tylko nazwę i termin.
function startFromCal(date, s, e, name, why) {
  if (!RW) loadRea();
  const prev = RW && RW.d ? RW.d : REA_EMPTY();
  RW = { step: 1, d: Object.assign({}, prev, { title: name, date, ready: minHm(s), start: minHm(s), end: minHm(e), teardownMin: prev.teardownMin || 0,
    repeat: false, excluded: {}, moved: {}, conflictReason: why || '', fromCal: true }), tried: {}, sending: false, dir: 1 };
  RW.d.rule = Object.assign({}, RW.d.rule, { weekdays: [dl_weekday(date)], day: Number(date.slice(8)), weekday: dl_weekday(date), dates: [] });
  store.set('stz_rea', RW.d); store.set('stz_rea_step', 1);
  nav.push('/studio/nowa');
}

function editedTerm(p, t) { return Object.assign({ teardownMin: t.teardownMin, travelMin: t.travelMin }, t, RCUR.edits[t.id] || {}); }

// Przerysowanie strony nie może gubić tego, co ktoś właśnie wpisuje (komentarz, powód, propozycja, zgoda na nadgodziny).
function captureReaUi() {
  const v = sel => { const n = $(sel); return n ? (n.type === 'checkbox' ? n.checked : n.value) : undefined; };
  return { propOpen: $('#apPropBox') && !$('#apPropBox').hidden, propText: v('#apPropIn'), noOpen: $('#apNoBox') && !$('#apNoBox').hidden, noText: v('#apNoIn'),
    over: v('#apOver'), staff: v('#apStaff'), comment: v('#rcIn') };
}
function restoreReaUi(ui) {
  if (!ui) return;
  const set = (sel, val) => { const n = $(sel); if (n && val !== undefined && val !== null) { if (n.type === 'checkbox') n.checked = !!val; else n.value = val; } };
  if (ui.propOpen && $('#apPropBox')) { $('#apPropBox').hidden = false; $('#apPropOpen').hidden = true; }
  if (ui.noOpen && $('#apNoBox')) { $('#apNoBox').hidden = false; $('#apNoOpen').hidden = true; }
  set('#apPropIn', ui.propText); set('#apNoIn', ui.noText); set('#apOver', ui.over); set('#apStaff', ui.staff); set('#rcIn', ui.comment);
}

function drawRea(p) {
  const keepUi = RCUR && RCUR.id === p.id && $('#rcIn') ? captureReaUi() : (RCUR && RCUR.id === p.id ? RCUR.ui : null);
  if (!RCUR || RCUR.id !== p.id) RCUR = { id: p.id, edits: {}, sel: {}, ui: {} };
  if (p.legacyId && route !== '/realizacja/' + p.id) google.script.history.replace(null, null, '/realizacja/' + p.id);
  const appr = p.can.approve;
  p.terms.forEach(t => { if (t.canApprove && RCUR.sel[t.id] === undefined) RCUR.sel[t.id] = !t.conflict; });
  const props = p.terms.filter(t => t.status === TS().proposal && t.proposed);
  const calNotes = p.terms.filter(t => t.calChanged);
  const termsHtml = p.terms.map(t => {
    const e = editedTerm(p, t), editable = appr && t.canApprove;
    const st = editable && DAYCACHE[e.date] ? termState(e, t.id) : null;
    // Przy edycji akceptującego stan liczony na żywo z kalendarza; poza tym — zapisany przy zgłoszeniu.
    const out = st ? sr_outOfHours(e, hs()) : t.outOfHours, conf = st ? !!st.conflict : !!(t.conflict && t.status === TS().pending);
    const flags = [out ? '<span class="badge-s warn">poza godzinami</span>' : '', conf ? `<span class="badge-s bad" title="${esc(st ? st.txt : t.conflict)}">kolizja${st ? ': ' + esc(st.txt.replace(/^Nachodzi na /, '')) : t.conflict ? ': ' + esc(t.conflict) : ''}</span>` : '',
      st && st.cls === 'bad' ? `<span class="badge-s bad">${esc(st.txt)}</span>` : ''].join('');
    return `<div class="tm-row ${editable ? 'ed' : ''}" data-term="${esc(t.id)}">
      ${appr ? `<span class="tm-c">${editable ? `<input type="checkbox" data-sel="${esc(t.id)}" ${RCUR.sel[t.id] ? 'checked' : ''}>` : ''}</span>` : ''}
      <span class="tm-w">${editable ? `<input type="date" class="sel" data-ed="date" value="${esc(e.date)}" min="${nowWaw().date}"> <span class="tm-tt">gotowość ${timeSel('ready', e.ready, B.rea.day[0], 23).replace('data-t=', 'data-ed=')} start ${timeSel('start', e.start, B.rea.day[0], 23.75).replace('data-t=', 'data-ed=')} koniec ${timeSel('end', e.end, B.rea.day[0], 24).replace('data-t=', 'data-ed=')} zwijanie ${minSel('teardownMin', e.teardownMin, [0, 15, 30, 45, 60, 90]).replace('data-t=', 'data-ed=')}${p.kind === 'wyjazd' || p.location ? ' dojazd ' + minSel('travelMin', e.travelMin, [0, 15, 30, 45, 60, 90, 120, 180]).replace('data-t=', 'data-ed=') : ''}</span>`
        : `<b>${esc(termLine(t))}</b>`}
        ${t.teardownMin || t.travelMin ? `<span class="dim" style="font-size:12px"> · ${t.travelMin ? 'dojazd ' + t.travelMin + ' min ' : ''}${t.teardownMin ? 'zwijanie ' + t.teardownMin + ' min' : ''}</span>` : ''}
        ${t.before ? `<div class="dim" style="font-size:12px">było: ${esc(termLine(t.before))}</div>` : ''}
        ${t.status === TS().proposal && t.proposed ? `<div class="prop-l">proponowany: <b>${esc(termLine(t.proposed))}</b></div>` : ''}
        ${t.calChanged ? `<div class="dim" style="font-size:12px">${esc(t.calChanged)}</div>` : ''}
        ${t.decisionNote && t.status === TS().rejected ? `<div class="dim" style="font-size:12px">powód: ${esc(t.decisionNote)}</div>` : ''}
        ${editable ? `<div class="tm-axis">${dayAxis(e.date, e, { mini: true, skip: t.id })}</div>` : ''}
      </span>
      <span class="tm-s">${reaPill(t.status)}<span class="badges">${flags}</span>${t.canCancel ? `<button class="btn-t btn tm-x" data-cancel="${esc(t.id)}">anuluj</button>` : ''}</span>
    </div>`;
  }).join('');
  const kv = [['Rodzaj', p.kindLabel], ['Zgłasza', `${esc(p.requesterName)} · <a href="mailto:${esc(p.requesterEmail)}">${esc(p.requesterEmail)}</a>`], ['Brand', esc(p.brand)], ['Format', esc(p.format)],
    ['Zakres', esc(p.scope.join(', '))], ['Liczba osób', esc(p.guests)], ['Platforma', esc(p.platform)], ['Link', p.meetingLink ? (/^https?:/.test(p.meetingLink) ? `<a href="${esc(p.meetingLink)}" target="_blank" rel="noopener">${esc(p.meetingLink)}</a>` : esc(p.meetingLink)) : ''],
    ['Lokalizacja', esc(p.location)], ['Parking', esc(p.parking)], ['Zgoda Zarządu TC', esc(p.boardConsent) + (p.boardConsent === 'Nie' ? ' <span class="badge-s bad">brak zgody</span>' : '')],
    ['Forma oddania', esc(p.delivery)], ['Logo w tle', esc(p.logoBrand)],
    ['Zlecenia montażowe', p.linkedMontage.map(id => `<a href="#" data-go="/projekt/${esc(id)}">${esc(id)}</a>`).join(', ')], ['Seria', p.seriesRule && p.terms.length > 1 ? esc(sr_describe(p.seriesRule)) : ''], ['Uwagi', esc(p.notes)], ['Dlaczego ważne (kolizja)', esc(p.conflictReason)], ['Zgłoszono', fmtTs(p.createdAt)]]
    .filter(x => x[1] && x[1] !== '' && x[1] !== 'undefined');
  const anyOut = p.terms.some(t => RCUR.sel[t.id] && t.canApprove && sr_outOfHours(editedTerm(p, t), hs()));
  const approveCard = appr ? `<div class="card"><div class="card-t">Decyzja</div>
      <div class="hint" style="margin:0 0 12px">Zaznacz terminy po lewej. Przed akceptacją ustaw gotowość ekipy, zwijanie${p.kind === 'wyjazd' || p.location ? ' i dojazd' : ''} — zgłaszający dostanie „było → jest”.</div>
      <label class="bk-t" style="margin-bottom:12px">Potrzebna obsada<select class="sel" id="apStaff">${[1, 2, 3, 4].map(n => `<option ${p.staffNeeded === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      ${anyOut ? `<label class="chk warnbox"><input type="checkbox" id="apOver" ${p.can.manager ? '' : 'disabled'}> Zgoda na pracę poza godzinami ${B.rea.work[0]}:00–${B.rea.work[1]}:00${p.can.manager ? '' : ' <span class="dim">(tylko zarządzający)</span>'}</label>` : ''}
      <button class="btn btn-p btn-lg" id="apOk" style="width:100%;margin-top:6px">Akceptuj zaznaczone</button>
      <button class="btn-t btn" id="apPropOpen" style="margin-top:6px">Zaproponuj inny termin</button>
      <div id="apPropBox" hidden><div class="hint">Ustaw proponowane godziny w zaznaczonych terminach po lewej.</div><textarea class="in" id="apPropIn" style="min-height:80px;margin-top:8px" placeholder="Komentarz dla zgłaszającego (opcjonalnie)"></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn btn-g btn-sm" id="apPropCancel">Anuluj</button><button class="btn btn-p btn-sm" id="apPropSend">Wyślij propozycję</button></div></div>
      <button class="btn-t btn rej-open" id="apNoOpen">Odrzuć zaznaczone</button>
      <div id="apNoBox" hidden><label class="lbl" style="margin-top:12px">Powód odrzucenia</label><textarea class="in" id="apNoIn" style="min-height:90px" placeholder="np. brak obsady w tym terminie, prosimy o termin w godzinach pracy"></textarea>
        <div class="hint">Uzasadnienie jest wymagane i trafi mailem do zgłaszającego.</div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn btn-g btn-sm" id="apNoCancel">Anuluj</button><button class="btn btn-sm btn-rej" id="apNoSend">Odrzuć i wyślij</button></div></div>
    </div>` : '';
  const live = [RS().pending, RS().ok, RS().proposal].includes(p.status);
  const staffCard = (p.can.studio || p.can.approveAny) ? `<div class="card"><div class="card-t">Obsada · ${p.assignees.length} z ${p.staffNeeded}</div>
      ${p.assignees.length ? p.assignees.map(a => `<div class="claimed" style="margin-bottom:8px"><span class="av">${initials(a.name)}</span><div><div class="nm">${esc(a.name)}</div></div></div>`).join('') : '<p class="muted" style="margin:0 0 8px;font-size:13.5px">Nikt jeszcze nie bierze tej realizacji.</p>'}
      ${p.can.claim ? `<button class="btn btn-p" id="stClaim" style="width:100%">Biorę to</button>` : ''}${p.can.release ? `<button class="btn-t btn" id="stRel">Rezygnuję</button>` : ''}
      ${p.can.staff && !appr ? `<label class="bk-t" style="margin-top:10px">Potrzebna obsada<select class="sel" id="stNeed">${[1, 2, 3, 4].map(n => `<option ${p.staffNeeded === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>` : ''}
    </div>` : (p.assignees.length ? `<div class="card"><div class="card-t">Obsada</div>${esc(p.assignees.map(a => a.name).join(', '))}</div>` : '');
  const anyCancel = p.terms.some(t => t.canCancel);
  const actions = (p.can.montage || anyCancel) ? `<div class="card">${p.can.montage ? `<button class="btn btn-g" id="mkMontage" style="width:100%">${ICON.rolka} Utwórz zlecenie montażowe</button><div class="hint">Otworzy kreator montażu z tytułem i linkiem do tej realizacji.</div>` : ''}
      ${anyCancel ? `<button class="btn btn-g" id="cAll" style="width:100%;margin-top:${p.can.montage ? 14 : 0}px">Anuluj ${p.terms.filter(t => t.canCancel).length > 1 ? 'wszystkie przyszłe terminy' : 'zlecenie'}</button><div class="hint" id="cAllHint">Zwolni sloty w kalendarzu studia.</div>` : ''}</div>` : '';
  const banner = props.length && p.can.acceptProposal ? `<div class="card sec bk-prop"><div class="w5">Studio proponuje inny termin</div>${props.map(t => `<div style="margin-top:6px"><b>${esc(termLine(t.proposed))}</b> <span class="dim">(było: ${esc(termLine(t))})</span></div>`).join('')}
      ${props[0].decisionNote ? `<div class="rej-why" style="margin-top:8px">${esc(props[0].decisionNote)}</div>` : ''}
      <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button class="btn btn-p" id="propOk">Przyjmuję termin</button><span class="hint" style="margin:auto 0">Nie pasuje? Napisz w komentarzu poniżej.</span></div></div>`
    : p.status === RS().ok ? `<div class="card sec ok-banner"><span class="ok-dot">${ICON.check}</span><div style="flex:1"><div class="w5">Zaakceptowane</div><div class="muted" style="font-size:13px">${p.holdOpen ? 'Zlecenie zostaje otwarte mimo minionych terminów.' : 'Terminy są w kalendarzu studia, zaproszenia poszły mailem.'}</div></div>${p.can.reopen ? '<button class="btn btn-g btn-sm" id="reopen">Oznacz jako zrealizowane</button>' : ''}</div>`
    : p.status === RS().done ? `<div class="card sec ok-banner"><span class="ok-dot">${ICON.check}</span><div style="flex:1"><div class="w5">Zrealizowane</div><div class="muted" style="font-size:13px">Wszystkie terminy minęły.${p.delivery === 'Zmontowany materiał' ? ' Czas na zlecenie montażowe.' : ''}</div></div>${p.can.reopen ? '<button class="btn btn-g btn-sm" id="reopen">Cofnij</button>' : ''}</div>`
    : p.status === RS().pending ? `<div class="card sec bk-wait"><div class="w5">Czeka na akceptację studia</div><div class="muted" style="font-size:13px">Godziny realizacji potwierdzamy indywidualnie. Slot jest wstępnie zablokowany w portalu.</div></div>`
    : p.status === RS().rejected ? `<div class="card sec rej-banner"><span class="rej-dot">${ICON.x}</span><div><div class="w5">Odrzucone</div><div class="rej-why">${esc((p.terms.find(t => t.decisionNote) || {}).decisionNote || '')}</div></div></div>`
    : p.status === RS().cancelled ? `<div class="card sec"><div class="w5">Anulowane</div></div>` : '';
  $('#app').innerHTML = `<section class="view">
    <button class="back" data-go="${p.can.studio || p.can.approveAny ? (appr ? '/studio/akceptacja' : '/studio/kalendarz') : '/studio/moje'}">${ICON.back} ${p.can.studio || p.can.approveAny ? (appr ? 'Do akceptacji' : 'Kalendarz studia') : 'Moje realizacje'}</button>
    <div class="bk-head"><div class="eyebrow">${esc(p.id)} · ${esc(p.kindLabel)}</div><h1 class="h1" style="margin:4px 0 10px">${esc(p.title)}</h1>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${reaPill(p.status)}<span class="badges">${reaBadges(p)}</span></div></div>
    <div class="pgrid"><div>${banner}
      ${calNotes.length ? `<div class="card sec bk-wait"><div class="w5">Termin zmieniony w kalendarzu</div>${calNotes.map(t => `<div class="muted" style="font-size:13px">${esc(t.calChanged)}</div>`).join('')}</div>` : ''}
      <div class="card sec"><div class="card-t">${p.terms.length > 1 ? `Terminy · ${p.terms.length}` : 'Termin'}</div>${termsHtml}</div>
      <div class="card sec"><div class="card-t">Opis</div><div class="brief">${esc(p.description)}</div></div>
      <div class="card sec"><dl class="kv">${kv.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${b}</dd>`).join('')}</dl>
        ${p.tech.length ? `<div class="card-t" style="margin-top:18px">Wymagania techniczne</div><ul class="tech">${p.tech.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
        ${p.agendaText ? `<div class="card-t" style="margin-top:18px">Agenda</div><div class="brief" style="font-size:14px">${esc(p.agendaText)}</div>` : ''}
        ${p.agendaFile ? `<div class="card-t" style="margin-top:18px">Agenda / scenariusz</div><a class="dl" href="${DRIVE_FILE}${encodeURIComponent(p.agendaFile.id)}/view" target="_blank" rel="noopener"><span class="muted">${ICON.doc}</span><span class="nm">${esc(p.agendaFile.name)}</span><span class="dim" style="font-size:12px">${fmtSize(p.agendaFile.size)}</span>${ICON.link}</a>` : ''}</div>
      <div class="card sec"><div class="card-t">Komentarze <span class="dim">· widzi studio i zgłaszający</span></div>
        ${p.comments.map(c => `<div class="cm${c.studio ? ' cm-st' : ''}"><div class="ch"><span>${esc(c.authorName)}${c.studio ? ' <span class="cm-tag">Studio</span>' : ''}</span><span>${fmtTs(c.ts)}</span></div><div class="cb">${esc(c.text)}</div></div>`).join('') || '<p class="muted" style="margin:0 0 12px;font-size:13.5px">Brak komentarzy. Tu ustalacie szczegóły realizacji.</p>'}
        <textarea class="in" id="rcIn" style="min-height:80px" placeholder="${p.can.studio || p.can.approveAny ? 'Napisz do zgłaszającego…' : 'Napisz do studia…'}"></textarea>
        <div style="text-align:right;margin-top:10px"><button class="btn btn-g btn-sm" id="rcAdd">Dodaj komentarz</button></div></div>
    </div><aside class="side">${approveCard}${staffCard}${actions}
      <div class="card"><div class="card-t">Historia</div><div class="timeline">${p.history.slice().reverse().map(h => `<div class="tl"><i></i><div><div>${esc(h.action)}${h.details ? ' — <span class="muted">' + esc(h.details) + '</span>' : ''}</div><div class="tt">${fmtTs(h.ts)} · ${esc(h.actor)}</div></div></div>`).join('')}</div></div>
    </aside></div></section>`;
  bindReaPage(p);
  restoreReaUi(keepUi);
  if (appr) { const ds = p.terms.filter(t => t.canApprove).map(t => editedTerm(p, t).date); if (ds.some(d => !DAYCACHE[d])) ensureDays(ds).then(() => { if (route.startsWith('/realizacja/') || route.startsWith('/rezerwacja/')) drawRea(p); }).catch(() => {}); }
}

function bindReaPage(p) {
  const act = async (btn, fn, ok) => {
    const sel = btn.tagName === 'SELECT', old = btn.innerHTML;
    btn.disabled = true; if (!sel) btn.innerHTML = '<span class="spin"></span>';
    try { const np = await fn(); if (ok) toast(ok, 'ok'); dropDays(); RCUR = { id: np.id, edits: {}, sel: {}, ui: {} }; drawRea(np); refreshReaCount(); }
    catch (e) { toast(e.message, 'bad'); btn.disabled = false; if (!sel) btn.innerHTML = old; else drawRea(p); }
  };
  const selected = () => p.terms.filter(t => t.canApprove && RCUR.sel[t.id]);
  const items = () => selected().map(t => { const e = editedTerm(p, t); return { id: t.id, date: e.date, ready: e.ready, start: e.start, end: e.end, teardownMin: e.teardownMin, travelMin: e.travelMin }; });
  $$('[data-sel]').forEach(c => c.onchange = () => { RCUR.sel[c.dataset.sel] = c.checked; drawRea(p); });
  $$('.tm-row.ed [data-ed]').forEach(i => i.onchange = () => {
    const id = i.closest('[data-term]').dataset.term, t = p.terms.find(x => x.id === id), e = RCUR.edits[id] = Object.assign({}, RCUR.edits[id] || {});
    const cur = editedTerm(p, t), k = i.dataset.ed;
    if (k === 'start') { const len = hmMin(cur.end) - hmMin(cur.start), lead = hmMin(cur.start) - hmMin(cur.ready); e.start = i.value; e.end = minHm(Math.min(1440, hmMin(i.value) + len)); e.ready = minHm(Math.max(0, hmMin(i.value) - lead)); }
    else e[k] = k === 'teardownMin' || k === 'travelMin' ? Number(i.value) : i.value;
    RCUR.sel[id] = true;
    ensureDays([editedTerm(p, t).date]).then(() => drawRea(p)).catch(() => drawRea(p));
  });
  $('#apOk') && ($('#apOk').onclick = e => {
    if (!selected().length) return toast('Zaznacz terminy do akceptacji.', 'bad');
    act(e.currentTarget, () => api('approveTerms', p.id, items(), { staffNeeded: Number($('#apStaff').value), overtime: !!($('#apOver') && $('#apOver').checked) }), 'Zaakceptowane — terminy są w kalendarzu studia.');
  });
  $('#apPropOpen') && ($('#apPropOpen').onclick = () => { $('#apPropBox').hidden = false; $('#apPropOpen').hidden = true; });
  $('#apPropCancel') && ($('#apPropCancel').onclick = () => { $('#apPropBox').hidden = true; $('#apPropOpen').hidden = false; });
  $('#apPropSend') && ($('#apPropSend').onclick = e => {
    if (!selected().length) return toast('Zaznacz terminy, których dotyczy propozycja.', 'bad');
    const changed = items().filter(x => { const t = p.terms.find(y => y.id === x.id); return ['date', 'ready', 'start', 'end', 'teardownMin', 'travelMin'].some(k => x[k] !== t[k]); });
    if (!changed.length) return toast('Zmień godziny lub datę w zaznaczonych terminach — to będzie propozycja.', 'bad');
    act(e.currentTarget, () => api('proposeTerms', p.id, changed, $('#apPropIn').value), 'Propozycja wysłana do zgłaszającego.');
  });
  $('#apNoOpen') && ($('#apNoOpen').onclick = () => { $('#apNoBox').hidden = false; $('#apNoOpen').hidden = true; $('#apNoIn').focus(); });
  $('#apNoCancel') && ($('#apNoCancel').onclick = () => { $('#apNoBox').hidden = true; $('#apNoOpen').hidden = false; });
  $('#apNoSend') && ($('#apNoSend').onclick = e => {
    const t = $('#apNoIn').value.trim();
    if (!selected().length) return toast('Zaznacz terminy do odrzucenia.', 'bad');
    if (t.length < 10) return toast('Uzasadnij odrzucenie (min. 10 znaków).', 'bad');
    act(e.currentTarget, () => api('rejectTerms', p.id, selected().map(x => x.id), t), 'Odrzucone, zgłaszający dostał maila.');
  });
  $('#propOk') && ($('#propOk').onclick = e => act(e.currentTarget, () => api('acceptProposal', p.id), 'Termin przyjęty — jest w kalendarzu studia.'));
  $('#stClaim') && ($('#stClaim').onclick = e => act(e.currentTarget, () => api('claimRealization', p.id), 'Jesteś w obsadzie — dopisaliśmy Cię do wydarzeń.'));
  $('#stRel') && ($('#stRel').onclick = e => act(e.currentTarget, () => api('releaseRealization', p.id), 'Zrezygnowano z realizacji.'));
  $('#stNeed') && ($('#stNeed').onchange = e => { const n = Number(e.currentTarget.value); act(e.currentTarget, () => api('setStaffNeeded', p.id, n), 'Zapisano obsadę.'); });
  $('#reopen') && ($('#reopen').onclick = e => act(e.currentTarget, () => api('setRealizationOpen', p.id, !p.holdOpen), p.holdOpen ? 'Oznaczono jako zrealizowane.' : 'Cofnięto „Zrealizowane”.'));
  $('#rcAdd') && ($('#rcAdd').onclick = e => { const t = $('#rcIn').value.trim(); if (t) act(e.currentTarget, () => api('addComment', p.id, t, ''), 'Komentarz dodany.'); });
  const twoClick = (btn, label, hintSel, hint, fn) => {
    if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = label; btn.classList.add('btn-rej'); if (hintSel && $(hintSel)) $(hintSel).textContent = hint; return; }
    fn();
  };
  $$('[data-cancel]').forEach(b => b.onclick = e => twoClick(e.currentTarget, 'na pewno?', null, '', () => act(e.currentTarget, () => api('cancelTerms', p.id, [b.dataset.cancel]), 'Termin anulowany.')));
  $('#cAll') && ($('#cAll').onclick = e => twoClick(e.currentTarget, 'Kliknij ponownie, żeby anulować', '#cAllHint', 'Terminy znikną z kalendarza studia, a druga strona dostanie maila.', () => act(e.currentTarget, () => api('cancelTerms', p.id, 'all'), 'Anulowano.')));
  $('#mkMontage') && ($('#mkMontage').onclick = () => {
    const cur = store.get('stz_draft', null) || {};
    store.set('stz_draft', Object.assign({}, cur, { linkedRea: p.id, title: cur.title || p.title, description: (cur.description ? cur.description + '\n\n' : '') + 'Materiał z realizacji ' + p.id + ' („' + p.title + '”, ' + termLine(p.terms.find(t => t.status === TS().ok) || p.terms[0]) + '). Link: ' + (B.appUrl || '') + '?r=' + p.id, brand: cur.brand || p.brand || '' }));
    store.set('stz_step', 0); if (typeof W !== 'undefined') { W.d = null; W.step = 0; }
    nav.push('/nowe');
  });
}
</script>
