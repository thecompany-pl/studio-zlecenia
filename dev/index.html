<!DOCTYPE html>
<html lang="pl">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#f5f5f7; --card:#ffffff; --card2:#fafafb;
  --line:rgba(17,17,26,.08); --line2:rgba(17,17,26,.14);
  --tx:#16161a; --mut:#6b6b76; --dim:#a3a3ad;
  --acc:#DC143C; --acc2:#c8102e; --accd:rgba(220,20,60,.08);
  --ok:#0f9d6b; --warn:#b26a00; --bad:#d92d3a; --navy:#121635;
  --r:18px; --r2:12px;
  --sh:0 1px 2px rgba(17,17,26,.04),0 10px 28px -18px rgba(17,17,26,.22);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:300 15px/1.55 Roboto,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:var(--acc2);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--tx)}
::selection{background:rgba(220,20,60,.15)}
.muted{color:var(--mut)} .dim{color:var(--dim)}
b,strong,.w5{font-weight:500}

/* --- top bar --- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:22px;padding:14px 28px;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0}
.brand img{height:16px;display:block}
.brand span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);padding-left:12px;border-left:1px solid var(--line2)}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{padding:8px 14px;border-radius:999px;color:var(--mut);font-weight:400;white-space:nowrap;transition:.2s var(--ease)}
.nav button:hover{color:var(--tx);background:rgba(17,17,26,.04)}
.nav button.on{color:var(--tx);background:rgba(17,17,26,.07)}
.nav .count{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:500}
.me{display:flex;align-items:center;gap:10px;flex-shrink:0;color:var(--mut);font-size:13px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;font-weight:500;color:#fff;background:var(--navy);flex-shrink:0;letter-spacing:.02em}
.av.lg{width:40px;height:40px;font-size:14px}

main{max-width:1240px;margin:0 auto;padding:34px 28px 90px}
.view{animation:fadeUp .45s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* --- typografia sekcji --- */
.h1{font-size:30px;font-weight:300;letter-spacing:-.01em;margin:0 0 6px}
.lead{color:var(--mut);margin:0 0 26px}
.eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--acc);font-weight:500}

/* --- przyciski --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r2);font-weight:500;font-size:14.5px;transition:.2s var(--ease);white-space:nowrap}
.btn-p{background:var(--acc);color:#fff;box-shadow:0 8px 22px -10px rgba(220,20,60,.55)}
.btn-p:hover{background:#c8102e;transform:translateY(-1px)}
.btn-p.off{background:#f1c3cd;color:#fff;box-shadow:none;transform:none}
.btn-g{border:1px solid var(--line2);color:var(--tx);background:#fff}
.btn-g:hover{border-color:rgba(17,17,26,.3)}
.btn-t{color:var(--mut);height:auto;padding:6px 4px;font-weight:400}
.btn-t:hover{color:var(--tx)}
.btn-lg{height:54px;padding:0 28px;font-size:16px;border-radius:14px}
.btn-sm{height:34px;padding:0 14px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
.btn-g .spin,.boot .spin{border-color:rgba(17,17,26,.15);border-top-color:var(--acc)}
@keyframes sp{to{transform:rotate(360deg)}}

/* --- formularze --- */
.field{margin-bottom:22px}
.lbl{display:flex;align-items:baseline;gap:8px;margin-bottom:9px;font-size:13.5px;color:var(--tx);font-weight:400}
.lbl .req{color:var(--acc)}
.lbl .opt{color:var(--dim);font-size:12px}
.hint{font-size:12.5px;color:var(--mut);margin-top:7px}
.err{font-size:12.5px;color:var(--bad);margin-top:7px;display:none}
.field.bad .err{display:block}
.field.bad .in,.field.bad .chips{border-color:rgba(217,45,58,.55)}
.in{width:100%;background:#fff;border:1px solid var(--line2);border-radius:var(--r2);padding:12px 14px;outline:none;transition:border-color .2s,box-shadow .2s}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(220,20,60,.12)}
.in::placeholder{color:var(--dim)}
.in[readonly]{color:var(--mut);background:var(--card2)}
textarea.in{min-height:150px;resize:vertical;line-height:1.55}
.in-xl{font-size:30px;font-weight:300;padding:18px 0;background:transparent;border:0;border-bottom:1px solid var(--line2);border-radius:0;letter-spacing:-.01em}
.in-xl:focus{box-shadow:none;border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.counter{font-size:12px;color:var(--dim);text-align:right;margin-top:6px}
input[type=date].in,input[type=datetime-local].in{color-scheme:light}

.chips{display:flex;flex-wrap:wrap;gap:8px;border:1px solid transparent;border-radius:14px}
.chip{padding:8px 15px;border-radius:999px;border:1px solid var(--line2);background:#fff;color:var(--tx);font-size:13.5px;font-weight:400;transition:.18s var(--ease);display:inline-flex;align-items:center;gap:7px}
.chip:hover{border-color:rgba(17,17,26,.3)}
.chip.on{background:var(--accd);border-color:var(--acc);color:var(--acc2);font-weight:500}
.sla{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;font-size:12px;color:var(--mut)}
.sla div{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card2)}
.sla b{display:block;color:var(--tx);font-weight:500}

/* --- kreator --- */
.wiz{max-width:760px;margin:0 auto}
.wiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:34px}
.prog{position:fixed;left:0;top:59px;height:2px;background:var(--acc);transition:width .5s var(--ease);z-index:19}
.stepno{font-size:12.5px;color:var(--mut);letter-spacing:.08em}
.stepno b{color:var(--tx)}
.q{font-size:34px;font-weight:300;letter-spacing:-.015em;margin:8px 0 8px;line-height:1.2}
.q-sub{color:var(--mut);margin:0 0 30px}
.wiz-foot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.wiz-foot .keys{font-size:12px;color:var(--dim)}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--line2);border-radius:5px;font-size:11px;color:var(--mut);margin:0 2px;background:#fff}
.slide-in{animation:slideIn .4s var(--ease)}
.slide-back{animation:slideBack .4s var(--ease)}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes slideBack{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);min-width:0}
.card-t{font-size:13px;color:var(--mut);margin:0 0 14px;font-weight:400;display:flex;align-items:center;gap:8px}
.card-t .n{color:var(--acc);font-weight:500}

/* dropzones — label musi być blokiem, inaczej ramka łamie się po liniach */
.dz{display:block;position:relative;border:1.5px dashed rgba(17,17,26,.18);border-radius:16px;padding:22px 16px;text-align:center;transition:.2s var(--ease);background:var(--card2);cursor:pointer}
.dz:hover,.dz.drag{border-color:var(--acc);background:#fff6f8}
.dz input{display:none}
.dz .ic{width:38px;height:38px;margin:0 auto 10px;border-radius:12px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--mut)}
.dz .t1{font-weight:400}
.dz .t2{font-size:12.5px;color:var(--mut);margin-top:3px}
.files{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.file{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;min-width:0}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.file .sz{font-size:12px;color:var(--mut);white-space:nowrap}
.file .bar{height:4px;border-radius:2px;background:rgba(17,17,26,.08);overflow:hidden;margin-top:6px}
.file .bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.file .st-ok{color:var(--ok);font-size:12px}
.file .st-err{color:var(--bad);font-size:12px}
.st-err{color:var(--bad);font-size:12px}
.x{width:26px;height:26px;border-radius:8px;color:var(--mut);display:grid;place-items:center;flex-shrink:0}
.x:hover{background:rgba(17,17,26,.06);color:var(--tx)}
.cover-prev{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:16/9;background:var(--card2) center/cover;border:1px solid var(--line)}
.cover-prev .x{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.9);color:var(--tx)}
.seg{display:inline-flex;padding:3px;border-radius:11px;background:#f0f0f3;margin-bottom:12px}
.seg button{padding:6px 14px;border-radius:8px;font-size:13px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px rgba(17,17,26,.12)}
.tc-ed{display:block;font-family:'Roboto Mono',ui-monospace,Menlo,monospace;font-size:13px;min-height:140px}
.tc-tab{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}
.tc-tab td,.tc-tab th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-weight:400}
.tc-tab th{color:var(--mut);font-size:12px}
.tc-tab .mono{font-family:'Roboto Mono',ui-monospace,Menlo,monospace;font-size:12.5px;white-space:nowrap}
.tc-tab tr.bad td{color:var(--bad)}
.tc-sum{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mut)}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.grid3 .wide{grid-column:1/-1}

/* termin */
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.preset{padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:#fff;text-align:left;transition:.18s var(--ease)}
.preset:hover{border-color:rgba(17,17,26,.3)}
.preset.on{border-color:var(--acc);background:var(--accd)}
.preset .pl{font-weight:500}
.preset .ph{font-size:12.5px;color:var(--mut);margin-top:2px}
.preset.on .ph{color:var(--acc2)}
.custom-days{display:flex;align-items:center;gap:10px;margin-top:12px}
.custom-days .in{width:90px}
.due-box{margin-top:18px;padding:20px 22px;border-radius:16px;background:linear-gradient(135deg,#fff1f4,#f4f5fb);border:1px solid rgba(220,20,60,.22)}
.due-box .k{font-size:12px;color:var(--acc2);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.due-box .v{font-size:28px;font-weight:300;margin:4px 0 6px}
.due-box .n{font-size:12.5px;color:var(--mut)}
.summary{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--mut)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* sukces */
.done{text-align:center;max-width:540px;margin:40px auto}
.done .ok-ic{width:72px;height:72px;border-radius:50%;margin:0 auto 22px;display:grid;place-items:center;background:rgba(15,157,107,.1);color:var(--ok);animation:pop .5s var(--ease)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.done .num{display:inline-block;margin:14px 0 6px;padding:6px 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-weight:500;letter-spacing:.04em}

/* --- tablica --- */
.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.stats{display:flex;gap:10px}
.stat{padding:10px 16px;border-radius:14px;background:#fff;border:1px solid var(--line);min-width:96px;box-shadow:var(--sh)}
.stat .sv{font-size:22px;font-weight:300;line-height:1.1}
.stat .sk{font-size:11.5px;color:var(--mut)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:24px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh)}
.filters .sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.filters .chip{padding:6px 12px;font-size:12.5px}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;padding:0 12px;height:36px;border-radius:10px;background:var(--card2);border:1px solid var(--line)}
.search input{flex:1;background:none;border:0;outline:none;font-size:13.5px}
.sel{height:36px;padding:0 10px;border-radius:10px;background:#fff;border:1px solid var(--line2);font-size:13px;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.tile{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);transition:transform .25s var(--ease),border-color .25s,box-shadow .25s;animation:fadeUp .45s var(--ease) both}
.tile:hover{transform:translateY(-4px);border-color:rgba(17,17,26,.16);box-shadow:0 22px 40px -22px rgba(17,17,26,.35)}
.tile-cover{position:relative;aspect-ratio:16/9;background-size:cover;background-position:center}
.tile-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18),transparent 40%,rgba(0,0,0,.45))}
.tile-cover .cat{position:absolute;left:14px;bottom:12px;z-index:1;display:flex;align-items:center;gap:7px;font-size:12px;color:#fff;font-weight:500;text-transform:capitalize}
.badge{position:absolute;top:12px;z-index:1;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:500;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.badge.st{right:12px;background:rgba(255,255,255,.92);color:var(--tx)}
.badge.pr{left:12px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);color:var(--tx);text-transform:capitalize}
.pdot{width:8px;height:8px;border-radius:50%;display:inline-block}
.p-krytyczny{background:#e11d48;box-shadow:0 0 0 3px rgba(225,29,72,.18)}
.p-wysoki{background:#f97316}
.p-średni{background:#eab308}
.p-niski{background:#10b981}
.tile-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.tile-meta{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center}
.tile-title{font-size:16px;font-weight:400;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile-fmt{display:flex;gap:5px;flex-wrap:wrap}
.fmt{font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--mut);background:#fff}
.tile-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.due{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:6px}
.due.soon{color:var(--warn)}
.due.late{color:var(--bad)}
.due.fin{color:var(--ok)}
.free{font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px dashed var(--acc);color:var(--acc2);font-weight:500}
.who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.who .av{width:26px;height:26px;font-size:10.5px}
.empty{padding:70px 20px;text-align:center;color:var(--mut);border:1.5px dashed var(--line2);border-radius:var(--r);background:#fff}
.empty .h{font-size:18px;color:var(--tx);margin-bottom:6px;font-weight:300}
.sk-tile{height:290px;border-radius:var(--r);background:linear-gradient(90deg,#ececf0 0%,#f7f7f9 50%,#ececf0 100%);background-size:200% 100%;animation:shim 1.3s infinite}
@keyframes shim{to{background-position:-200% 0}}

/* --- projekt --- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:13.5px;margin-bottom:18px}
.back:hover{color:var(--tx)}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:230px;display:flex;align-items:flex-end;background-size:cover;background-position:center;margin-bottom:24px;color:#fff;box-shadow:var(--sh)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.62))}
.hero-in{position:relative;z-index:1;padding:28px 30px;width:100%}
.hero .id{font-size:12px;letter-spacing:.12em;color:rgba(255,255,255,.8)}
.hero h1{font-size:32px;font-weight:300;margin:6px 0 12px;line-height:1.2;letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font-size:12.5px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px;align-items:start}
.side{position:sticky;top:84px;display:flex;flex-direction:column;gap:16px}
.brief{white-space:pre-wrap;line-height:1.7;font-size:15px}
.sec{margin-bottom:18px}
.claim{width:100%}
.claimed{display:flex;align-items:center;gap:12px}
.claimed .nm{font-weight:500}
.claimed .sb{font-size:12.5px;color:var(--mut)}
.st-chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st-chips .chip{justify-content:center;padding:8px 6px;font-size:12.5px}
.timeline{display:flex;flex-direction:column;font-size:13px}
.tl{display:flex;gap:12px;padding:8px 0;position:relative}
.tl::before{content:"";position:absolute;left:4px;top:20px;bottom:-8px;width:1px;background:var(--line2)}
.tl:last-child::before{display:none}
.tl i{width:9px;height:9px;border-radius:50%;background:#d6d6dc;margin-top:6px;flex-shrink:0}
.tl:first-child i{background:var(--acc)}
.tl .tt{font-size:11.5px;color:var(--dim)}
.cm{padding:12px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);margin-bottom:8px}
.cm .ch{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:4px}
.cm .cb{white-space:pre-wrap;font-size:14px}
.dl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);width:100%;text-align:left;margin-bottom:8px;transition:.2s}
.dl:hover{border-color:rgba(17,17,26,.25);background:#fff}
.dl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.final-prev{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0d0d10}
.final-prev iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.decide{border-color:rgba(220,20,60,.35);box-shadow:0 0 0 4px rgba(220,20,60,.06),var(--sh)}
.rev-left{margin-left:auto;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accd);color:var(--acc2);font-weight:500}
.rev-left.none{background:#f0f0f3;color:var(--mut)}
.rev.off textarea{background:#f4f4f6;cursor:not-allowed}
.ok-banner{display:flex;align-items:center;gap:14px;border-color:rgba(15,157,107,.35)}
.ok-dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(15,157,107,.1);color:var(--ok);flex-shrink:0}
.ok-dot svg{width:20px;height:20px}

.set-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}

  <script>
// WYGENEROWANE z Deadline.gs przez tools/build.mjs — nie edytuj ręcznie.
// Liczenie preferowanego terminu. Plik współdzielony: tools/build.mjs kopiuje go do deadline_js.html dla przeglądarki.
// Termin = 17:00 N-tego dnia roboczego po dniu zgłoszenia. Daty jako 'YYYY-MM-DD', bez stref czasowych.

var DL_END_HOUR = 17;

function dl_pad(n) { return (n < 10 ? '0' : '') + n; }

function dl_ymd(d) { return d.getUTCFullYear() + '-' + dl_pad(d.getUTCMonth() + 1) + '-' + dl_pad(d.getUTCDate()); }

function dl_addDays(ymd, n) {
  var p = ymd.split('-').map(Number);
  return dl_ymd(new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)));
}

function dl_weekday(ymd) {
  var p = ymd.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay();
}

function dl_holidaySet(holidays) {
  var s = {};
  (holidays || []).forEach(function (h) { s[typeof h === 'string' ? h : h.date] = true; });
  return s;
}

function dl_isWorkday(ymd, hs) {
  var w = dl_weekday(ymd);
  return w !== 0 && w !== 6 && !hs[ymd];
}

function dl_nextWorkday(ymd, hs) {
  do { ymd = dl_addDays(ymd, 1); } while (!dl_isWorkday(ymd, hs));
  return ymd;
}

var DL_START_HOUR = 9;

// date 'YYYY-MM-DD', hour jako liczba z ułamkiem (16:59 → 16.98), workDays ≥ 1. Zwraca 'YYYY-MM-DDT17:00'.
// Zgłoszenie po 17:00 / w weekend / w święto liczy się jak zgłoszone o 9:00 najbliższego dnia roboczego.
// cutoff (opcjonalnie, np. 12 dla avatara): zgłoszone przed tą godziną → pierwszy dzień liczy się już dziś.
function computeDeadline(date, hour, workDays, holidays, cutoff) {
  var hs = dl_holidaySet(holidays);
  var day = date, h = hour;
  if (!dl_isWorkday(day, hs) || h >= DL_END_HOUR) { day = dl_nextWorkday(day, hs); h = DL_START_HOUR; }
  var n = Math.max(1, workDays);
  if (cutoff && h < cutoff) n -= 1;
  for (var i = 0; i < n; i++) day = dl_nextWorkday(day, hs);
  return day + 'T' + dl_pad(DL_END_HOUR) + ':00';
}

// Liczba dni roboczych od dnia `fromYmd` (wyłącznie) do `toYmd` (włącznie). Ujemna, gdy termin minął.
function workdaysBetween(fromYmd, toYmd, holidays) {
  var hs = dl_holidaySet(holidays), n = 0, d = fromYmd;
  if (toYmd === fromYmd) return 0;
  if (toYmd > fromYmd) { while (d < toYmd) { d = dl_addDays(d, 1); if (dl_isWorkday(d, hs)) n++; } return n; }
  while (d > toYmd) { if (dl_isWorkday(d, hs)) n--; d = dl_addDays(d, -1); }
  return n;
}

// Polskie święta ustawowe (Wigilia wolna od 2025).
function polishHolidays(year) {
  var a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4;
  var f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  var i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  var month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  var easter = year + '-' + dl_pad(month) + '-' + dl_pad(day);
  var list = [
    [year + '-01-01', 'Nowy Rok'], [year + '-01-06', 'Trzech Króli'],
    [easter, 'Wielkanoc'], [dl_addDays(easter, 1), 'Poniedziałek Wielkanocny'],
    [year + '-05-01', 'Święto Pracy'], [year + '-05-03', 'Święto Konstytucji 3 Maja'],
    [dl_addDays(easter, 49), 'Zielone Świątki'], [dl_addDays(easter, 60), 'Boże Ciało'],
    [year + '-08-15', 'Wniebowzięcie NMP'], [year + '-11-01', 'Wszystkich Świętych'],
    [year + '-11-11', 'Święto Niepodległości'], [year + '-12-24', 'Wigilia'],
    [year + '-12-25', 'Boże Narodzenie'], [year + '-12-26', 'Drugi dzień Bożego Narodzenia']
  ];
  return list.map(function (x) { return { date: x[0], name: x[1] }; });
}

if (typeof module !== 'undefined') module.exports = { computeDeadline: computeDeadline, workdaysBetween: workdaysBetween, polishHolidays: polishHolidays, dl_weekday: dl_weekday };
</script>

function initials(name) { return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0].toUpperCase()).join(''); }
function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' kB'; }
function fmtDue(iso, long) {
  if (!iso) return '—';
  const [d, t] = iso.split('T'); const [, m, dd] = d.split('-');
  return (long ? DAYS_LONG : DAYS)[dl_weekday(d)] + ' ' + dd + '.' + m + ', ' + (t || '17:00').slice(0, 5);
}
function fmtTs(ts) { if (!ts) return ''; const [d, t] = String(ts).split('T'); const [y, m, dd] = d.split('-'); return dd + '.' + m + '.' + y + ' ' + (t || '').slice(0, 5); }
function nowWaw() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Warsaw', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, hour: Number(p.hour) + Number(p.minute) / 60 };
}
function dueInfo(t) {
  if (t.status === 'Gotowe') return { cls: 'fin', txt: 'gotowe' };
  const iso = t.confirmedDeadline || t.deadline;
  if (!iso) return { cls: '', txt: '—' };
  const ymd = iso.slice(0, 10), n = nowWaw(), hour = Number(iso.slice(11, 13)) || 17;
  if (ymd < n.date || (ymd === n.date && n.hour >= hour)) return { cls: 'late', txt: 'po terminie · ' + fmtDue(iso) };
  if (ymd === n.date) return { cls: 'soon', txt: 'dziś ' + iso.slice(11, 16) };
  const wd = workdaysBetween(n.date, ymd, HOL);
  if (ymd === dl_addDays(n.date, 1)) return { cls: 'soon', txt: 'jutro ' + iso.slice(11, 16) };
  return { cls: wd <= 1 ? 'soon' : '', txt: (wd === 1 ? 'za 1 dzień rob.' : 'za ' + wd + ' dni rob.') + ' · ' + fmtDue(iso) };
}

// --- czasówki ---
const TC_RE = /^\s*(\d{1,2}:\d{2}:\d{2}(?::\d{2})?)\s*[-–—]+\s*(\d{1,2}:\d{2}:\d{2}(?::\d{2})?)\s*(?:\|\s*(.*))?$/;
function tcSec(s) {
  const p = s.split(':').map(Number);
  if (p[1] > 59 || p[2] > 59 || (p.length === 4 && p[3] > 29)) return NaN;
  return p[0] * 3600 + p[1] * 60 + p[2] + (p.length === 4 ? p[3] / 25 : 0);
}
function fmtDur(s) { s = Math.round(s); const m = Math.floor(s / 60), r = s % 60; return (m ? m + ' min ' : '') + r + ' s'; }
function parseTC(text) {
  return String(text || '').split('\n').map((line, i) => ({ line, i })).filter(x => x.line.trim()).map(({ line, i }) => {
    const m = line.match(TC_RE);
    if (!m) return { n: i + 1, raw: line, ok: false, msg: 'format: 00:01:12 – 00:01:45 | opis' };
    const a = tcSec(m[1]), b = tcSec(m[2]);
    if (isNaN(a) || isNaN(b)) return { n: i + 1, raw: line, ok: false, msg: 'nieprawidłowy czas' };
    if (b <= a) return { n: i + 1, raw: line, ok: false, msg: 'koniec przed początkiem' };
    return { n: i + 1, ok: true, from: m[1], to: m[2], note: (m[3] || '').trim(), dur: b - a };
  });
}

function briefErrors(d) {
  const e = {};
  if (!d.title.trim()) e.title = 'Wpisz tytuł zadania.';
  else if (d.title.length > 255) e.title = 'Maksymalnie 255 znaków.';
  const dl = d.description.trim().length;
  if (dl < 40) e.description = dl ? `Jeszcze ${40 - dl} znaków — opisz cel, odbiorcę i kluczowy przekaz.` : 'Opisz zadanie (min. 40 znaków).';
  if (!d.requesterName.trim()) e.requesterName = 'Podaj imię i nazwisko.';
  const oe = d.ownerEmail.trim().toLowerCase();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(oe)) e.ownerEmail = 'Podaj adres e-mail ownera.';
  else if (!B.domains.includes(oe.split('@')[1])) e.ownerEmail = 'Tylko adresy: ' + B.domains.map(x => '@' + x).join(', ');
  if (!d.brand) e.brand = 'Wybierz brand.';
  if (!d.category) e.category = 'Wybierz kategorię.';
  if (!d.formats.length) e.formats = 'Wybierz co najmniej jeden format.';
  if (!d.platforms.length) e.platforms = 'Wybierz co najmniej jedną platformę.';
  if (!d.priority) e.priority = 'Wybierz priorytet.';
  if (d.category !== 'avatar' && !/^https?:\/\/\S+\.\S+/.test(d.materialsLink.trim())) e.materialsLink = 'Wklej link do materiałów (Drive, TransferNow, Vimeo…).';
  return e;
}
function filesErrors(d) {
  const e = {};
  const busy = [...d.scriptFiles, d.timecodesFile, d.cover].some(f => f && f.status === 'up');
  const rows = parseTC(d.tcText);
  const tcOk = d.tcMode === 'file' ? !!(d.timecodesFile && d.timecodesFile.meta) : rows.length > 0 && rows.every(r => r.ok);
  const scriptOk = d.scriptFiles.some(f => f.meta);
  if (d.tcMode === 'text' && rows.some(r => !r.ok)) e.tc = 'Popraw zaznaczone wiersze czasówek.';
  else if (!scriptOk && !tcOk) e.need = 'Dodaj scenariusz albo czasówki — bez jednego z nich studio nie ruszy.';
  if (busy) e.busy = 'Czekam, aż pliki się wgrają…';
  return e;
}
function stepErrors(step) {
  if (step === 0) { const e = briefErrors(W.d); return e.title ? { title: e.title } : {}; }
  if (step === 1) { const e = briefErrors(W.d); delete e.title; return e; }
  if (step === 2) return filesErrors(W.d);
  return W.d.workDays >= 1 && W.d.workDays <= 60 ? {} : { days: 'Podaj od 1 do 60 dni roboczych.' };
}

function refreshWizard() {
  const errs = stepErrors(W.step);
  $$('#wBody [data-f]').forEach(el => {
    const k = el.dataset.f;
    let msg = errs[k];
    if (k === 'need') msg = errs.busy || errs.tc || errs.need;
    const show = msg && (W.touched[k] || W.tried[W.step] || k === 'need' && (errs.tc || W.tried[W.step]));
    el.classList.toggle('bad', !!show);
    const er = $('.err', el); if (er) er.textContent = show ? msg : '';
  });
  const btn = $('#wNext') || $('#wSend');
  if (btn) btn.classList.toggle('off', Object.keys(errs).length > 0 || W.sending);
}

function rerenderBody() {
  const y = window.scrollY;
  $('#wBody').innerHTML = [stepTitle, stepBrief, stepFiles, stepWhen][W.step]();
  bindBody(); refreshWizard();
  window.scrollTo(0, y);
}

function goStep(delta) {
  if (delta > 0) {
    const errs = stepErrors(W.step);
    if (Object.keys(errs).length) {
      W.tried[W.step] = true; refreshWizard();
      const bad = $('#wBody .field.bad'); if (bad) bad.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
  }
  W.step = Math.max(0, Math.min(STEPS - 1, W.step + delta));
  W.dir = delta; saveDraft(); viewWizard();
}

function bindWizard() {
  $('#wNext') && ($('#wNext').onclick = () => goStep(1));
  $('#wBack') && ($('#wBack').onclick = () => goStep(-1));
  $('#wSend') && ($('#wSend').onclick = submitWizard);
  $('#wReset') && ($('#wReset').onclick = () => { if (confirm('Wyczyścić cały szkic zlecenia?')) { store.del('stz_draft'); store.del('stz_step'); W.d = null; W.step = 0; W.touched = {}; W.tried = {}; viewWizard(); } });
  bindBody();
}

    } else {

  $$('#wBody [data-preset]').forEach(b => b.onclick = () => {
    const k = b.dataset.preset; W.d.presetKey = k;

document.addEventListener('keydown', e => {
  if (!route.startsWith('/nowe') || !W.d) return;
  if (e.key === 'Escape' && W.step > 0) { e.preventDefault(); goStep(-1); }
  if (e.key === 'Enter' && !e.shiftKey) {
    const ta = e.target.tagName === 'TEXTAREA';
    if (ta && !(e.metaKey || e.ctrlKey)) return;
    if (e.target.closest && e.target.closest('button')) return;
    e.preventDefault();
    W.step < STEPS - 1 ? goStep(1) : submitWizard();
  }

// --- upload ---
const EXT = { script: ['txt', 'md', 'docx', 'doc', 'pdf', 'rtf', 'odt'], tc: ['txt', 'csv', 'edl', 'xml'], cover: ['jpg', 'jpeg', 'png', 'webp'] };
const KIND = { script: 'script', tc: 'timecodes', cover: 'cover' };
const CHUNK = 2 * 1024 * 1024;

function rid() { return Array.from(crypto.getRandomValues(new Uint8Array(12)), b => (b % 36).toString(36)).join('') + Date.now().toString(36); }
function readB64(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(file); });
}
function makeThumb(file) {
  return new Promise(res => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const W0 = 480, H0 = 270, c = document.createElement('canvas'); c.width = W0; c.height = H0;
      const s = Math.max(W0 / img.width, H0 / img.height), w = img.width * s, h = img.height * s;
      c.getContext('2d').drawImage(img, (W0 - w) / 2, (H0 - h) / 2, w, h);
      let q = .74, out = c.toDataURL('image/jpeg', q);
      while (out.length > 46000 && q > .3) { q -= .1; out = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror = () => res(''); img.src = url;
  });
}

async function uploadOne(f, file, kind) {
  try {
    const b64 = await readB64(file);
    const id = rid(), total = Math.max(1, Math.ceil(b64.length / CHUNK));
    for (let i = 0; i < total; i++) {
      await api('uploadChunk', id, i, b64.slice(i * CHUNK, (i + 1) * CHUNK));
      f.p = (i + 1) / (total + 1); updateBars();
    }
    f.meta = await api('finalizeUpload', id, total, file.name, file.type || 'application/octet-stream', kind);
    f.status = 'ok'; f.p = 1; f.at = Date.now();
  } catch (err) {
    f.status = 'err'; f.err = err.message;
  }
  saveDraft();
  updateBars();
}
// Nie przerysowuj kroku, gdy ktoś akurat pisze czasówki — straciłby fokus.
function updateBars() {
  if (!route.startsWith('/nowe') || W.step !== 2) return;
  const a = document.activeElement;
  if (a && a.closest && a.closest('#wBody') && /INPUT|TEXTAREA/.test(a.tagName)) { refreshWizard(); return; }
  rerenderBody();
}

async function addFiles(slot, files) {
  for (const file of files) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (!EXT[slot].includes(ext)) { toast(`„${file.name}" — niedozwolony typ pliku.`, 'bad'); continue; }
    if (file.size > 10 * 1024 * 1024) { toast(`„${file.name}" ma ponad 10 MB.`, 'bad'); continue; }
    const f = { name: file.name, size: file.size, status: 'up', p: 0.02 };
    if (slot === 'script') { if (W.d.scriptFiles.length >= 5) { toast('Maksymalnie 5 plików scenariusza.', 'bad'); break; } W.d.scriptFiles.push(f); }
    if (slot === 'tc') W.d.timecodesFile = f;
    if (slot === 'cover') { W.d.cover = f; W.d.coverThumb = await makeThumb(file); }
    rerenderBody();
    const p = uploadOne(f, file, KIND[slot]);
    W.pending.set(f, p); p.finally(() => W.pending.delete(f));
    if (slot !== 'script') break;
  }
}

async function submitWizard() {
  if (W.sending) return;
  for (let s = 0; s < STEPS; s++) {
    const errs = stepErrors(s);
    const real = Object.keys(errs).filter(k => k !== 'busy');
    if (real.length) { W.tried[s] = true; if (s !== W.step) { W.step = s; W.dir = -1; viewWizard(); } else refreshWizard(); toast('Uzupełnij brakujące pola.', 'bad'); return; }
  }
  W.sending = true; refreshWizard();
  const btn = $('#wSend'); btn.innerHTML = '<span class="spin"></span> Wysyłam…';
  try {
    if (W.pending.size) { btn.innerHTML = '<span class="spin"></span> Czekam na pliki…'; await Promise.all(W.pending.values()); btn.innerHTML = '<span class="spin"></span> Wysyłam…'; }
    const d = W.d;
    if ([...d.scriptFiles, d.timecodesFile, d.cover].some(f => f && f.status === 'err')) throw new Error('Któryś plik się nie wgrał — usuń go albo dodaj ponownie.');
    const rows = parseTC(d.tcText).filter(r => r.ok).map(r => ({ from: r.from, to: r.to, note: r.note }));
    const res = await api('submitRequest', {
      title: d.title.trim(), description: d.description.trim(), requesterName: d.requesterName.trim(), ownerEmail: d.ownerEmail.trim(),
      brand: d.brand, category: d.category, formats: d.formats, platforms: d.platforms, priority: d.priority,
      materialsLink: d.materialsLink.trim(), publishDate: d.publishDate,
      scriptFiles: d.scriptFiles.filter(f => f.meta).map(f => f.meta),
      timecodesFile: d.tcMode === 'file' && d.timecodesFile && d.timecodesFile.meta ? d.timecodesFile.meta : null,
      timecodes: d.tcMode === 'text' ? rows : [],
      cover: d.cover && d.cover.meta ? d.cover.meta : null, coverThumb: d.cover ? d.coverThumb : '',
      presetKey: d.presetKey, workDays: d.workDays
    });
    store.del('stz_draft'); store.del('stz_step');
    W.d = null; W.step = 0; W.touched = {}; W.tried = {}; W.sending = false;
    google.script.history.replace(null, null, '/gotowe'); route = '/gotowe'; setProg(1); renderTop();
    $('#app').innerHTML = `<section class="done view"><div class="ok-ic">${ICON.check}</div>
      <h1 class="h1">Zlecenie wysłane do studia</h1><div class="num">${esc(res.id)}</div>
      <p class="muted">Preferowany odbiór: <b style="color:var(--tx)">${fmtDue(res.deadline, true)}</b><br>Potwierdzenie poszło na Twój mail${d.ownerEmail.toLowerCase() !== B.user.email ? ' i do ownera' : ''}. Dostaniesz też maila, gdy ktoś ze studia weźmie zadanie.</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap">
        <button class="btn btn-p" data-go="/nowe">Zgłoś kolejne</button><button class="btn btn-g" data-go="/projekt/${encodeURIComponent(res.id)}">Zobacz zlecenie</button></div></section>`;
  } catch (err) {
    W.sending = false; toast(err.message, 'bad');
    if ($('#wSend')) { $('#wSend').textContent = 'Zatwierdź i wyślij do studia'; refreshWizard(); }
  }
}

function saveF() { store.set('stz_filters', Object.assign({}, F, { q: '' })); }

function drawTiles() {
  const PR = { krytyczny: 0, wysoki: 1, 'średni': 2, niski: 3 };
  const q = F.q.trim().toLowerCase();
  let list = BOARD.filter(t =>
    (F.status === 'aktywne' ? t.status !== 'Gotowe' : !F.status || t.status === F.status) &&
    (!F.brand || t.brand === F.brand) && (!F.category || t.category === F.category) &&
    (F.who !== 'moje' || t.assigneeEmail === B.user.email) && (F.who !== 'wolne' || !t.assigneeEmail) &&
    (!q || (t.title + ' ' + t.id).toLowerCase().includes(q)));
  const dueK = t => t.confirmedDeadline || t.deadline || '9999';
  list.sort(F.sort === 'priorytet' ? (a, b) => (PR[a.priority] ?? 9) - (PR[b.priority] ?? 9) || dueK(a).localeCompare(dueK(b))
    : F.sort === 'data' ? (a, b) => String(b.createdAt).localeCompare(String(a.createdAt))

}

// --- plik finalny: upload kawałkami po 4 MB prosto do Drive, podgląd w odtwarzaczu Drive ---

const FINAL_CHUNK = 4 * 1024 * 1024; // wielokrotność 256 KB (wymóg uploadu wznawialnego Drive)
// Uwaga: w tym pliku nie może wystąpić ukośnik z gwiazdką — Apps Script bierze go za komentarz i ucina resztę strony.
const FINAL_EXT = ['mp4', 'mov', 'm4v', 'webm', 'mxf', 'jpg', 'jpeg', 'png', 'gif', 'pdf'];
let FUP = null; // trwający upload: { projectId, name, size, sent }

function finalCard(p) {
  const f = p.finalFile;
  const up = FUP && FUP.projectId === p.id;
  const preview = f ? `<div class="final-prev"><iframe src="${DRIVE_FILE}${encodeURIComponent(f.id)}/preview" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe></div>
      <div class="final-meta"><span>${esc(f.name)} · ${fmtSize(f.size)} · ${esc(f.by || '')} ${fmtTs(f.at)}</span><span style="display:flex;gap:14px"><a href="${PROTO}drive.google.com/uc?export=download&id=${encodeURIComponent(f.id)}" target="_blank" rel="noopener">${ICON.dl} Pobierz</a><a href="${DRIVE_FILE}${encodeURIComponent(f.id)}/view" target="_blank" rel="noopener">${ICON.link} Otwórz w Drive</a></span></div>
      <div class="hint">Świeżo wrzucone wideo Drive przetwarza kilka minut — jeśli podgląd jest pusty, odśwież za chwilę.</div>` : '';
  const progress = up ? `<div class="file" style="margin-top:12px"><div style="flex:1;min-width:0"><div class="nm">${esc(FUP.name)}</div><div class="bar"><i id="fupBar" style="width:${Math.round(FUP.sent / FUP.size * 100)}%"></i></div></div><span class="sz" id="fupTxt">${fmtSize(FUP.sent)} / ${fmtSize(FUP.size)}</span></div>` : '';
  const drop = p.can.edit && !up ? `<label class="dz" data-final style="margin-top:${f ? 14 : 0}px"><input type="file" accept=".mp4,.mov,.m4v,.webm,.mxf,.jpg,.jpeg,.png,.gif,.pdf"><div class="ic">${ICON.up}</div><div class="t1">${f ? 'Podmień plik finalny' : 'Wrzuć plik finalny do wglądu'}</div><div class="t2">.mp4 .mov .webm .jpg .png .pdf · do 2 GB · zgłaszający zobaczy go na tej stronie</div></label>` : '';
  if (!f && !p.can.edit) return `<div class="card sec"><div class="card-t">Materiał finalny</div><p class="muted" style="margin:0;font-size:14px">Gotowy materiał pojawi się tutaj do obejrzenia, gdy studio skończy montaż.</p></div>`;
  return `<div class="card sec" id="finalCard"><div class="card-t">Materiał finalny ${f ? '' : '<span class="dim">· jeszcze nie ma</span>'}</div>${preview}${progress}${drop}</div>`;
}

function bindFinal(p) {
  const dz = $('[data-final]');
  if (!dz) return;
  const inp = $('input', dz);
  const go = file => file && uploadFinal(p, file);
  inp.onchange = () => go(inp.files[0]);
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); go(e.dataTransfer.files[0]); });
}

async function uploadFinal(p, file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (!FINAL_EXT.includes(ext)) return toast('Niedozwolony typ pliku: .' + ext, 'bad');
  if (file.size > 2 * 1024 ** 3) return toast('Plik finalny może mieć maks. 2 GB.', 'bad');
  FUP = { projectId: p.id, name: file.name, size: file.size, sent: 0 };
  drawProject(p);
  window.addEventListener('beforeunload', warnLeave);
  try {
    const id = await api('startFinalUpload', p.id, file.name, file.type || 'application/octet-stream', file.size);
    let offset = 0, res = null;
    while (offset < file.size) {
      const b64 = await readB64(file.slice(offset, offset + FINAL_CHUNK));
      res = await api('uploadFinalChunk', id, offset, b64);
      offset = res.done ? file.size : res.next;
      FUP.sent = offset;
      if ($('#fupBar')) { $('#fupBar').style.width = Math.round(offset / file.size * 100) + '%'; $('#fupTxt').textContent = fmtSize(offset) + ' / ' + fmtSize(file.size); }
    }
    FUP = null;
    toast('Plik finalny wrzucony.', 'ok');
    if (route === '/projekt/' + p.id || route === '/projekt/' + encodeURIComponent(p.id)) drawProject(res.project);
  } catch (e) {
    FUP = null; toast(e.message, 'bad'); drawProject(p);
  }
  window.removeEventListener('beforeunload', warnLeave);
}
function warnLeave(e) { e.preventDefault(); e.returnValue = ''; }

      <div class="card"><div class="card-t">Dni wolne</div>
        ${upcoming.map(h => `<div class="hol"><span>${esc(h.date.split('-').reverse().join('.'))} · <span class="muted">${esc(h.name)}</span></span><button class="x" data-rmhol="${esc(h.date)}">${ICON.x}</button></div>`).join('')}
        <div style="display:flex;gap:8px;margin-top:12px"><input class="in" type="date" id="hDate" style="padding:8px 10px"><input class="in" id="hName" placeholder="np. wyjazd firmowy" style="padding:8px 10px"><button class="btn btn-g btn-sm" id="hAdd" style="height:40px">Dodaj</button></div>
      </div>
    </div></div>`;
  const run = async (fn, ok) => { try { drawSettings(await fn()); if (ok) toast(ok, 'ok'); } catch (e) { toast(e.message, 'bad'); } };
  $('#aAdd').onclick = () => run(() => api('addAccess', $('#aEmail').value, $('#aName').value, $('#aRole').value), 'Dodano dostęp.');
  $$('[data-rmacc]').forEach(b => b.onclick = () => { if (confirm('Usunąć dostęp dla ' + b.dataset.rmacc + '?')) run(() => api('removeAccess', b.dataset.rmacc), 'Usunięto dostęp.'); });
  $('#preAdd').onclick = () => $('#pre').insertAdjacentHTML('beforeend', preRow({ label: '', hint: '', days: 1 }));
  $('#pre').onclick = e => { const x = e.target.closest('[data-rmpre]'); if (x) x.closest('.pre-row').remove(); };
  $('#preSave').onclick = () => {
    const list = $$('#pre .pre-row').map(r => ({ key: r.dataset.key, label: $('[data-p=label]', r).value.trim(), hint: $('[data-p=hint]', r).value.trim(), days: Number($('[data-p=days]', r).value), cutoff: Number($('[data-p=cutoff]', r).value) || 0 })).filter(p => p.label);
    run(() => api('savePresets', list), 'Presety zapisane.').then(() => { B.presets = list; });
  };
  $('#hAdd').onclick = () => run(() => api('addHoliday', $('#hDate').value, $('#hName').value), 'Dodano dzień wolny.').then(refreshHol);
  $$('[data-rmhol]').forEach(b => b.onclick = () => run(() => api('removeHoliday', b.dataset.rmhol)).then(refreshHol));
}
function preRow(p) { return `<div class="pre-row" data-key="${esc(p.key || '')}"><input class="in" data-p="label" value="${esc(p.label)}" placeholder="Rolka"><input class="in" data-p="hint" value="${esc(p.hint || '')}" placeholder="24 h"><input class="in" data-p="days" type="number" min="1" max="60" value="${p.days}" title="dni robocze"><input class="in" data-p="cutoff" type="number" min="10" max="17" value="${p.cutoff || ''}" placeholder="—" title="zgłoszone przed tą godziną → pierwszy dzień liczy się już dziś"><button class="x" data-rmpre title="Usuń">${ICON.x}</button></div>`; }
async function refreshHol() { try { const b = await api('getBootstrap'); HOL = b.holidays.map(h => h.date); B.holidays = b.holidays; } catch (e) {} }

// ================= START =================

(async function start() {
  window.__stzStarted = true;
  if (window.TC_LOGO) $('#logo').src = window.TC_LOGO;
  try {
    B = await api('getBootstrap');
  } catch (e) {
    $('#app').innerHTML = `<div class="boot"><div style="text-align:center;max-width:420px"><div class="h1" style="font-size:22px">Brak dostępu</div><p class="muted">${esc(e.message)}</p></div></div>`;
    return;
  }
  HOL = B.holidays.map(h => h.date);
  $('#top').hidden = false;
  google.script.history.setChangeHandler(e => render(e.location.hash));
  google.script.url.getLocation(loc => {
    const p = loc.parameter && loc.parameter.p;
    if (p && loc.parameter.t) { TOK[p] = loc.parameter.t; saveTok(); }
    render(loc.hash || (p ? '/projekt/' + p : ''));
  });
  if (isStudio()) api('listBoard').then(l => { B.freeCount = l.filter(t => !t.assigneeEmail && t.status !== 'Gotowe').length; renderTop(); }).catch(() => {});
})();
</script>
